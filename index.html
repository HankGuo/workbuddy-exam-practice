<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%2300c29a'/></svg>"><rect width='32' height='32' rx='6' fill='%23F4F1EA'/><circle cx='16' cy='16' r='7' fill='%239E3B30'/></svg>">
<title>讲师认证题库自测</title>
<style>
/* ==========================================================================
   WorkBuddy 官方家族化设计体系（对齐官网 --wb2-* 设计令牌）
   品牌绿 #00c29a / 白底 / 16-20px 圆角 / PingFang SC
   ========================================================================== */
:root{
  /* brand */
  --brand:#00c29a;
  --brand-450:#1bc69b;
  --brand-100:#ddf0ec;
  --brand-50:#f2fcfa;
  --brand-tint:rgba(27,198,155,.12);
  --text-brand:#009273;

  /* text */
  --ink:#1a1a1a;
  --ink-2:#646464;
  --ink-3:#a3a3a3;
  --ink-4:#bfbfbf;

  /* surface */
  --paper:#ffffff;
  --paper-2:#f7f8f9;
  --paper-3:#f1f2f4;
  --line:#e0e0e0;
  --line-soft:#ebebeb;

  /* status */
  --ok:#079d55;
  --ok-soft:#f3f9f6;
  --warn:#e6a23c;
  --danger:#f04b4b;

  --sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  --r-card:16px;
  --r-panel:20px;
  --r-sm:10px;
  --r-pill:999px;
  --maxw:820px;
  --header-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  font-size:16px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.bg-pattern{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(880px 460px at 10% -8%, #e9fff4 0%, rgba(233,255,244,0) 62%),
    radial-gradient(820px 420px at 92% -12%, #dbf7ff 0%, rgba(219,247,255,0) 60%),
    linear-gradient(180deg,#f7f8f9 0%,#ffffff 42%);
}
.app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  height:var(--header-h);padding:0 20px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.back{
  appearance:none;border:none;background:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--sans);font-size:15px;color:var(--ink-2);
  padding:8px 6px;min-height:44px;margin-left:-6px;border-radius:var(--r-sm);
}
.back svg{width:18px;height:18px;stroke:var(--ink-2);}
.back.hidden{display:none;}
.topTitle{flex:1;font-size:16px;font-weight:600;letter-spacing:.01em;}
.topRight{font-size:13px;color:var(--ink-3);min-height:24px;display:flex;align-items:center;gap:8px;}
.topbar .brand-dot{
  width:24px;height:24px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#0ec8a9 0%,#01c886 100%);
  box-shadow:0 2px 8px rgba(0,194,154,.35);
}
main{flex:1;padding:0 20px 48px;}

/* ---------- home ---------- */
.hero{padding:44px 0 8px;}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;letter-spacing:.06em;color:var(--text-brand);font-weight:600;
  background:var(--brand-50);border:1px solid var(--brand-100);
  border-radius:var(--r-pill);padding:5px 14px;margin-bottom:18px;
}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none;}
.hero-title{
  font-weight:700;font-size:clamp(30px,7.4vw,44px);
  line-height:1.22;margin:0 0 12px;letter-spacing:-.01em;
}
.hero-sub{margin:0;color:var(--ink-2);font-size:15px;max-width:38ch;line-height:1.8;}
.rule{height:1px;background:var(--line-soft);margin:26px 0 4px;}

.mode-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
.mode-row{
  appearance:none;width:100%;text-align:left;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  display:flex;align-items:center;gap:14px;
  padding:18px 18px;font-family:var(--sans);color:var(--ink);
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);
}
@media(hover:hover) and (pointer:fine){
  .mode-row:hover{border-color:var(--brand-450);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,194,154,.10);}
}
.mode-row:active{transform:scale(.995);}
.mode-icon{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:var(--brand-50);border:1px solid var(--brand-100);
  display:flex;align-items:center;justify-content:center;
}
.mode-icon svg{width:19px;height:19px;stroke:var(--text-brand);}
.mode-main{flex:1;min-width:0;}
.mode-name{font-size:16.5px;font-weight:600;letter-spacing:.01em;}
.mode-desc{margin-top:3px;font-size:13.5px;color:var(--ink-3);line-height:1.6;}
.mode-row .chev{width:18px;height:18px;flex:none;stroke:var(--ink-4);transition:transform .22s var(--ease);}
@media(hover:hover) and (pointer:fine){
  .mode-row:hover .chev{transform:translateX(3px);stroke:var(--brand);}
}
.mode-badge{
  font-size:12px;font-weight:600;color:var(--text-brand);background:var(--brand-50);
  border:1px solid var(--brand-100);border-radius:var(--r-pill);padding:2px 10px;
  font-variant-numeric:tabular-nums;flex:none;
}
.rand-btn{
  width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:15px;font-weight:600;padding:15px 16px;border-radius:var(--r-card);min-height:52px;
  border:1px solid var(--brand-100);background:var(--brand-50);color:var(--text-brand);
  margin:14px 0 0;transition:background .18s var(--ease),border-color .18s var(--ease);
}
.rand-btn:active{transform:scale(.995);}
@media(hover:hover) and (pointer:fine){.rand-btn:hover{background:#e7f8f3;border-color:var(--brand-450);}}

.guide{
  margin-top:24px;padding:16px 18px;border:1px solid var(--line-soft);
  border-radius:var(--r-card);background:var(--paper-2);
  font-size:13px;color:var(--ink-2);line-height:1.8;
}
.guide b{color:var(--ink);font-weight:600;}

/* ---------- segmented / filter ---------- */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0 4px;}
.seg{
  display:inline-flex;gap:4px;border:1px solid var(--line);border-radius:var(--r-pill);
  overflow:hidden;background:var(--paper-2);padding:4px;
}
.seg button{
  appearance:none;border:none;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--ink-2);white-space:nowrap;
  padding:8px 14px;border-radius:var(--r-pill);min-height:38px;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.seg button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,194,154,.28);}

/* ---------- question ---------- */
.qmeta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;color:var(--ink-3);margin:20px 0 12px;
}
.qmeta .t{font-weight:600;color:var(--ink-2);}
.qcard{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:22px 20px;box-shadow:0 1px 2px rgba(26,26,26,.03);
}
.qtext{font-size:17px;line-height:1.78;font-weight:500;color:var(--ink);margin:0 0 4px;}
.hint-multi{
  display:inline-block;margin:10px 0 0;font-size:12.5px;color:var(--text-brand);
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-pill);padding:3px 12px;
}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.opt{
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px 16px;min-height:52px;
  transition:border-color .16s var(--ease),background .16s var(--ease);
}
@media(hover:hover) and (pointer:fine){
  .opt:hover{border-color:var(--brand-450);background:var(--brand-50);}
}
.opt .lk{
  width:26px;height:26px;border-radius:50%;flex:none;margin-top:1px;
  border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  transition:all .16s var(--ease);
}
.opt .lt{flex:1;font-size:15.5px;line-height:1.68;color:var(--ink);}
.opt.sel{border-color:var(--brand);background:var(--brand-50);}
.opt.sel .lk{background:var(--brand);border-color:var(--brand);color:#fff;}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.correct .lk{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.wrong{border-color:var(--danger);background:#fdf1f1;}
.opt.wrong .lk{background:var(--danger);border-color:var(--danger);color:#fff;}

/* ---------- tags ---------- */
.tag{
  display:inline-block;font-size:12px;font-weight:600;border-radius:var(--r-pill);
  padding:2px 10px;line-height:1.7;
}
.tag.hot{color:#b3541e;background:#fff4e8;border:1px solid #ffd9b3;}
.tag.rec{color:var(--text-brand);background:var(--brand-50);border:1px solid var(--brand-100);}

/* ---------- buttons ---------- */
.btn{
  flex:1;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:15px;font-weight:600;padding:13px 16px;border-radius:var(--r-sm);min-height:50px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
  transition:all .16s var(--ease);
}
.btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.btn:hover{border-color:var(--ink-4);color:var(--ink);}}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 12px rgba(0,194,154,.26);}
@media(hover:hover) and (pointer:fine){.btn.primary:hover{background:#00ac89;border-color:#00ac89;}}
.btn.seal{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.on-saved{color:var(--text-brand);border-color:var(--brand-100);background:var(--brand-50);}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;}
.navrow{display:flex;gap:10px;margin-top:22px;}

.reveal-btn{
  width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:16px;font-weight:600;padding:16px;border-radius:var(--r-card);min-height:56px;
  border:none;background:var(--brand);color:#fff;margin-top:18px;
  box-shadow:0 4px 16px rgba(0,194,154,.28);transition:transform .16s var(--ease),background .16s var(--ease);
}
.reveal-btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.reveal-btn:hover{background:#00ac89;}}
.reveal-btn.alt{background:var(--paper);color:var(--text-brand);border:1px solid var(--brand-100);box-shadow:none;}
@media(hover:hover) and (pointer:fine){.reveal-btn.alt:hover{background:var(--brand-50);border-color:var(--brand-450);}}
.reveal-hint{font-size:13.5px;color:var(--ink-3);margin:14px 0 0;line-height:1.7;}
.kbd-hint{font-size:12.5px;color:var(--ink-4);margin-top:14px;text-align:center;}

/* ---------- explanation ---------- */
.answer{
  margin-top:20px;padding-top:20px;border-top:1px solid var(--line-soft);
  animation:fade .28s var(--ease) both;
}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ex-label{
  display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;
  color:var(--text-brand);background:var(--brand-50);border:1px solid var(--brand-100);
  border-radius:var(--r-pill);padding:3px 12px;margin-bottom:10px;
}
.ex-ans{font-size:16px;line-height:1.8;margin:0 0 16px;color:var(--ink);}
.ans-key{
  display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
  background:var(--brand);color:#fff;border-radius:8px;font-weight:700;
  font-size:14px;margin-right:10px;font-variant-numeric:tabular-nums;
}
.ex-anchor{
  font-size:14.5px;line-height:1.8;color:var(--ink-2);margin:0 0 16px;
  background:var(--paper-2);border-left:3px solid var(--brand);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:10px 14px;
}
.ex-plain{margin:0 0 18px;}
.ex-plain p{margin:0;font-size:15.5px;line-height:1.95;color:var(--ink);}
.ex-concepts{margin:0 0 8px;}
.cc-list{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
.cc-card{
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-card);
  padding:16px 18px;animation:fade .3s var(--ease) both;
}
.cc-t{font-size:15.5px;font-weight:700;color:var(--ink);margin:0 0 8px;}
.cc-life{font-size:14.5px;line-height:1.9;color:var(--ink);margin:0 0 10px;}
.cc-life::before{
  content:"打个比方";display:inline-block;font-size:11.5px;font-weight:600;color:var(--text-brand);
  background:#fff;border:1px solid var(--brand-100);border-radius:var(--r-pill);
  padding:2px 9px;margin-right:8px;vertical-align:2px;
}
.cc-body{font-size:13.5px;line-height:1.85;color:var(--ink-2);border-top:1px dashed var(--brand-100);padding-top:10px;}
.concept-intro{
  font-size:14.5px;line-height:1.85;color:var(--ink-2);background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;margin:18px 0 4px;
}

/* ---------- exam config ---------- */
.cfg-block{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:20px 18px;margin-top:16px;
}
.cfg-title{font-size:15px;font-weight:600;margin:0 0 14px;}
.cfg-note{font-size:13px;color:var(--ink-3);margin:14px 0 0;line-height:1.75;}
.cfg-block .seg{width:100%;}
.cfg-block .seg button{flex:1;}
.start-btn{
  width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:16px;font-weight:600;padding:17px;border-radius:var(--r-card);min-height:58px;
  border:none;background:var(--brand);color:#fff;margin-top:24px;
  box-shadow:0 6px 20px rgba(0,194,154,.30);transition:transform .16s var(--ease),background .16s var(--ease);
}
.start-btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.start-btn:hover{background:#00ac89;}}

/* ---------- exam HUD ---------- */
.hud{
  position:sticky;top:var(--header-h);z-index:25;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border:1px solid var(--line);border-radius:var(--r-panel);
  padding:14px 16px;margin:16px 0 0;
  box-shadow:0 2px 12px rgba(26,26,26,.04);
}
.hud-top{display:flex;align-items:center;gap:14px;}
.hud-left{flex:1;min-width:0;}
.hud-num{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.hud-num small{font-weight:500;color:var(--ink-3);font-size:13px;}
.hud-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.hud-bar{height:4px;border-radius:var(--r-pill);background:var(--paper-3);margin-top:10px;overflow:hidden;}
.hud-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-450),var(--brand));border-radius:var(--r-pill);transition:width .35s var(--ease);}
/* 计时器：环形滑动 */
.timer-ring{position:relative;width:56px;height:56px;flex:none;}
.timer-ring svg{width:56px;height:56px;transform:rotate(-90deg);}
.timer-ring .tr-bg{fill:none;stroke:var(--paper-3);stroke-width:4;}
.timer-ring .tr-fg{fill:none;stroke:var(--brand);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s var(--ease);}
.timer-ring.warn .tr-fg{stroke:var(--warn);}
.timer-ring.danger .tr-fg{stroke:var(--danger);}
.timer-ring .tr-txt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.timer-ring.warn .tr-txt{color:var(--warn);}
.timer-ring.danger .tr-txt{color:var(--danger);}
.hud-btn{
  appearance:none;border:1px solid var(--line);background:var(--paper);cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-2);
  border-radius:var(--r-pill);padding:7px 14px;min-height:34px;white-space:nowrap;
  transition:all .16s var(--ease);
}
@media(hover:hover) and (pointer:fine){.hud-btn:hover{border-color:var(--brand-450);color:var(--text-brand);}}
.hud-btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ---------- action bar ---------- */
.action-bar{
  position:sticky;bottom:0;z-index:26;
  display:flex;gap:10px;margin:22px -20px -48px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--line-soft);
}

/* ---------- answer sheet ---------- */
.sheet-mask{
  position:fixed;inset:0;z-index:40;background:rgba(26,26,26,.42);
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease);
  backdrop-filter:blur(2px);
}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--paper);border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s var(--ease);
  max-width:var(--maxw);margin:0 auto;max-height:78vh;overflow:auto;
  box-shadow:0 -8px 40px rgba(26,26,26,.14);
}
.sheet.show{transform:translateY(0);}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-hd h3{margin:0;font-size:17px;font-weight:700;}
.sheet-close{
  appearance:none;border:none;background:var(--paper-2);cursor:pointer;
  width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink-2);line-height:1;
}
.sheet-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:14px;}
.sheet-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;}
.sheet-cell{
  appearance:none;border:1px solid var(--line);background:var(--paper);cursor:pointer;
  font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-2);
  border-radius:var(--r-sm);min-height:42px;font-variant-numeric:tabular-nums;
  transition:all .14s var(--ease);
}
.sheet-cell.done{background:var(--brand-50);border-color:var(--brand-100);color:var(--text-brand);}
.sheet-cell.cur{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ---------- results ---------- */
.score-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:26px 22px;margin-top:20px;text-align:center;
  box-shadow:0 2px 16px rgba(26,26,26,.04);
}
.score-num{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.score-num small{font-size:16px;font-weight:500;color:var(--ink-3);margin-left:4px;}
.score-sub{font-size:13.5px;color:var(--ink-2);margin-top:8px;}
.score-streak{
  display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--text-brand);
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-pill);padding:4px 14px;
}
.score-pass{
  margin-top:14px;font-size:14px;font-weight:600;border-radius:var(--r-sm);padding:10px 12px;
}

text":"告诉客户个人版功能阉割严重，试用没有参考价值","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"分诊第一反应不是拦，而是给“试完不用推倒重来”的路：拉几个同事进一个项目，将来直接升企业坐席。","concepts":["triage"]},{"id":"s9","type":"single","no":9,"text":"客户已采购 WorkBuddy 企业版，研发负责人接着问：\"我们研发团队还想用 CodeBuddy，是不是要再单独买一套授权？\"讲师的正确回应是：","options":[{"key":"A","text":"需要单独购买一套 CodeBuddy 授权，两个产品分别计费","note":""},{"key":"B","text":"CodeBuddy 只随个人版赠送，企业版不包含","note":""},{"key":"C","text":"研发团队只能申请 CodeBuddy 的限时试用，无法正式使用","note":""},{"key":"D","text":"一个 License 双产品通用，企业版订阅同时覆盖 WorkBuddy 与 CodeBuddy，这也是企业版的核心卖点之一","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业版订阅同时覆盖 WorkBuddy 与 CodeBuddy，一个 License 通用，这是企业版核心卖点，不用再单买。","concepts":["version_matrix"]},{"id":"s10","type":"single","no":10,"text":"客户希望一个复杂任务可以由多个 Agent 同时协作推进，并在任务列表中持久保存、随时用 IDE 打开查看。讲师应建议对该任务执行哪种操作？","options":[{"key":"A","text":"置顶","note":""},{"key":"B","text":"重命名","note":""},{"key":"C","text":"保存到工作空间","note":"选这个"},{"key":"D","text":"归档","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"多 Agent 协作任务要持久保存、随时 IDE 打开→“保存到工作空间”。置顶/重命名/归档都不是持久化动作。","concepts":["workspace"]},{"id":"s11","type":"single","no":11,"text":"面对企业客户做产品介绍时，三场演练暴露\"无一人主动提及\"安全性要点。按照导师要求，正确做法是？","options":[{"key":"A","text":"等客户问到数据安全再讲，显得不心虚","note":""},{"key":"B","text":"开场就主动说：\"WorkBuddy所有工作内容都在您本地执行，不会造成数据泄露，也不会拿去训练AI\"——企业客户听到这条，信任立建","note":"选这个"},{"key":"C","text":"这个点太技术化，留给架构师在后续环节讲","note":""},{"key":"D","text":"放到演示最后一页一笔带过即可","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"三场演练无人提安全→导师要求开场就主动说“所有内容本地执行、不泄露、不训练”，企业客户信任立建。等客户问才讲显得心虚。","concepts":["compliance","security_3layer"]},{"id":"s12","type":"single","no":12,"text":"客户用 WorkBuddy 完成一份行业分析报告后，希望把成果直接发给部门同事，讲师应演示什么操作？","options":[{"key":"A","text":"在右侧结果区打开产物列表下拉框，右键点击对应产物文件选择分享文件；或在预览产物时选择上传至云端","note":"选这个"},{"key":"B","text":"在任务列表中将该任务置顶后即可分享","note":""},{"key":"C","text":"把任务保存到工作空间即可自动分享给同事","note":""},{"key":"D","text":"在自动化页面开启推送到小程序","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"成果发给同事：右侧结果区产物列表右键分享，或预览时上传云端。置顶/存工作空间都不等于分享。","concepts":["workspace"]},{"id":"s13","type":"single","no":13,"text":"某客户希望 AI 在做任务时能直接访问公司正在使用的外部业务服务，以获取实时数据支撑任务。应引导客户使用哪种扩展方式？","options":[{"key":"A","text":"连接器，通过连接器访问外部服务，为任务提供数据和知识支持","note":"选这个"},{"key":"B","text":"资料库，主要用于沉淀和使用企业内部知识","note":""},{"key":"C","text":"专家，用于复用专业知识与工作方法","note":""},{"key":"D","text":"技能，用于把云端 Agent 一键下发至 WorkBuddy 端的企业智能体列表","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"要 AI 访问公司外部业务服务取实时数据→用连接器。资料库是内部知识、专家是专业方法、技能是云端下发。","concepts":["connector_vs_kb"]},{"id":"s14","type":"single","no":14,"text":"客户使用 VS Code 插件登录时报错，提示 timeout of 30000ms exceeded。正确的处理步骤是？","options":[{"key":"A","text":"顶部搜索框输入 >show out 并选择显示输出通道，将输出通道选择为 CodeBuddy，复制其中对应位置的链接并在浏览器打开，进行扫码登录","note":"⭐ 改选这个"},{"key":"B","text":"在设置中搜索 @id:workbench.externalBrowser，将默认浏览器设置为 Chrome 后重启 IDE","note":"⚠️ 至少不是这个"},{"key":"C","text":"在设置中搜索 shell，将 Terminal > Integrated > Shell Integrated 开启为 Enable","note":""},{"key":"D","text":"在设置中搜索 gallery，将地址配置为 https://marketplace.visualstudio.com 后重启 IDE","note":""}],"answer":["A"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"VS Code 登录 timeout：>show out 打开输出通道选 CodeBuddy，复制链接浏览器扫码","plain":"VS Code 插件登录 timeout：顶部搜索 >show out 打开输出通道选 CodeBuddy，复制链接浏览器扫码。改默认浏览器/开 shell/改 gallery 都不是正解（锚点题）。","concepts":[]},{"id":"s15","type":"single","no":15,"text":"客户希望调用「AI 问答 API、平台管理 API、乐享 Claw MCP」对接自有系统。该能力属于旗舰版内置产品的哪一类权益？","options":[{"key":"A","text":"腾讯乐享知识库的可升级权益（开放平台）","note":"选这个"},{"key":"B","text":"腾讯乐享知识库的旗舰版内置权益","note":""},{"key":"C","text":"腾讯文档的可升级权益（企业个性化与系统集成）","note":""},{"key":"D","text":"安全与效能运营平台的旗舰版内置权益","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"AI 问答 API、平台管理 API、乐享 Claw MCP 这类“开放平台”能力，属腾讯乐享知识库的“可升级权益”，不是腾讯文档内置。","concepts":["connector_vs_kb","mcp"]},{"id":"s16","type":"single","no":16,"text":"客户希望把企业内部系统和外部服务接入 WorkBuddy，以扩展 AI 能力。讲师应介绍哪项能力？","options":[{"key":"A","text":"只能通过自动化定时触发外部服务，无法直接连接","note":""},{"key":"B","text":"在任务栏快捷管理连接器，连接外部服务，扩展 AI 能力","note":"选这个"},{"key":"C","text":"必须使用完全访问权限才能连接外部服务","note":""},{"key":"D","text":"在资料库中添加外部服务账号即可完成接入","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"扩展 AI 能力接外部服务：在任务栏快捷管理连接器。不是只能定时触发、也不是资料库加账号。","concepts":["connector_vs_kb"]},{"id":"s17","type":"single","no":17,"text":"客户老板问：\"这钱花出去，到底谁在用、用在哪了？你用什么回答我？\"按照支点4，正确的回应是？","options":[{"key":"A","text":"个人版也有企业级用量看板，一样能查","note":""},{"key":"B","text":"企业版管理后台，管理员一张表就能看到这个月总共用了多少额度、还剩多少、分布在哪些产品上、哪些人用得多，该视图仅向管理员开放","note":"选这个"},{"key":"C","text":"让行政每月向员工收集使用截图汇总上报","note":""},{"key":"D","text":"管理员逐个登录员工的个人账号查看用量","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"老板问“谁在用、用在哪”→企业版管理后台一张表看总额度、剩余、分布、谁用得多，仅管理员可见。个人版没有企业级看板。","concepts":["version_matrix"]},{"id":"s18","type":"single","no":18,"text":"某客户的市场专员需要为周末的线下促销活动快速产出一张活动海报，没有设计基础，希望直接用 WorkBuddy 生成。讲师应介绍哪项内置技能？","options":[{"key":"A","text":"PPT 制作，根据数据生成汇报演示文稿","note":""},{"key":"B","text":"自动化报表，合并多份 Excel 并输出图表报告","note":""},{"key":"C","text":"海报生成，根据需求生成活动海报","note":"选这个"},{"key":"D","text":"文件整理，整理 Downloads 文件夹里的图片按日期分类","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"无设计基础快速出活动海报→“海报生成”技能。PPT 制作/报表/文件整理都不是出海报。","concepts":["plugin_skill"]},{"id":"s19","type":"single","no":19,"text":"员工对未信任的工作区选择「以受限模式打开」后，下列说法正确的是？","options":[{"key":"A","text":"仍可浏览、搜索和编辑文件，但 WorkBuddy 不扫描或运行工作区配置目录下的文件，不自动加载其中的设置、规则、命令或脚本","note":"选这个"},{"key":"B","text":"工作区立即被只读锁定，任何文件都无法编辑","note":""},{"key":"C","text":"工作区会被整体隔离 24 小时，之后自动转为信任","note":""},{"key":"D","text":"受限模式下无法使用对话功能","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"以受限模式打开未信任工作区：仍能浏览/搜索/编辑文件，但 WorkBuddy 不扫描或运行配置目录下的设置/规则/脚本。不是只读锁定、也不是隔离 24h。","concepts":["permission"]},{"id":"s20","type":"single","no":20,"text":"销售问客户：\"咱们这个项目大概要拉几个人一起用？\"客户答：\"十四五个人吧。\"按照支点1\"10人硬顶\"，销售的正确说法是？","options":[{"key":"A","text":"\"个人版最多的一个档，单个项目协作人数上限是10人，第11个人就进不去了——这不是钱的问题，这是走不通\"","note":"⭐ 改选这个"},{"key":"B","text":"\"企业版AI更聪明，所以能支持更多人\"","note":"⚠️ 至少不是这个（典型错误话术陷阱）"},{"key":"C","text":"\"把项目拆成两个，分别用两个个人旗舰版账号\"","note":""},{"key":"D","text":"\"先让10个人用，其余的人排队等名额\"","note":""}],"answer":["A"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"十四五人：支点1=10人硬顶，「第11人进不去——不是钱的问题，是走不通」","plain":"14-15 人→支点1“10 人硬顶”：单项目协作上限 10 人，第 11 人进不去，这是结构性走不通，不是钱的问题。别用“AI 更聪明”糊弄（那是红线）。","concepts":["redline","triage"]},{"id":"s21","type":"single","no":21,"text":"客户 IT 负责人问：「AI 与我们内部系统对接时，怎么保证连接身份不被伪造？」关于 WorkBuddy 安全通信网关的正确回答是？","options":[{"key":"A","text":"安全通信网关支持 Gateway Token 认证与连接鉴权，配合 SSO/企业认证及 Role 权限控制，确保每一次连接都经过严格验证","note":"选这个"},{"key":"B","text":"连接不做鉴权，完全靠内网物理隔离保证安全","note":""},{"key":"C","text":"仅靠账号密码登录，无其他验证机制","note":""},{"key":"D","text":"每次连接都需要人工电话确认后才放行","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"防连接身份伪造→安全通信网关：Gateway Token 认证+连接鉴权+SSO/企业认证+Role 权限，每次连接严验证。不是靠内网隔离、也不是只靠账号密码。","concepts":["gateway"]},{"id":"s22","type":"single","no":22,"text":"客户说：\"我们先买 10 个坐席试试水，反正账号随便注册，我们 30 个同事都能登录用，对吧？\"下列讲师的纠正与促单讲法正确的是？","options":[{"key":"A","text":"告诉客户 10 个许可证可供 30 人轮流使用，只要不是同时在线就没有任何限制","note":""},{"key":"B","text":"告诉客户企业拥有的许可证数量决定了当前企业有多少用户可以同时使用 WorkBuddy 产品——10 个坐席只支持 10 人同时使用；30 位同事都要用，建议按实际使用人数配置席位，后续也可以根据实际情况扩容","note":"选这个"},{"key":"C","text":"告诉客户 10 个坐席每月共有 20,000 Credits 团队共享，30 人分着用完全够了，不需要加购席位","note":""},{"key":"D","text":"告诉客户 30 人同时使用必须购买企业专享版，100 个坐席起购，316 元/人/月","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"10 坐席只支持 10 人同时使用，不是 30 人轮流用。按实际人数配席位，后续可扩容。把坐席当“20,000 Credits 分给 30 人”是错算。","concepts":["credits","version_matrix"]},{"id":"s23","type":"single","no":23,"text":"客户说「我们已经有 AI 对话工具了，不就是聊聊天、给点建议吗」。针对这一认知，讲师最恰当的回应是？","options":[{"key":"A","text":"传统 AI 对话只能对话、提供建议，WorkBuddy 能够实际执行任务，并交付可验收的结果","note":"选这个"},{"key":"B","text":"WorkBuddy 与传统 AI 对话一样，主要价值是把文字回复写得更长","note":""},{"key":"C","text":"WorkBuddy 同样需要用户手动操作文件，只是界面更好看","note":""},{"key":"D","text":"WorkBuddy 与传统 AI 对话一样，只擅长单步骤简单任务","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"客户以为 AI 只是聊天给建议→WorkBuddy 实际能执行任务、交付可验收成果（文档/表/PPT）。这是和传统对话工具的根本区别。","concepts":[]},{"id":"s24","type":"single","no":24,"text":"客户认可自动化的价值，但表示不会写提示词，不想从零开始配置定时任务。讲师应展示什么？","options":[{"key":"A","text":"只能自己从零编写提示词，系统不提供任何模板","note":""},{"key":"B","text":"让 WorkBuddy 先创建一个专家团代写提示词","note":""},{"key":"C","text":"直接使用任务模板，覆盖新闻推送、周报生成、体检预约、学习计划等常见场景，选择后按需修改即可","note":"选这个"},{"key":"D","text":"从灵感中收藏案例后，系统会自动生成定时规则","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"不会写提示词/不想从零配定时任务→直接用任务模板（新闻推送/周报/体检预约…），选后改改即可。","concepts":["automation"]},{"id":"s25","type":"single","no":25,"text":"某客户希望部署一个需要 7×24 小时在线值守的智能客服，并要求在无任务时自动休眠以节省成本，同时希望这些 Agent 能下发到员工的 WorkBuddy 端直接使用。最适合推荐哪款产品？","options":[{"key":"A","text":"CodeBuddy","note":""},{"key":"B","text":"WorkBuddy","note":""},{"key":"C","text":"WorkBuddy Managed Agents，Agent 在云端沙箱运行，适合长程任务、在线客服、自动触发任务，并可一键下发至 WorkBuddy 端","note":"选这个"},{"key":"D","text":"腾讯混元大模型的在线接口","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"要 7×24 在线值守、无任务自动休眠、还能下发到员工端→Managed Agents（云端沙箱跑长程/在线客服/自动触发）。CodeBuddy/WorkBuddy 本体都不是为驻云设计的。","concepts":["managed_agents"]},{"id":"s26","type":"single","no":26,"text":"向研发客户介绍 CodeBuddy 时，关于其产品形态，正确的说法是？","options":[{"key":"A","text":"仅提供网页版一种形态","note":""},{"key":"B","text":"支持 IDE、插件、CLI 三种形态","note":"选这个"},{"key":"C","text":"只能以 VS Code 插件形式使用","note":""},{"key":"D","text":"必须安装独立虚拟机运行","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"CodeBuddy 产品形态：IDE、插件、CLI 三种。不是只网页版、也不是只 VS Code 插件。","concepts":["version_matrix"]},{"id":"s27","type":"single","no":27,"text":"客户反馈 WorkBuddy 启动后被拦截、登录窗口拉不起来，怀疑是安全软件导致。正确的处理建议是？","options":[{"key":"A","text":"临时退出火绒、360 安全卫士、电脑管家、Windows 安全中心后重试，WorkBuddy 常被误拦截，关闭后重试即可","note":"选这个"},{"key":"B","text":"卸载 WorkBuddy 客户端并重新下载安装最新版本","note":""},{"key":"C","text":"将网络切换为家庭网络，按官网网络排查流程逐项处理","note":""},{"key":"D","text":"登录官网从头像处进入个人主页 > 账号管理注销账号后重新注册","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"启动被拦、登录窗拉不起→多被火绒/360/电脑管家/Win 安全中心误拦，临时退出重试。直接卸载重装是大动作。","concepts":[]},{"id":"s28","type":"single","no":28,"text":"客户说：\"我自己在用挺好，公司那边以后再说。\"这是分诊表里最危险的一种\"伪装的好评\"，正确的识别与应对方法是？","options":[{"key":"A","text":"听到好评就满足，回CRM记一笔\"客户认可\"即可","note":""},{"key":"B","text":"识别方法是问满意度，满意度高就不用再跟了","note":""},{"key":"C","text":"立刻纠正客户\"个人版不适合公司场景\"，要求马上转企业版","note":""},{"key":"D","text":"识别方法是问人数而不是问满意度——用10人天花板测试他到底几个人在用，并制造时间压力：\"趁大家都说好用的时候提，最容易批\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"“我自己用挺好”是分诊里最危险的伪装好评。别问满意度，问人数（10 人天花板测试他到底几人用），再制造时间压力促单。","concepts":["triage"]},{"id":"s29","type":"single","no":29,"text":"某客户希望快速完成课题研究、竞品分析和结论整理，覆盖从资料检索、信息交叉验证到报告生成的全过程。这属于 WorkBuddy 的哪类适用场景？","options":[{"key":"A","text":"深度调研","note":"选这个"},{"key":"B","text":"日常办公","note":""},{"key":"C","text":"代码与应用开发","note":""},{"key":"D","text":"服务与知识","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"资料检索→交叉验证→报告生成全过程=深度调研场景。日常办公/代码开发/服务知识都不是。","concepts":[]},{"id":"s30","type":"single","no":30,"text":"客户在试用阶段关心账号接入方式，WorkBuddy 个人版支持哪些登录方式？","options":[{"key":"A","text":"仅支持微信登录","note":""},{"key":"B","text":"支持微信、手机号、邮箱、SSO 等多种登录方式","note":"选这个"},{"key":"C","text":"仅支持手机号与邮箱登录","note":""},{"key":"D","text":"仅支持 SSO 单点登录","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"个人版支持微信/手机号/邮箱/SSO 等多种登录，不是只微信、也不是只手机号邮箱。","concepts":[]},{"id":"s31","type":"single","no":31,"text":"算完账后客户说：\"那我买标准版¥99就行了。\"按照场景B的标准应对，销售应该讲什么？","options":[{"key":"A","text":"标准版单项目也能加到10个人，够用了","note":""},{"key":"B","text":"标准版积分可以共享给同事，不吃亏","note":""},{"key":"C","text":"标准版也有管理后台，公司看得见用量","note":""},{"key":"D","text":"企业版多付的这99块，买的是\"管理层能看见、资产能留下、权限能收回\"这三件事——要不要买，取决于您觉得这工具是\"大家私下用用\"还是\"公司正式投产\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"客户想买标准版 ¥99→场景B话术：企业版多 99 块买的是“管理层看得见、资产留得下、权限收得回”三件事。取决于他当“私下用”还是“公司投产”。","concepts":["redline","version_matrix"]},{"id":"s32","type":"single","no":32,"text":"客户第一次接触 WorkBuddy，在交流中问「这个东西到底能帮我干什么」，下列介绍最准确的是？","options":[{"key":"A","text":"腾讯出品的全场景 AI 工作台，用自然语言描述需求，由它自主规划和执行任务，交付文档、表格、PPT 等可直接使用的完整成果，并可连接腾讯办公生态","note":"选这个"},{"key":"B","text":"一款安装在编辑器里、专门帮程序员补全代码的 AI 编程插件","note":""},{"key":"C","text":"腾讯云提供的一站式云服务器与数据库托管服务","note":""},{"key":"D","text":"一款只能在线聊天、回答问题的通用问答机器人","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"WorkBuddy 定位：腾讯全场景 AI 工作台，自然语言描述需求→自主规划执行→交付可直接用的成果，连腾讯办公生态。不是编程插件、也不是云服务器。","concepts":[]},{"id":"s33","type":"single","no":33,"text":"客户反馈 WorkBuddy 无法读取图片、PDF、Excel、Word 等文件，最可能的原因是？","options":[{"key":"A","text":"当前模型不支持对应文件类型，或未安装相关插件与 Skill","note":"选这个"},{"key":"B","text":"请求频率受限，需要等待一段时间后再重试","note":""},{"key":"C","text":"工作空间目录未被授权，AI 无法访问任何本地文件","note":""},{"key":"D","text":"安装目录下存在用户项目目录，文件在更新时被覆盖删除","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"读不了图片/PDF/Excel/Word→多半当前模型不支持该类型，或没装对应插件/Skill。像播放器缺解码器。","concepts":["multimodal"]},{"id":"s34","type":"single","no":34,"text":"客户使用鸿蒙 6 系统的微信扫码连接机器人时一直扫码失败，正确的答复是？","options":[{"key":"A","text":"鸿蒙 6 的微信扫码当前存在不兼容情况，鸿蒙 4 可以正常连接；临时方案是先使用安卓手机完成首次扫码连接，再切换回鸿蒙微信继续使用","note":"选这个"},{"key":"B","text":"鸿蒙 4 存在不兼容，需将系统升级到鸿蒙 6 后重新扫码连接","note":""},{"key":"C","text":"需重新创建或重新填写一次 Webhook 配置，避免重复输入同一地址","note":""},{"key":"D","text":"需清除编辑器缓存，并清空 CachedExtensionVSIXs 缓存文件夹后重试","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"鸿蒙 6 微信扫码连机器人失败→鸿蒙 6 当前不兼容，鸿蒙 4 可连；临时用安卓手机首次扫码，再切回鸿蒙继续用。","concepts":[]},{"id":"s35","type":"single","no":35,"text":"讲师在给客户演示技能能力时提到\"自动化报表\"技能，它的效果是？","options":[{"key":"A","text":"根据数据生成汇报演示文稿","note":""},{"key":"B","text":"根据需求生成活动海报","note":""},{"key":"C","text":"合并多份 Excel 并输出图表报告","note":"选这个"},{"key":"D","text":"整理 Downloads 文件夹里的图片，按日期分类","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"“自动化报表”技能：合并多份 Excel 并输出图表报告。PPT/海报/文件整理是别的技能。","concepts":["plugin_skill","automation"]},{"id":"s36","type":"single","no":36,"text":"客户咨询私有化企业版的价格，希望直接拿到标准报价单。作为讲师，正确的回应是？","options":[{"key":"A","text":"按 198 元/人/月、2,376 元/人/年报价","note":""},{"key":"B","text":"按 316 元/人/月、3,792 元/人/年报价","note":""},{"key":"C","text":"私有化版价格详情请咨询私有化企业版售前咨询","note":"选这个"},{"key":"D","text":"私有化版与专享版同价，可直接按专享版报价","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"私有化企业版无标准报价单，价格请咨询私有化售前。别按 198 或 316 报，也别和专享版同价。","concepts":["private_deploy","version_matrix"]},{"id":"s37","type":"single","no":37,"text":"客户问：「AI 执行命令时万一把系统搞坏了怎么办？」关于「Bash 命令沙箱」的作用，正确的说法是？","options":[{"key":"A","text":"给每条命令加时间戳，方便事后追责","note":""},{"key":"B","text":"AI 操作与真实系统严格隔离，防止对系统造成破坏","note":"选这个"},{"key":"C","text":"完全禁止 AI 执行任何 Bash 命令","note":""},{"key":"D","text":"把所有命令转发给企业管理员审批后执行","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"客户怕 AI 执行命令搞坏系统→Bash 命令沙箱把 AI 操作与真实系统严格隔离，防破坏。不是加时间戳追责、也不是禁止执行或每条审批。","concepts":["sandbox"]},{"id":"s38","type":"single","no":38,"text":"客户反馈 WorkBuddy 升级或隔天重启后，找不到原来的工作空间文件夹和历史记录了。正确的答复是？","options":[{"key":"A","text":"打开文件管理器（Windows）或 Finder（Mac），进入 WorkBuddy 大文件夹（Windows：C:/Users/用户名/WorkBuddy，Mac：/Users/用户名/WorkBuddy），通过 WorkBuddy 打开以日期或用户自定义名字命名的文件夹即可找回原有历史记录","note":"选这个"},{"key":"B","text":"打开安装目录（Windows：C:\\Users\\用户名\\AppData\\Local\\Programs\\WorkBuddy，MacOS：/Applications/WorkBuddy.app），在 tools 文件夹中查找历史记录","note":""},{"key":"C","text":"进入 %APPDATA%\\CodeBuddyExtension\\Data\\Public\\auth 目录，将 auth 文件拷贝回新工作空间即可恢复","note":""},{"key":"D","text":"原文件夹已被系统清理无法找回，只能新建工作空间重新执行任务","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"升级/重启找不到工作空间历史→去 WorkBuddy 主文件夹（Win C:/Users/用户名/WorkBuddy，Mac 同路径）按日期/自定义名打开。安装目录、auth 目录都找错地方。","concepts":["workspace"]},{"id":"s39","type":"single","no":39,"text":"客户在任务列表中看到某个任务的状态显示为\"规划中\"，这表示什么？","options":[{"key":"A","text":"WorkBuddy 正在执行任务","note":""},{"key":"B","text":"WorkBuddy 正在分析需求并整理执行思路","note":"选这个"},{"key":"C","text":"任务等待进一步处理或输入","note":""},{"key":"D","text":"执行过程中出现问题，任务未能完成","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"任务状态“规划中”=WorkBuddy 正在分析需求、整理执行思路，不是正在执行、也不是卡住。","concepts":[]},{"id":"s40","type":"single","no":40,"text":"竞品对标课程将 WorkBuddy 的差异化优势拆解为若干「核心区隔位」。下列哪一项属于官方拆解的核心区隔位？","options":[{"key":"A","text":"价格全行业最低","note":""},{"key":"B","text":"企业安全管控","note":"选这个"},{"key":"C","text":"硬件终端赠送","note":""},{"key":"D","text":"无限量免费使用","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方核心区隔位之一是“企业安全管控”。价格最低/送硬件/无限免费都不是官方拆解的区隔位。","concepts":["security_3layer"]},{"id":"s41","type":"single","no":41,"text":"客户询问 WorkBuddy 的技能是否只能用官方内置的几种，能否把公司自己的作业流程沉淀进去。正确的介绍是？","options":[{"key":"A","text":"只能使用官方内置技能，不支持任何扩展","note":""},{"key":"B","text":"WorkBuddy 内置多技能包，覆盖文档处理、数据报表、海报设计、文件整理等场景，同时兼容 OpenClaw 社区技能导入，也支持通过自然语言创建自定义技能","note":"选这个"},{"key":"C","text":"需要通过修改客户端配置文件才能新增技能","note":""},{"key":"D","text":"技能安装后无法关闭，只能卸载","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"技能不只能用官方几个：内置多包+兼容 OpenClaw 社区导入+自然语言创建自定义技能。不用改配置、装了也能关。","concepts":["plugin_skill"]},{"id":"s42","type":"single","no":42,"text":"客户研发团队 150 人，要求部署在腾讯云专享 VPC，并需要使用专属企业插件，计划按年订阅。应推荐哪个版本、对应什么价格？","options":[{"key":"A","text":"企业旗舰版，2,376 元/人/年","note":""},{"key":"B","text":"企业专享版，3,792 元/人/年","note":"⭐ 改选这个（专享VPC+专属插件=专享版特征；316元/月×12）"},{"key":"C","text":"企业专享版，2,376 元/人/年","note":""},{"key":"D","text":"私有化企业版，3,792 元/人/年","note":"⚠️ 至少不是这个（私有化价格要咨询，不给标准价）"}],"answer":["B"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"150人专享VPC+专属插件=企业专享版，316元/月×12=3,792元/人/年","plain":"150 人、要专享 VPC、专属插件、按年→企业专享版，316 元/月×12=3,792 元/人/年。私有化无标准价（D 错），旗舰版是 2,376。","concepts":["version_matrix","private_deploy"]},{"id":"s43","type":"single","no":43,"text":"客户数据安全负责人问：「我们的数据传到服务端后会不会留存、拿去训练模型？」关于服务端数据处理原则，正确的回答是？","options":[{"key":"A","text":"数据在服务端保存 180 天供审计，到期自动删除","note":""},{"key":"B","text":"服务端仅处理数据片段，用后即弃，不保存，也不用于模型训练","note":"选这个"},{"key":"C","text":"会匿名化后用于模型训练，签协议可豁免","note":""},{"key":"D","text":"数据永久保留在专属 VPC 内供随时调取","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"数据传到服务端→仅处理片段、用后即弃、不保存、不训练。不是存 180 天审计、也不是匿名化训练。","concepts":["compliance","security_3layer"]},{"id":"s44","type":"single","no":44,"text":"客户问：\"我们现在用钉钉悟空（悟空+钉钉），凭什么换WorkBuddy？\"按照官方39项实测的分竞品打击话术，针对悟空+钉钉的正确表述是？","options":[{"key":"A","text":"「企业管控和团队协作几乎是空白」","note":"⚠️ 至少不是这个（钉钉恰恰强在协作）"},{"key":"B","text":"「研发味太重，职能岗用不起来」（更像打代码类竞品）","note":""},{"key":"C","text":"「只活在钉钉里，技能生态单薄」","note":"⭐ 改选这个"},{"key":"D","text":"「模型多不等于能落地」（更像打模型聚合类竞品）","note":""}],"answer":["C"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"凭什么换掉悟空+钉钉：「只活在钉钉里，技能生态单薄」（A 错：钉钉恰恰强在协作）","plain":"打悟空+钉钉：痛点是“只活在钉钉里，技能生态单薄”。别打“协作差”——钉钉恰恰强协作（A 错）。","concepts":["competitor"]},{"id":"s45","type":"single","no":45,"text":"客户在采购交流中说：\"我们团队二十来人，用 AI 的程度肯定不一样——做设计的同事用得多，做行政的可能一个月都点不了几次，每人 2,000 积分，用不完的不是浪费了吗？\"下列讲师的回应最符合官方计费规则、又最有利于促成订单的是？","options":[{"key":"A","text":"建议只给用量大的员工开通坐席，用得少的同事先不开通，避免积分浪费","note":""},{"key":"B","text":"告诉客户积分消耗量由模型类型、Token 用量及任务复杂度共同决定，让行政同事少用高级模型就能省下积分","note":""},{"key":"C","text":"告诉客户企业版的积分是团队内共享的：每个坐席每月 2,000 Credits 汇入共享池，轻度使用的成员用不完的积分，可以被重度使用的同事用起来，且对话问答不限频——席位越多共享池越大，同样的钱利用率更高","note":"选这个"},{"key":"D","text":"建议客户先给每人买个人版，个人版积分记在各自名下互不影响，等团队扩大后再考虑企业版","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"20 来人用量不均→企业版积分团队内共享：每席 2,000 Credits 汇入共享池，轻度用不完的被重度用的薅走，席位越多池越大。不是只给重度用的开席。","concepts":["credits"]},{"id":"s46","type":"single","no":46,"text":"关于 WorkBuddy 的数据传输安全保障，正确的说法是？","options":[{"key":"A","text":"所有数据传输采用 HTTPS 全链路加密，支持 TLS 1.2/1.3 加密协议，防窃听、篡改和中间人攻击","note":"选这个"},{"key":"B","text":"数据只在企业内网传输，不经公网","note":""},{"key":"C","text":"采用自研二进制协议，不兼容 TLS","note":""},{"key":"D","text":"仅登录环节加密，任务数据明文传输","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"传输安全：HTTPS 全链路加密，TLS 1.2/1.3，防窃听/篡改/中间人。不是只内网传、也不是只登录时加密。","concepts":["https_tls"]},{"id":"s47","type":"single","no":47,"text":"客户关注每位员工的文件存储空间，询问旗舰版内置腾讯网盘的容量。正确的是？","options":[{"key":"A","text":"企业文件存储与共享，每席 50G","note":"选这个"},{"key":"B","text":"企业文件存储与共享，每席 500G","note":""},{"key":"C","text":"Ardot 草稿文件无限量","note":""},{"key":"D","text":"无存储容量限制","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"旗舰版内置腾讯网盘：每席 50G 企业文件存储与共享。不是 500G、也不是无限。","concepts":["version_matrix"]},{"id":"s48","type":"single","no":48,"text":"客户问：\"我们团队用得比较狠，每个月赠送的积分如果不够用了怎么办？是不是只能升级更贵的版本？\"下列讲师的回应正确的是？","options":[{"key":"A","text":"告诉客户积分不够只能整体升级为企业专享版，316 元/人/月，100 个坐席起购","note":""},{"key":"B","text":"告诉客户企业旗舰版、企业专享版可以根据需求购买加量包补充用量（如 245 元购 5,000 Credits，有效期 6 个月），不需要升级版本；且系统会优先使用最先到期的积分","note":"选这个"},{"key":"C","text":"告诉客户加量包长期有效，买回来可以慢慢用，不用担心过期","note":""},{"key":"D","text":"告诉客户 2026 年 3 月 11 日前购买的加量包有效期同样是 6 个月，早买更划算","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"积分不够→买加量包补（如 245 元/5,000 Credits，6 个月有效），不用升版本；系统优先消耗最先到期的。“加量包长期有效”是错（C 错）。","concepts":["credits"]},{"id":"s49","type":"single","no":49,"text":"新销售小李打算跟客户说：\"企业版功能更强大、AI更聪明，所以更贵。\"按照红线清单，这一说法错在哪？","options":[{"key":"A","text":"没错，这是官网标准口径","note":""},{"key":"B","text":"错在价格说反了，企业版其实更便宜","note":""},{"key":"C","text":"错在可以这么说，但必须加一句\"个人版也够用\"","note":""},{"key":"D","text":"官网口径里全模型可选、无限代码补全、跨文件理解、自动任务这些核心AI能力个人版旗舰版全都有，客户去官网一比就穿帮；正确说法是企业版多的是治理能力，不是\"更聪明的模型\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"红线：不能说“企业版 AI 更聪明所以更贵”——核心 AI 能力个人旗舰版全有，客户一比就穿帮。企业版卖的是治理能力，不是更聪明模型。","concepts":["redline","version_matrix"]},{"id":"s50","type":"single","no":50,"text":"临门一脚时客户说\"我再想想\"。按照场景F，销售的收尾方式应该是什么？","options":[{"key":"A","text":"问\"您觉得我们产品怎么样？\"引导客户表态","note":""},{"key":"B","text":"发一份报价单，然后等客户主动联系","note":""},{"key":"C","text":"永远不要在\"买不买\"上收尾——问两个问题：\"先给谁开通？什么时候给他们开通？\"这两个问题一旦被回答，单子就已经在流程里了","note":"选这个"},{"key":"D","text":"直接问\"您是微信支付还是对公转账？\"","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"客户说“再想想”→场景F：永远不在“买不买”上收尾，改问“先给谁开通、什么时候开通”——这两个问题一被回答，单子已在流程里。","concepts":["triage"]},{"id":"s51","type":"single","no":51,"text":"一位 Mac 用户反馈单击 WorkBuddy 后无反应，无法拉起登录验证窗口。应指导其如何处理？","options":[{"key":"A","text":"删除应用后重新下载安装包","note":""},{"key":"B","text":"单击系统偏好设置 > 通用，将默认浏览器设为 Chrome 或 Safari，重启应用后重新登录","note":"选这个"},{"key":"C","text":"切换到完全访问权限模式后重新登录","note":""},{"key":"D","text":"在自动化页面新建任务即可触发登录","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"Mac 单击无反应拉不起登录窗→系统偏好设置设默认浏览器为 Chrome/Safari，重启重登。删应用/切完全访问都不是首选。","concepts":[]},{"id":"s52","type":"single","no":52,"text":"客户向 WorkBuddy 下发整理桌面指令后，桌面完成整理但部分文件疑似丢失。应建议客户优先检查哪里？","options":[{"key":"A","text":"目标整理目录与回收站","note":"选这个"},{"key":"B","text":"安装目录下的 tools 文件夹","note":""},{"key":"C","text":"帮助 > 打开日志文件夹中的日志 zip 包","note":""},{"key":"D","text":"%APPDATA%\\CodeBuddyExtension\\Data\\Public\\auth 目录","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"整理桌面后文件疑似丢失→先查目标整理目录与回收站。安装目录 tools、日志 zip、auth 目录都查错地方。","concepts":["workspace"]},{"id":"s53","type":"single","no":53,"text":"Mac 客户登录 WorkBuddy 一直失败，怀疑是账号文件夹权限问题。下列排查与授权操作中，符合官方建议的是？","options":[{"key":"A","text":"在终端执行 ls -la ~/Library/Application\\ Support/CodeBuddyExtension/ 等命令确认目录 owner，若不是当前用户（可用 whoami 确认），则执行 sudo chown -R $(whoami) ~/Library/Application\\ Support/CodeBuddyExtension 授权，退出并重新打开完成登录","note":"选这个"},{"key":"B","text":"在终端执行 takeown /F \"$env:APPDATA\\CodeBuddyExtension\" /R /D Y，再用 icacls 为当前用户授予完全控制权限（这是 Windows 命令）","note":""},{"key":"C","text":"在 IDE 设置中搜索 gallery，将地址配置为 https://marketplace.visualstudio.com 后重启","note":""},{"key":"D","text":"将 Editor › General › Console 路径下的 Default Encoding 设置为 GBK 后重新登录","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"Mac 登录失败疑权限→终端 ls -la 查 CodeBuddyExtension 目录 owner，不对就 sudo chown -R 改回当前用户，重开登录。B 是 Windows 命令、C/D 无关。","concepts":[]},{"id":"s54","type":"single","no":54,"text":"某客户是一家 15 人的初创研发团队，希望先小范围试用、按人数订阅、控制初期投入，且希望 1 人即可起购。作为讲师，应优先推荐哪个版本？","options":[{"key":"A","text":"企业旗舰版","note":"选这个（1 人起购、按人数订阅）"},{"key":"B","text":"企业专享版","note":""},{"key":"C","text":"私有化企业版","note":""},{"key":"D","text":"三个版本均需 100 人起购，该客户无法采购","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"15 人初创、想小范围试、按人数订阅、1 人起购→企业旗舰版（1 人起购、按人数）。专享/私有化都不止 1 人起，D 说“都 100 人起”是错。","concepts":["version_matrix"]},{"id":"s55","type":"single","no":55,"text":"某金融行业客户提出数据不出企业、系统需完全落在企业自有环境中，由企业自主运维。应推荐哪个版本？","options":[{"key":"A","text":"企业旗舰版，部署方式为腾讯云共享 VPC","note":""},{"key":"B","text":"企业专享版，部署方式为腾讯云专享 VPC","note":""},{"key":"C","text":"私有化企业版，部署方式为企业私有化","note":"选这个"},{"key":"D","text":"企业旗舰版，部署方式为企业私有化","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"金融/政企“数据不出企业、自主运维”→私有化企业版（企业私有化部署）。旗舰/专享都是云上 VPC，不是完全自有环境。","concepts":["private_deploy","version_matrix"]},{"id":"s56","type":"single","no":56,"text":"客户已将腾讯文档连接到 WorkBuddy，记得里面存过一份\"渠道返利政策\"相关文档，但想不起确切文件名。讲师应告知其最快的查找方式是？","options":[{"key":"A","text":"只能在资料库右上方的搜索框输入完整文件名关键词查找","note":""},{"key":"B","text":"新建任务，用自然语言描述需要的文档即可找到","note":"选这个"},{"key":"C","text":"必须先手动把文档整理到同一文件夹，再用全部文件视图逐个查看","note":""},{"key":"D","text":"使用\"添加到任务\"把所有文档逐个加入任务，让 WorkBuddy 逐一确认","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"连了腾讯文档但想不起文件名→新建任务用自然语言描述就能找到，不用输完整文件名、也不用先手动归类。","concepts":["connector_vs_kb"]},{"id":"m1","type":"multiple","no":1,"text":"WorkBuddy 安全体系「合规审计层」包含以下哪些措施？","options":[{"key":"A","text":"Skill 安全审计（与安全团队联动，分级风险判别）","note":"保留"},{"key":"B","text":"skill-scanner 本地安全检查","note":"保留"},{"key":"C","text":"数据本地执行不上传","note":"⭐ 补上这个"},{"key":"D","text":"将用户数据用于模型训练以持续优化效果","note":"明显错误项，永远不选"}],"answer":["A","B","C"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"合规审计层：补上「数据本地执行不上传」；「数据用于训练」永远不选","plain":"合规审计层：Skill 安全审计、skill-scanner 本地检查、数据本地执行不上传。“数据用于训练”是明显错误项，永远不选。","concepts":["security_3layer","compliance"]},{"id":"m2","type":"multiple","no":2,"text":"客户希望 WorkBuddy 更懂自家业务、能力可持续扩展。关于 WorkBuddy 的扩展机制，下列说法正确的有？","options":[{"key":"A","text":"通过专家复用专业知识与工作方法，完成分析、创作和专业处理任务","note":"保留"},{"key":"B","text":"通过连接器使用企业内部沉淀的知识为任务提供支撑","note":"⚠️ 连接器≠内部知识"},{"key":"C","text":"通过连接器访问外部服务，为任务提供数据和知识支持","note":"⭐ 补上这个"},{"key":"D","text":"通过资料库使用内部知识，为任务提供数据和知识支持","note":"保留"}],"answer":["A","C","D"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"扩展机制：连接器=外部服务、资料库=内部知识；B 张冠李戴","plain":"扩展三件套：专家=复用专业方法；连接器=连外部服务取数据；资料库=用内部知识。B 把“连接器用内部知识”张冠李戴了。","concepts":["connector_vs_kb"]},{"id":"m3","type":"multiple","no":3,"text":"右侧边栏是 WorkBuddy 的产物查看与文件管理面板，它包含以下哪些标签？","options":[{"key":"A","text":"产物 ✓","note":""},{"key":"B","text":"工作空间文件 ✓","note":""},{"key":"C","text":"变更 ✓","note":""},{"key":"D","text":"专家 ✗（不选）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"右侧边栏（产物查看与文件管理）标签：产物、工作空间文件、变更。专家不在侧边栏标签里。","concepts":["workspace"]},{"id":"m4","type":"multiple","no":4,"text":"客户采购企业旗舰版后，其企业管理能力包含以下哪些项？","options":[{"key":"A","text":"授权管理 ✓","note":""},{"key":"B","text":"单点登录 ✓","note":""},{"key":"C","text":"研效看板 ✓","note":""},{"key":"D","text":"专属企业插件 ✗（不选——版本权益，非治理能力，对应判断题「旗舰版含专属插件=错」）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业旗舰版管理能力：授权管理、单点登录(SSO)、研效看板。专属企业插件是“版本权益”不是“治理能力”（判断题也考这条）。","concepts":["version_matrix","security_3layer"]},{"id":"m5","type":"multiple","no":5,"text":"WorkBuddy 安全体系「技术防御层」包含以下哪些机制？","options":[{"key":"A","text":"Bash 命令沙箱 ✓","note":""},{"key":"B","text":"文件系统隔离 ✓","note":""},{"key":"C","text":"每月强制更换用户密码 ✗（不选）","note":""},{"key":"D","text":"防沙箱逃逸 ✓","note":""}],"answer":["A","B","D"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"技术防御层：Bash 命令沙箱、文件系统隔离、防沙箱逃逸。“每月强制换密码”不是技术防御层机制。","concepts":["security_3layer","sandbox"]},{"id":"m6","type":"multiple","no":6,"text":"关于默认权限与完全访问权限，下列说法正确的有？","options":[{"key":"A","text":"在新建任务输入框下方，单击默认权限下拉菜单，可以开启或关闭允许完全访问权限 ✓","note":""},{"key":"B","text":"默认权限下，写入或修改工作空间外的文件、删除文件或目录、执行脚本命令或外部程序时，会先弹出二次确认 ✓","note":""},{"key":"C","text":"在隔离目录里反复运行可信脚本时，可以短时间开启完全放开 ✓","note":""},{"key":"D","text":"完全访问权限会自动判断所有风险，比默认权限更安全，适合日常长期使用 ✗（反话陷阱）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"默认权限下敏感操作弹二次确认；可在输入框下拉开关完全访问；隔离目录可短时放开。但“完全访问自动判断风险、日常更安全”是反话陷阱。","concepts":["permission"]},{"id":"m7","type":"multiple","no":7,"text":"按照打单课程挖需求阶段的\"前期三板斧\"（Gap Selling），销售开场应挖出的内容包括哪些？","options":[{"key":"A","text":"最耗时最痛的重复场景（现状）——无具体场景等于伪需求 ✓","note":""},{"key":"B","text":"谁拍板、谁参与（权力）——错认决策人就永远卡在\"帮您问问\" ✓","note":""},{"key":"C","text":"为什么是现在+预算信号（紧迫感）——预算异议90%不是\"没钱\"是\"值不值\" ✓","note":""},{"key":"D","text":"客户公司的实缴资本与招投标情况 ✗（不选）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"挖需求三板斧：最痛重复场景(现状)、谁拍板(权力)、为什么现在+预算信号(紧迫感)。客户实缴资本/招投标不是要挖的。","concepts":["triage"]},{"id":"m8","type":"multiple","no":8,"text":"客户在安全评审中提出四项顾虑：①数据被用于模型训练；②员工私自安装带风险的 Skill；③外部网络随意登录；④传输过程被窃听。下列「顾虑 → WorkBuddy 对应能力」的匹配，正确的有？","options":[{"key":"A","text":"① → 服务端仅处理数据片段，用后即弃，不保存，不用于模型训练 ✓","note":""},{"key":"B","text":"② → skill-scanner 安装前本地安全检查，企业可建立获准 Skills 清单 ✓","note":""},{"key":"C","text":"③ → IP 白名单，限制特定 IP 段设备登录 ✓","note":""},{"key":"D","text":"④ → HTTPS 全链路加密，支持 TLS 1.2/1.3 ✓","note":""}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"安全四顾虑对应：①不训练→服务端用后即弃；②带风险 Skill→skill-scanner+获准清单；③外部随意登录→IP 白名单；④传输窃听→HTTPS/TLS。","concepts":["security_3layer","compliance","https_tls"]},{"id":"m9","type":"multiple","no":9,"text":"客户在默认权限下工作时弹出二次确认弹窗，担心看不懂弹窗、误放行高风险操作。讲师应提醒客户重点核对哪些内容？","options":[{"key":"A","text":"操作内容：是写文件、删文件，还是执行脚本","note":"保留"},{"key":"B","text":"影响范围：目标路径是否在本次任务的工作空间内，是否会影响桌面、下载目录、项目源码或其它重要目录","note":"保留"},{"key":"C","text":"弹窗频率：确认次数越少说明任务越安全","note":"反话陷阱，不选"},{"key":"D","text":"执行理由：这一步是否确实是完成任务所必需的","note":"⭐ 补上这个"}],"answer":["A","B","D"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"二次确认弹窗核对：补「执行理由」；「确认次数越少越安全」是反话","plain":"弹二次确认别慌：核对操作内容(写/删/执行)、影响范围(是否在工作空间内)、执行理由(是否任务必需)。“确认次数越少越安全”是反话陷阱。","concepts":["permission"]},{"id":"m10","type":"multiple","no":10,"text":"客户希望给 WorkBuddy 添加新技能，讲师可以演示哪些添加技能的方式？","options":[{"key":"A","text":"技能只能使用官方内置的，无法自行添加 ✗（不选）","note":""},{"key":"B","text":"上传技能：导入本地技能包，导入后系统自动完成配置，无需额外操作 ✓","note":""},{"key":"C","text":"查找技能：输入任务描述，WorkBuddy 自动查找相关技能 ✓","note":""},{"key":"D","text":"创建技能：输入任务描述，WorkBuddy 自动创建相关技能 ✓","note":""}],"answer":["B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"加技能三种：上传本地包、查找(描述自动找)、创建(描述自动建)。“只能官方内置”是错项。","concepts":["plugin_skill"]},{"id":"m11","type":"multiple","no":11,"text":"旗舰版内置的腾讯文档，其可升级权益包含以下哪些内容？","options":[{"key":"A","text":"安全管控增强（支持水印、文档审计、回收站时长 7 → 180 天）","note":"保留"},{"key":"B","text":"表格 2000 行 → 4 万行，表格自动化次数 100 → 5 万次/人","note":"保留"},{"key":"C","text":"企业个性化与系统集成","note":"⭐ 补上这个"},{"key":"D","text":"知识治理（有效期、知识反馈、评审、巡检、事实核验、重复检测）","note":"⚠️ 这是乐享知识库的功能，不属于腾讯文档"}],"answer":["A","B","C"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"腾讯文档可升级权益：补「企业个性化与系统集成」；D 知识治理属于乐享知识库","plain":"腾讯文档可升级权益：安全管控增强、表格 4 万行/5 万次、企业个性化与系统集成。D“知识治理”是乐享知识库功能，不属于腾讯文档。","concepts":["version_matrix","connector_vs_kb"]},{"id":"m12","type":"multiple","no":12,"text":"讲师给客户做上手培训时，以下哪些做法符合官方推荐的上手技巧？","options":[{"key":"A","text":"用\"做什么 + 有什么 + 怎么样\"把任务目标说清楚，别让 AI 猜意图 ✓","note":""},{"key":"B","text":"把大任务拆成独立的小目标，一次只推进一步 ✓","note":""},{"key":"C","text":"让 WorkBuddy 修改重要文档、方案、表格前，先复制一份备份 ✓","note":""},{"key":"D","text":"把所有工作都塞进同一个会话，避免开新任务造成上下文丢失 ✗","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方上手技巧：用“做什么+有什么+怎么样”说清目标、大任务拆小步、改重要文件前先备份。“所有工作塞同一会话”是错做法。","concepts":["automation"]},{"id":"m13","type":"multiple","no":13,"text":"插件登录时网络通信异常，显示设备连不上代码助手域名。下列排查手段中符合官方建议的是？","options":[{"key":"A","text":"重启 IDE 重新登录，并检查网络连接是否正常 ✓","note":""},{"key":"B","text":"SaaS 环境可打开腾讯云-华佗诊断，输入域名 copilot.tencent.com 后进行检测 ✓","note":""},{"key":"C","text":"检查是否有系统代理干扰、防火墙连接是否正常，以及 host 配置是否存在异常干扰 ✓","note":""},{"key":"D","text":"卸载插件并更换为其他 IDE，重新购买企业版套餐后使用 ✗","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"插件登录连不上域名：重启 IDE 查网络、SaaS 用华佗诊断 copilot.tencent.com、排查代理/防火墙/host。“卸载换 IDE 重买企业版”是错项。","concepts":[]},{"id":"m14","type":"multiple","no":14,"text":"客户问：\"你们企业版号称治理能力强，具体能管什么？\"按照企业版7大治理能力清单，下列哪些属于其中？","options":[{"key":"A","text":"SSO（单点登录） ✓","note":""},{"key":"B","text":"审计日志 ✓","note":""},{"key":"C","text":"IP白名单 ✓","note":""},{"key":"D","text":"专属企业插件 ✗（选项自己都注明了：版本权益，非治理能力）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业版治理能力：SSO、审计日志、IP 白名单等。专属企业插件是版本权益不是治理能力。","concepts":["version_matrix","security_3layer"]},{"id":"m15","type":"multiple","no":15,"text":"客户计划为研发、办公、IT 部门统一采购 AI 能力。关于 WorkBuddy Enterprise 三款产品的组合价值，下列说法正确的有？","options":[{"key":"A","text":"三款产品既可独立使用，也可在企业内统一管理与协同 ✓","note":""},{"key":"B","text":"三款产品覆盖从编码、办公到智能体运营的一体化闭环 ✓","note":""},{"key":"C","text":"Managed Agents 的云端 Agent 可下发至员工 WorkBuddy 端直接使用 ✓","note":""},{"key":"D","text":"三款产品必须整体捆绑采购，无法按需单独购买 ✗","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"三款产品(WorkBuddy/CodeBuddy/Managed Agents)可独立也可企业内统一管理协同，覆盖编码-办公-智能体闭环。“必须捆绑采购”是错项。","concepts":["version_matrix","managed_agents"]},{"id":"m16","type":"multiple","no":16,"text":"WorkBuddy Managed Agents 的全流程 Agent 生命周期治理包含以下哪些内容？","options":[{"key":"A","text":"统一身份 ✓","note":""},{"key":"B","text":"独立运行环境 ✓","note":""},{"key":"C","text":"全链路 Trace ✓","note":""},{"key":"D","text":"效果评测与持续优化 ✓","note":""}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"Managed Agents 全生命周期治理：统一身份、独立运行环境、全链路 Trace、效果评测与持续优化。四项全选。","concepts":["managed_agents"]},{"id":"m17","type":"multiple","no":17,"text":"客户已连接腾讯文档，讲师在演示时可以展示哪些能力？","options":[{"key":"A","text":"在资料库中通过关键词搜索文件，资料库支持按文档标题和按文档所有者两种检索方式 ✓","note":""},{"key":"B","text":"在资料库中选中对应文件后单击\"添加到任务\"，让 WorkBuddy 处理该文件 ✓","note":""},{"key":"C","text":"把本地 Word、Excel、PPT、PDF 等文件在资料库中勾选并添加到任务 ✓","note":""},{"key":"D","text":"在左侧边栏单击自动化图标进入并授权腾讯文档 ✗（授权不在自动化入口）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"连腾讯文档演示：资料库按标题/所有者检索、选中添加到任务、本地 Word/Excel/PPT/PDF 勾选加任务。“左侧自动化图标授权”是错(授权不在自动化入口)。","concepts":["connector_vs_kb"]},{"id":"m18","type":"multiple","no":18,"text":"企业旗舰版 10 坐席扩容到 20 坐席促单，下列说法符合官方计费规则、又有利于促成扩容的有？","options":[{"key":"A","text":"扩到 20 坐席后，企业每月的月固定用量将增加到 20 × 2,000 合计 40,000 Credits，全部汇入团队内共享使用的积分池","note":"保留"},{"key":"B","text":"扩容后每个坐席仍是 2,000 Credits/月、每月刷新、团队内共享、对话问答不限频——轻度使用的同事用不完的积分，可以被重度使用的同事用起来","note":"保留"},{"key":"C","text":"2026 年 5 月 15 日至 8 月 14 日期间办理扩容，同样可以享受首月每个坐席额外赠送 2,000 Credits 的权益","note":"⭐可疑（活动期可能已过，临场看题面）"},{"key":"D","text":"扩容后即使企业版到期，已购加量包的剩余用量仍可继续独立使用，团队不会断粮","note":"⚠️ 与加量包 6 个月有效期规则矛盾，大概率错"}],"answer":["A","B"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"扩容促单：D「到期后加量包继续独立用」与 6 个月有效期矛盾；C 活动期已过","plain":"扩到 20 坐席→月固定 40,000 Credits 汇入共享池、每席仍 2,000/月团队共享。C 活动期(5.15-8.14)可能已过；D“到期后加量包继续独立用”与 6 个月有效期矛盾，大概率错。","concepts":["credits"]},{"id":"b1","type":"bool","no":1,"text":"按照官方39项实测，WorkBuddy 30项领先六家竞品，整体身位领先2-3个月。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方 39 项实测：WorkBuddy 30 项领先六家竞品，整体身位领先 2-3 个月。对。","concepts":["competitor"]},{"id":"b2","type":"bool","no":2,"text":"企业旗舰版、企业专享版、私有化企业版的部署方式不同，分别为腾讯云共享 VPC、腾讯云专享 VPC、企业私有化。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"旗舰版=共享 VPC，专享版=专享 VPC，私有化=企业私有化。三种部署方式不同。对。","concepts":["version_matrix","private_deploy"]},{"id":"b3","type":"bool","no":3,"text":"专家本身不主动获取系统权限，仅处理用户主动提供的对话与上传文件；当配备 Skill / MCP 时才会在用户授权下间接访问文件或外部服务。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"专家本身不主动获取系统权限，只处理你主动提供的对话/文件；配了 Skill/MCP 才在授权下间接访问。对。","concepts":["mcp","permission"]},{"id":"b4","type":"bool","no":4,"text":"「WorkBuddy 的分层权限系统仅支持 allow（允许）和 deny（拒绝）两种规则，不提供中间确认机制」——错，有二次确认机制。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"分层权限系统不只是 allow/deny，还有二次确认中间机制。题干说“不提供中间确认”→错。","concepts":["permission"]},{"id":"b5","type":"bool","no":5,"text":"WorkBuddy 构建了完善的企业级安全体系，采用三层纵深防御安全架构：技术防御层、管理管控层、合规审计层。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业级安全=三层纵深防御：技术防御层、管理管控层、合规审计层。对。","concepts":["security_3layer"]},{"id":"b6","type":"bool","no":6,"text":"「CodeBuddy 只支持 Python、Java 等少数编程语言，其他技术栈无法使用」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"CodeBuddy 支持多语言，不只 Python/Java 少数几种。题干说“只支持少数”→错。","concepts":["version_matrix"]},{"id":"b7","type":"bool","no":7,"text":"「建议一次性启用所有可用技能，启用的技能越多，WorkBuddy 的能力就越强」——不符合官方推荐做法。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"不是启用越多越强——一次性全开技能不符合官方推荐（易乱、易冲突）。题干说“启越多越强”→错。","concepts":["plugin_skill"]},{"id":"b8","type":"bool","no":8,"text":"WorkBuddy Managed Agents 提供云端托管的智能体运行服务，Agent 在云端沙箱运行，可 7×24 小时不间断服务，特别适合长程任务、在线客服、自动触发任务等场景。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"Managed Agents 云端托管、沙箱运行、7×24 不间断，适合长程/在线客服/自动触发。对。","concepts":["managed_agents","sandbox"]},{"id":"b9","type":"bool","no":9,"text":"「企业旗舰版的企业管理能力已包含专属网络访问与专属企业插件」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业旗舰版管理能力不含专属网络访问与专属企业插件（那是专享版/版本权益）。题干说“已包含”→错。","concepts":["version_matrix"]},{"id":"b10","type":"bool","no":10,"text":"客户反馈 WorkBuddy 出现 14003、11133、1001 报错时，应告知客户这些错误码多与模型侧状态有关，建议优先切换模型重试，但该方法可能仅能临时缓解。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"这些报错多和模型侧状态有关，优先切模型重试，但可能只临时缓解。对。","concepts":[]},{"id":"b11","type":"bool","no":11,"text":"面对金融、政企等对数据隔离要求极高的客户，销售可推荐专有云VPC版（¥316/人/月），其核心差异化价值是物理隔离。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"金融/政企高隔离→专有云 VPC 版 ¥316/人/月，核心差异化是物理隔离。对。","concepts":["version_matrix","private_deploy"]},{"id":"b12","type":"bool","no":12,"text":"「新建自动化任务无需试运行，直接以高频率正式执行即可，出错再改也来得及」——不符合官方推荐（应先试运行）。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"自动化任务应先试运行，再正式高频率执行。题干说“无需试运行直接高频”→错。","concepts":["automation"]},{"id":"b13","type":"bool","no":13,"text":"助理支持通过微信、企业微信、QQ、钉钉、飞书等即时通讯平台，远程控制电脑上的 WorkBuddy 执行任务。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"助理可通过微信、企业微信、QQ、钉钉、飞书等 IM 远程控制电脑上的 WorkBuddy。对。","concepts":["agent_assistant"]},{"id":"b14","type":"bool","no":14,"text":"专家团会并行调用多位专家、涉及多轮模型交互，积分消耗通常为单专家的 3–5 倍。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"专家团并行调多位专家、多轮模型交互，积分消耗通常单专家的 3-5 倍。对。","concepts":["credits"]},{"id":"b15","type":"bool","no":15,"text":"「助理和连接器是一回事，都是企业自建的agent」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"助理是远程控制入口（IM 指挥本地 WorkBuddy），连接器是外部服务对接，不是“都是企业自建 agent”。题干说“是一回事”→错。","concepts":["agent_assistant","connector_vs_kb"]},{"id":"b16","type":"bool","no":16,"text":"「CodeBuddy 可提供实时的团队开发提效效果数据和全面的研发投入数据依据，帮助管理者进行人效管理」——正确。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"CodeBuddy 可提供实时团队开发提效数据、研发投入数据依据，助管理者人效管理。对。","concepts":["version_matrix"]},{"id":"b17","type":"bool","no":17,"text":"「企业版包含个人版全部能力，这是官网明写的」——不符合官方口径。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方口径：企业版不含个人版全部能力（核心 AI 能力个人旗舰版也有，但权益结构不同）。题干说“明写包含”→错。","concepts":["version_matrix"]},{"id":"b18","type":"bool","no":18,"text":"「我下班关机后，通过助理下发的远程任务还能继续在云端执行吗？」——不能。使用助理时，为保证任务顺利执行，电脑需要保持开机并运行 WorkBuddy。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"用助理下发的远程任务，电脑需保持开机并运行 WorkBuddy；关机后云端也接不住。题干说“关机还能在云端执行”→错（那是 Managed Agents，不是助理）。","concepts":["agent_assistant","managed_agents"]},{"id":"b19","type":"bool","no":19,"text":"「私有化企业版与企业专享版一样，均为赠送 2000 Credits/人、每月刷新的用量限制规则」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"私有化企业版与企业专享版用量规则不同，私有化不是“赠送 2,000 Credits/人每月刷新”。题干说“一样”→错。","concepts":["private_deploy","credits"]}];
const CONCEPTS = {"sandbox":{"t":"沙箱（Bash 命令沙箱）","life":"像给 AI 发了一套“一次性塑料手套 + 隔离操作台”。它能在台子上切菜做饭（执行命令），但碰不到你家真实厨房的刀架和燃气（真实操作系统）。就算它手滑把台子搞砸了，你家厨房毫发无损。","body":"Bash 命令沙箱把 AI 执行的命令关在隔离环境里，和你的真实系统严格分开，防止 AI 误操作搞坏系统。它不是“禁止执行”，也不是“每条命令审批”，而是“隔离跑、跑坏了不连累真机”。"},"gateway":{"t":"安全通信网关","life":"像公司前台 + 门禁卡。外部系统要连进来，不能谁敲门都进，得亮出 Gateway Token（门禁卡），再配合 SSO/企业认证和 Role 权限（前台核对身份+权限），确认是本人才放行。没卡或卡不对，一律拒之门外——连接身份就不会被伪造。","body":"安全通信网关用 Gateway Token 认证 + 连接鉴权 + SSO/企业认证 + Role 权限控制，确保每一次连接都经过严格验证。不是“内网物理隔离就完事”，也不是“只靠账号密码”。"},"private_deploy":{"t":"私有化部署","life":"别人家（SaaS/公有云）是把你数据放公共仓库，私有化是你自己盖个带锁的库房，钥匙和运行环境都在你家。金融、政企这种“数据不出门”的客户，就要这个。","body":"私有化企业版部署在企业自有环境，数据不出企业、自主运维；价格需咨询售前，没有标准报价单。区别于旗舰版（共享 VPC）/专享版（专享 VPC，云上专属、物理隔离级别）。"},"connector_vs_kb":{"t":"连接器 vs 资料库","life":"资料库是公司内部书架（沉淀内部知识，给 AI 读）；连接器是公司大门外的快递柜/API（连外部服务，给 AI 取实时数据）。别把“内部书架”和“外部快递”搞混——说“连接器用内部知识”就是张冠李戴。","body":"资料库=内部知识沉淀与检索；连接器=连接外部业务服务/API 取实时数据。两者都是扩展机制，但一个对内一个对外。"},"plugin_skill":{"t":"插件 / 技能","life":"技能像手机 App。官方内置一批（文档处理、报表、海报…），也能从社区（OpenClaw）装别人的，还能用自然语言让 AI 现做一个你公司的专属流程。不是“只能用官方几个”，也不是“装越多越牛”（开一堆反而乱）。","body":"WorkBuddy 内置多技能包，兼容 OpenClaw 社区技能导入，支持自然语言创建自定义技能。不建议一次性全开。"},"mcp":{"t":"MCP（模型连接协议）","life":"MCP 是 AI 和外部工具之间的“通用插头标准”。就像 USB-C，不管什么设备，插上就能通。专家/Skill 配了 MCP，就能在授权下访问文件或外部服务。","body":"MCP 是模型连接外部工具/数据的开放协议标准。专家本身不主动拿权限，配了 Skill/MCP 后才在用户授权下间接访问。"},"managed_agents":{"t":"托管 Agent（Managed Agents）","life":"普通 Agent 像你本人坐在电脑前干活（人走茶凉，关机就停）。Managed Agents 像雇了个 7×24 驻场外包，住在云端沙箱里，半夜也能跑长任务、自动触发、还能把成果一键下发到你同事的 WorkBuddy 端。","body":"WorkBuddy Managed Agents 提供云端托管的智能体运行服务，Agent 在云端沙箱运行，适合长程任务、在线客服、自动触发；可一键下发至 WorkBuddy 端。注意：用本地“助理”远程下发任务时，你电脑得保持开机。"},"credits":{"t":"积分 / 计费（Credits）","life":"积分像公司话费池。每席每月 2,000 Credits 汇入共享池，用得少的同事结余，能被用得狠的同事“薅”走——所以席位越多，池子越大、利用率越高。不够了买加量包（如 245 元/5,000 Credits，6 个月有效），不用升版本。加量包会“先用先到期”。","body":"企业版积分团队内共享、每月刷新、对话不限频。加量包补充用量、有效期 6 个月、系统优先消耗最先到期的。"},"redline":{"t":"红线（禁说错话）","life":"红线是公司定的“绝对不能说的错话”。比如不能说“企业版 AI 更聪明所以更贵”——因为核心 AI 能力个人旗舰版全有，客户一比就穿帮。企业版卖的是“治理能力”（看得见、留得下、收得回），不是更聪明的模型。","body":"红线清单是官方禁止的话术/说法。常见坑：把价格差异说成“模型更聪明”、签约前藏着不说积分过期（红线第5条：要主动说清）、用“10 人硬顶”逼单而非糊弄。"},"security_3layer":{"t":"安全三层纵深防御","life":"三层纵深防御像小区安保：技术防御层（沙箱、文件隔离、防逃逸——物理隔断坏人）、管理管控层（权限、二次确认——进门要登记）、合规审计层（安全审计、skill-scanner、数据本地不上传——事后追责+源头不传）。","body":"技术防御层（Bash 沙箱/文件隔离/防逃逸）+ 管理管控层（权限/二次确认）+ 合规审计层（合规审计/skill-scanner/数据本地执行不上传）。“数据用于训练”永远不选。"},"permission":{"t":"权限与二次确认","life":"默认权限像“访客模式”——AI 要删文件、改工作区外文件、跑脚本，会弹窗让你确认（二次确认）。完全访问权限像“给了万能钥匙”，日常用反而更危险。弹窗别看次数少就觉得安全，要看“它要干嘛、动到哪、是不是任务必需”。","body":"默认权限下敏感操作弹二次确认；完全访问权限不适合日常长期用（反话陷阱）。二次确认核对：操作内容、影响范围、执行理由。"},"workspace":{"t":"工作空间","life":"工作空间像你这个项目专属的文件夹。任务存进去就能持久保存、随时用 IDE 打开、和同事协作。升级/重启后找不到历史？去 WorkBuddy 大文件夹里按日期/自定义名找，别去安装目录翻。","body":"工作空间是任务与文件的持久容器。保存到工作空间 = 持久化+可协作。历史丢失时从 WorkBuddy 主文件夹（非安装目录）按日期找回。"},"compliance":{"t":"合规（数据不出事）","life":"合规就是“凭什么证明你不作恶”。WorkBuddy 符合《网络安全法》《数据安全法》《个人信息保护法》，数据服务端用后即弃、不留存、不训练。","body":"合规审计层 + 符合国内三法。服务端仅处理数据片段、用后即弃、不用于训练。"},"https_tls":{"t":"传输加密（HTTPS / TLS）","life":"HTTPS/TLS 像给数据装了防窃听信封。全程加密，中间人拆不开、改不了。不是“只在登录时加密”，也不是“明文传任务数据”。","body":"全链路 HTTPS，支持 TLS 1.2/1.3，防窃听/篡改/中间人。"},"version_matrix":{"t":"版本矩阵（买哪个）","life":"旗舰版=共享 VPC 的精装公寓；专享版=专享 VPC 带独立门禁（316 元/人/月，专有云物理隔离，100 人起）；私有化=整栋楼买断自己管（价格问售前）。旗舰版不含专属插件（那是版本权益不是治理能力）。","body":"旗舰版(共享 VPC) / 专享版(专享 VPC, 316 元/月, 100 起) / 私有化(企业自有, 询价)。专属插件是版本权益不是治理能力。"},"competitor":{"t":"竞品打击（怎么打）","life":"打竞品要打在痛处。悟空+钉钉：痛点是“只活在钉钉里、技能生态单薄”（别打“协作差”——钉钉恰恰强协作）。打代码类竞品：“研发味重、职能岗用不起来”。打模型聚合类：“模型多不等于能落地”。","body":"39 项实测分竞品话术。悟空+钉钉→“只活在钉钉里，技能生态单薄”。"},"triage":{"t":"分诊 / 转版话术","life":"分诊是“听客户一句话，判断他卡在哪”。伪装的好评（“我自己用挺好”）最危险——别问满意度，问人数（10 人天花板测试）。个人版想试？给他一条“试完不用推倒重来”的路：拉几个同事进一个项目，将来直接升企业坐席。","body":"分诊框架识别真实意图。“我先买个人版试试”→不拦，引导未来可平滑升级企业。“10 人硬顶”→第 11 人进不去，不是钱的问题。"},"automation":{"t":"自动化任务","life":"自动化像定好的闹钟任务。不会写提示词？直接用任务模板（新闻推送、周报、体检预约…）。别一上来就高频正式跑——先试运行。","body":"自动化支持任务模板、定时触发。应先试运行再高频率正式执行。"},"multimodal":{"t":"文件读取 / 多模态","life":"AI 读不了图片/PDF/Excel？多半是模型不支持该类型，或没装对应插件/Skill。就像播放器没装解码器放不了某格式。","body":"读文件失败→模型不支持或缺少插件/Skill。"},"agent_assistant":{"t":"助理（远程控制）","life":"助理像你手机上的遥控器，能微信/企微/飞书远程指挥电脑上的 WorkBuddy。但遥控器的前提是“电视开着”——电脑得保持开机运行 WorkBuddy，否则云端任务也接不住。助理≠连接器（一个是远程控制入口，一个是外部服务对接）。","body":"助理支持多 IM 远程控制；需电脑开机。助理和连接器不是一回事。"}};

</script>
<script>
"use strict";
const TYPE_LABEL={single:"单选",multiple:"多选",bool:"判断"};
const WEIGHT={single:2,multiple:3,bool:1};
const STORE_KEY="wb_exam_wrongbook_v1";

/* ---------- storage ---------- */
function loadWrong(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return[]}}
function saveWrong(a){try{localStorage.setItem(STORE_KEY,JSON.stringify(a))}catch(e){}}
function isWrong(id){return loadWrong().includes(id)}
function toggleWrong(id){let a=loadWrong();if(a.includes(id))a=a.filter(x=>x!==id);else a.push(id);saveWrong(a);return a.includes(id)}
function clearWrong(){saveWrong([])}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cleanNote(s){return String(s||"").replace(/[⭐🔥⚠️✅]/g,"").replace(/^[\s·]+/,"").trim();}
const fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
const $view=document.getElementById("view");
const $back=document.getElementById("backBtn");
const $topTitle=document.getElementById("topTitle");
const $topRight=document.getElementById("topRight");

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';

let state={view:"home",back:"home"};

function setBar(title,right){
  $topTitle.textContent=title||"";
  $topRight.innerHTML=right||"";
  const home=state.view==="home";
  $back.classList.toggle("hidden",home);
  document.getElementById("brandMark").style.display=home?"":"none";
}
function go(view,back){
  state.view=view;state.back=back||"home";
  window.scrollTo(0,0);
  render();
}

/* ---------- explanation builder ---------- */
/* 三段式解析：正确答案 -> 白话讲解 -> 相关知识卡。
   不再渲染“× A 至少不是这个”这类直接点破对错的批注，避免一翻面就剧透。 */
function buildAnswer(q){
  let h='<div class="ex-ans"><span class="ex-label">正确答案</span>';
  h+=q.answer.map(k=>'<span class="ans-key">'+k+'</span>').join(q.type==="multiple"?"　":"");
  h+='</div>';
  if(q.anchor)h+='<div class="ex-anchor"><span class="ex-label">锚点</span>'+esc(q.anchor)+'</div>';
  return h;
}
function buildPlain(q){
  if(!q.plain)return "";
  return '<div class="ex-plain"><span class="ex-label">白话讲解</span><p>'+esc(q.plain)+'</p></div>';
}
function buildConcepts(q){
  if(!q.concepts||!q.concepts.length)return "";
  let h='<div class="ex-concepts"><span class="ex-label">相关知识卡</span><div class="cc-list">';
  q.concepts.forEach(cid=>{
    const c=CONCEPTS[cid];if(!c)return;
    h+='<div class="cc-card">'+
        '<div class="cc-t">'+esc(c.t)+'</div>'+
        '<div class="cc-life">'+esc(c.life)+'</div>'+
        '<div class="cc-body">'+esc(c.body)+'</div>'+
      '</div>';
  });
  h+='</div></div>';
  return h;
}
/* 选项行：可标记正确项（翻面后高亮答案） */
function optsHtml(q,markCorrect){
  return q.options.map(o=>{
    const corr=markCorrect&&q.answer.includes(o.key);
    return '<div class="opt'+(corr?" correct":"")+'"><span class="lk">'+o.key+'</span><span class="lt">'+esc(o.text)+'</span></div>';
  }).join("");
}

/* ---------- flag tags ---------- */
function flagTags(q){
  let h="";
  if(q.flags&&q.flags.hot)h+='<span class="tag hot">高频必背</span>';
  if(q.flags&&q.flags.recommended)h+='<span class="tag rec">推荐答案</span>';
  return h;
}

/* =========================================================
   HOME
========================================================= */
function renderHome(){
  setBar("讲师认证题库自测","");
  const wc=loadWrong().length;
  const guide = fine
    ? '键盘引导：数字 <b>1–4</b> 选择选项，<b>空格</b> 翻面看解析，<b>回车 / →</b> 下一题，<b>←</b> 上一题。'
    : '轻点选项作答，轻点「显示解析」翻面看答案与讲解。上下滑动浏览，底部按钮翻页。';
  $view.innerHTML=
    '<section class="hero">'+
      '<div class="kicker">WorkBuddy 讲师认证</div>'+
      '<h1 class="hero-title">题库自测</h1>'+
      '<p class="hero-sub">两卷去重 93 题 · 单选 56 · 多选 18 · 判断 19。先自己判，再看白话讲解。</p>'+
    '</section>'+
    '<div class="rule"></div>'+
    '<div class="mode-list">'+
    modeRow("memorize","背题模式","逐题浏览，先翻面自检、再看生活化讲解，随手入错题本")+
    modeRow("exam","真实答题","按真实考试结构抽题、计时、判分，错题自动入库")+
    modeRow("wrong","错题本","集中复习答错的题，可重做、可移除"+(wc?'<span class="mode-badge">'+wc+'</span>':''))+

let memo={list:[],idx:0,revealed:false,explain:false,filter:"all"};
function memoFiltered(){
  if(memo.filter==="all")return QUESTIONS.slice();
  return QUESTIONS.filter(q=>q.type===memo.filter);
}
function renderMemorize(){
  setBar("背题模式",'<span id="mCount"></span>');
  const list=memoFiltered();
  $view.innerHTML=
    '<div class="filterbar" id="memoFilter">'+
      segBtn("all","全部")+segBtn("single","单选")+segBtn("multiple","多选")+segBtn("bool","判断")+
    '</div>'+
    '<div id="memoBody"></div>';
  document.querySelectorAll("#memoFilter button").forEach(b=>{
    b.onclick=()=>{memo.filter=b.dataset.f;memo.idx=0;memo.revealed=false;memo.explain=false;renderMemorize();};
  });
  document.getElementById("mCount").textContent=list.length+" 题";
  renderMemoBody();
}
function segBtn(f,label){
  return '<button data-f="'+f+'" class="'+(memo.filter===f?"on":"")+'">'+label+'</button>';
}
function renderMemoBody(){
  const list=memoFiltered();
  if(!list.length){document.getElementById("memoBody").innerHTML='<div class="empty"><div class="et">暂无题目</div></div>';return;}
  memo.idx=Math.max(0,Math.min(memo.idx,list.length-1));
  const q=list[memo.idx];
  const total=list.length;
  const saved=isWrong(q.id);
  let h='<div class="qcard">';
  h+='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+' · 第 '+(memo.idx+1)+' / '+total+' 题</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  h+='<div class="opts">'+optsHtml(q,memo.revealed)+'</div>';
  h+='</div>';
  if(!memo.revealed){
    h+='<button class="reveal-btn" id="mReveal">显示答案</button>';
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn primary" id="mNext">下一题</button></div>';
    if(fine)h+='<div class="kbd-hint">先自己判，空格翻面看答案 · ← → 翻页</div>';
  }else if(!memo.explain){
    h+='<div class="answer">'+buildAnswer(q)+'</div>';
    h+='<div class="reveal-hint">先核对一下自己判对没，再点下面看白话讲解。</div>';
    h+='<button class="reveal-btn alt" id="mExplain">看白话讲解 ▸</button>';
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn '+(saved?"on-saved":"")+'" id="mSave">'+(saved?"已入错题本":"加入错题本")+'</button><button class="btn primary" id="mNext">下一题</button></div>';
  }else{
    h+='<div class="answer">'+buildAnswer(q)+'</div>';
    h+=buildPlain(q);
    h+=buildConcepts(q);
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn '+(saved?"on-saved":"")+'" id="mSave">'+(saved?"已入错题本":"加入错题本")+'</button><button class="btn primary" id="mNext">下一题</button></div>';
  }
  const body=document.getElementById("memoBody");
  body.innerHTML=h;
  const prev=document.getElementById("mPrev"),next=document.getElementById("mNext");
  prev.onclick=()=>{memo.idx--;memo.revealed=false;memo.explain=false;renderMemoBody();window.scrollTo(0,0);};
  next.onclick=()=>{memo.idx++;memo.revealed=false;memo.explain=false;renderMemoBody();window.scrollTo(0,0);};
  if(!memo.revealed){
    document.getElementById("mReveal").onclick=()=>{memo.revealed=true;renderMemoBody();window.scrollTo(0,0);};
  }else if(!memo.explain){
    document.getElementById("mExplain").onclick=()=>{memo.explain=true;renderMemoBody();window.scrollTo(0,0);};
    document.getElementById("mSave").onclick=()=>{
      const now=toggleWrong(q.id);
      toast(now?"已加入错题本":"已移出错题本");
      renderMemoBody();
    };
  }else{
    document.getElementById("mSave").onclick=()=>{
      const now=toggleWrong(q.id);
      toast(now?"已加入错题本":"已移出错题本");
      renderMemoBody();
    };
  }
  prev.disabled=memo.idx===0;
  next.disabled=memo.idx===total-1;
}
