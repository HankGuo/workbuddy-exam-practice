<title>讲师认证题库自测</title>
<style>
/* ==========================================================================
   WorkBuddy 官方家族化设计体系（对齐官网 --wb2-* 设计令牌）
   品牌绿 #00c29a / 白底 / 16-20px 圆角 / PingFang SC
   ========================================================================== */
:root{
  /* brand */
  --brand:#00c29a;
  --brand-450:#1bc69b;
  --brand-100:#ddf0ec;
  --brand-50:#f2fcfa;
  --brand-tint:rgba(27,198,155,.12);
  --text-brand:#009273;

  /* text */
  --ink:#1a1a1a;
  --ink-2:#646464;
  --ink-3:#a3a3a3;
  --ink-4:#bfbfbf;

  /* surface */
  --paper:#ffffff;
  --paper-2:#f7f8f9;
  --paper-3:#f1f2f4;
  --line:#e0e0e0;
  --line-soft:#ebebeb;

  /* status */
  --ok:#079d55;
  --ok-soft:#f3f9f6;
  --warn:#e6a23c;
  --danger:#f04b4b;

  --sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  --r-card:16px;
  --r-panel:20px;
  --r-sm:10px;
  --r-pill:999px;
  --maxw:820px;
  --header-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  font-size:16px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.bg-pattern{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(880px 460px at 10% -8%, #e9fff4 0%, rgba(233,255,244,0) 62%),
    radial-gradient(820px 420px at 92% -12%, #dbf7ff 0%, rgba(219,247,255,0) 60%),
    linear-gradient(180deg,#f7f8f9 0%,#ffffff 42%);
}
.app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  height:var(--header-h);padding:0 20px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.back{
  appearance:none;border:none;background:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--sans);font-size:15px;color:var(--ink-2);
  padding:8px 6px;min-height:44px;margin-left:-6px;border-radius:var(--r-sm);
}
.back svg{width:18px;height:18px;stroke:var(--ink-2);}
.back.hidden{display:none;}
.topTitle{flex:1;font-size:16px;font-weight:600;letter-spacing:.01em;}
.topRight{font-size:13px;color:var(--ink-3);min-height:24px;display:flex;align-items:center;gap:8px;}
.topbar .brand-mark{
  width:26px;height:26px;flex:none;display:inline-flex;
}
.topbar .brand-mark svg{width:26px;height:26px;display:block;}
main{flex:1;padding:0 20px 48px;}

/* ---------- home ---------- */
.hero{padding:44px 0 8px;}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;letter-spacing:.06em;color:var(--text-brand);font-weight:600;
  background:var(--brand-50);border:1px solid var(--brand-100);
  border-radius:var(--r-pill);padding:5px 14px;margin-bottom:18px;
}
.kicker-logo{width:17px;height:17px;display:inline-flex;flex:none;}
.kicker-logo svg{width:17px;height:17px;display:block;}
.hero-title{
  font-weight:700;font-size:clamp(30px,7.4vw,44px);
  line-height:1.22;margin:0 0 12px;letter-spacing:-.01em;
}
.hero-sub{margin:0;color:var(--ink-2);font-size:15px;max-width:38ch;line-height:1.8;}
.rule{height:1px;background:var(--line-soft);margin:26px 0 4px;}

.mode-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
.mode-row{
  appearance:none;width:100%;text-align:left;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  display:flex;align-items:center;gap:14px;
  padding:18px 18px;font-family:var(--sans);color:var(--ink);
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);
}
@media(hover:hover) and (pointer:fine){
  .mode-row:hover{border-color:var(--brand-450);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,194,154,.10);}
}
.mode-row:active{transform:scale(.995);}
.mode-icon{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:var(--brand-50);border:1px solid var(--brand-100);
  display:flex;align-items:center;justify-content:center;
}
.mode-icon svg{width:19px;height:19px;color:var(--text-brand);display:block;}
.mode-main{flex:1;min-width:0;}
.mode-name{font-size:16.5px;font-weight:600;letter-spacing:.01em;}
.mode-desc{margin-top:3px;font-size:13.5px;color:var(--ink-3);line-height:1.6;}
.mode-row .chev{width:18px;height:18px;flex:none;stroke:var(--ink-4);transition:transform .22s var(--ease);}
@media(hover:hover) and (pointer:fine){
  .mode-row:hover .chev{transform:translateX(3px);stroke:var(--brand);}
}
.mode-badge{
  font-size:12px;font-weight:600;color:var(--text-brand);background:var(--brand-50);
  border:1px solid var(--brand-100);border-radius:var(--r-pill);padding:2px 10px;
  font-variant-numeric:tabular-nums;flex:none;
}
.rand-btn{
  width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:15px;font-weight:600;padding:15px 16px;border-radius:var(--r-card);min-height:52px;
  border:1px solid var(--brand-100);background:var(--brand-50);color:var(--text-brand);
  margin:14px 0 0;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .18s var(--ease),border-color .18s var(--ease);
}
.rand-btn svg{width:17px;height:17px;flex:none;}
.rand-btn:active{transform:scale(.995);}
@media(hover:hover) and (pointer:fine){.rand-btn:hover{background:#e7f8f3;border-color:var(--brand-450);}}

.guide{
  margin-top:24px;padding:16px 18px;border:1px solid var(--line-soft);
  border-radius:var(--r-card);background:var(--paper-2);
  font-size:13px;color:var(--ink-2);line-height:1.8;
}
.guide b{color:var(--ink);font-weight:600;}

/* ---------- segmented / filter ---------- */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0 4px;}
.seg{
  display:inline-flex;gap:4px;border:1px solid var(--line);border-radius:var(--r-pill);
  overflow:hidden;background:var(--paper-2);padding:4px;
}
.seg button{
  appearance:none;border:none;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--ink-2);white-space:nowrap;
  padding:8px 14px;border-radius:var(--r-pill);min-height:38px;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.seg button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,194,154,.28);}

/* ---------- question ---------- */
.qmeta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;color:var(--ink-3);margin:20px 0 12px;
}
.qmeta .t{font-weight:600;color:var(--ink-2);}
.qcard{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:22px 20px;box-shadow:0 1px 2px rgba(26,26,26,.03);
}
.qtext{font-size:17px;line-height:1.78;font-weight:500;color:var(--ink);margin:0 0 4px;}
.hint-multi{
  display:inline-block;margin:10px 0 0;font-size:12.5px;color:var(--text-brand);
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-pill);padding:3px 12px;
}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.opt{
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px 16px;min-height:52px;
  transition:border-color .16s var(--ease),background .16s var(--ease);
}
@media(hover:hover) and (pointer:fine){
  .opt:hover{border-color:var(--brand-450);background:var(--brand-50);}
}
.opt .lk{
  width:26px;height:26px;border-radius:50%;flex:none;margin-top:1px;
  border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  transition:all .16s var(--ease);
}
.opt .lt{flex:1;font-size:15.5px;line-height:1.68;color:var(--ink);}
.opt.sel{border-color:var(--brand);background:var(--brand-50);}
.opt.sel .lk{background:var(--brand);border-color:var(--brand);color:#fff;}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.correct .lk{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.wrong{border-color:var(--danger);background:#fdf1f1;}
.opt.wrong .lk{background:var(--danger);border-color:var(--danger);color:#fff;}

/* ---------- tags ---------- */
.tag{
  display:inline-block;font-size:12px;font-weight:600;border-radius:var(--r-pill);
  padding:2px 10px;line-height:1.7;
}
.tag.hot{color:#b3541e;background:#fff4e8;border:1px solid #ffd9b3;}
.tag.rec{color:var(--text-brand);background:var(--brand-50);border:1px solid var(--brand-100);}

/* ---------- buttons ---------- */
.btn{
  flex:1;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:15px;font-weight:600;padding:13px 16px;border-radius:var(--r-sm);min-height:50px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
  transition:all .16s var(--ease);
}
.btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.btn:hover{border-color:var(--ink-4);color:var(--ink);}}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 12px rgba(0,194,154,.26);}
@media(hover:hover) and (pointer:fine){.btn.primary:hover{background:#00ac89;border-color:#00ac89;}}
.btn.seal{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.on-saved{color:var(--text-brand);border-color:var(--brand-100);background:var(--brand-50);}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;}
.navrow{display:flex;gap:10px;margin-top:22px;}

.reveal-btn{
  width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:16px;font-weight:600;padding:16px;border-radius:var(--r-card);min-height:56px;
  border:none;background:var(--brand);color:#fff;margin-top:18px;
  box-shadow:0 4px 16px rgba(0,194,154,.28);transition:transform .16s var(--ease),background .16s var(--ease);
}
.reveal-btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.reveal-btn:hover{background:#00ac89;}}
.reveal-btn.alt{background:var(--paper);color:var(--text-brand);border:1px solid var(--brand-100);box-shadow:none;}
@media(hover:hover) and (pointer:fine){.reveal-btn.alt:hover{background:var(--brand-50);border-color:var(--brand-450);}}
.reveal-hint{font-size:13.5px;color:var(--ink-3);margin:14px 0 0;line-height:1.7;}
.kbd-hint{font-size:12.5px;color:var(--ink-4);margin-top:14px;text-align:center;}

/* ---------- explanation ---------- */
.answer{
  margin-top:20px;padding-top:20px;border-top:1px solid var(--line-soft);
  animation:fade .28s var(--ease) both;
}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ex-label{
  display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;
  color:var(--text-brand);background:var(--brand-50);border:1px solid var(--brand-100);
  border-radius:var(--r-pill);padding:3px 12px;margin-bottom:10px;
}
.ex-ans{font-size:16px;line-height:1.8;margin:0 0 16px;color:var(--ink);}
.ans-key{
  display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
  background:var(--brand);color:#fff;border-radius:8px;font-weight:700;
  font-size:14px;margin-right:10px;font-variant-numeric:tabular-nums;
}
.ex-anchor{
  font-size:14.5px;line-height:1.8;color:var(--ink-2);margin:0 0 16px;
  background:var(--paper-2);border-left:3px solid var(--brand);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:10px 14px;
}
.ex-plain{margin:0 0 18px;}
.ex-plain p{margin:0;font-size:15.5px;line-height:1.95;color:var(--ink);}
.ex-concepts{margin:0 0 8px;}
.cc-list{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
.cc-card{
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-card);
  padding:16px 18px;animation:fade .3s var(--ease) both;
}
.cc-t{font-size:15.5px;font-weight:700;color:var(--ink);margin:0 0 8px;}
.cc-life{font-size:14.5px;line-height:1.9;color:var(--ink);margin:0 0 10px;}
.cc-life::before{
  content:"打个比方";display:inline-block;font-size:11.5px;font-weight:600;color:var(--text-brand);
  background:#fff;border:1px solid var(--brand-100);border-radius:var(--r-pill);
  padding:2px 9px;margin-right:8px;vertical-align:2px;
}
.cc-body{font-size:13.5px;line-height:1.85;color:var(--ink-2);border-top:1px dashed var(--brand-100);padding-top:10px;}
.concept-intro{
  font-size:14.5px;line-height:1.85;color:var(--ink-2);background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;margin:18px 0 4px;
}

/* ---------- exam config ---------- */
.cfg-block{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:20px 18px;margin-top:16px;
}
.cfg-title{font-size:15px;font-weight:600;margin:0 0 14px;}
.cfg-note{font-size:13px;color:var(--ink-3);margin:14px 0 0;line-height:1.75;}
.cfg-block .seg{width:100%;}
.cfg-block .seg button{flex:1;}
.start-btn{
  width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:16px;font-weight:600;padding:17px;border-radius:var(--r-card);min-height:58px;
  border:none;background:var(--brand);color:#fff;margin-top:24px;
  box-shadow:0 6px 20px rgba(0,194,154,.30);transition:transform .16s var(--ease),background .16s var(--ease);
}
.start-btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.start-btn:hover{background:#00ac89;}}

/* ---------- exam HUD ---------- */
.hud{
  position:sticky;top:var(--header-h);z-index:25;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border:1px solid var(--line);border-radius:var(--r-panel);
  padding:14px 16px;margin:16px 0 0;
  box-shadow:0 2px 12px rgba(26,26,26,.04);
}
.hud-top{display:flex;align-items:center;gap:14px;}
.hud-left{flex:1;min-width:0;}
.hud-num{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.hud-num small{font-weight:500;color:var(--ink-3);font-size:13px;}
.hud-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.hud-bar{height:4px;border-radius:var(--r-pill);background:var(--paper-3);margin-top:10px;overflow:hidden;}
.hud-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-450),var(--brand));border-radius:var(--r-pill);transition:width .35s var(--ease);}
/* 计时器：环形滑动 */
.timer-ring{position:relative;width:56px;height:56px;flex:none;}
.timer-ring svg{width:56px;height:56px;transform:rotate(-90deg);}
.timer-ring .tr-bg{fill:none;stroke:var(--paper-3);stroke-width:4;}
.timer-ring .tr-fg{fill:none;stroke:var(--brand);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s var(--ease);}
.timer-ring.warn .tr-fg{stroke:var(--warn);}
.timer-ring.danger .tr-fg{stroke:var(--danger);}
.timer-ring .tr-txt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.timer-ring.warn .tr-txt{color:var(--warn);}
.timer-ring.danger .tr-txt{color:var(--danger);}
.hud-btn{
  appearance:none;border:1px solid var(--line);background:var(--paper);cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-2);
  border-radius:var(--r-pill);padding:7px 14px;min-height:34px;white-space:nowrap;
  transition:all .16s var(--ease);
}
@media(hover:hover) and (pointer:fine){.hud-btn:hover{border-color:var(--brand-450);color:var(--text-brand);}}
.hud-btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ---------- action bar ---------- */
.action-bar{
  position:sticky;bottom:0;z-index:26;
  display:flex;gap:10px;margin:22px -20px -48px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--line-soft);
}

/* ---------- answer sheet ---------- */
.sheet-mask{
  position:fixed;inset:0;z-index:40;background:rgba(26,26,26,.42);
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease);
  backdrop-filter:blur(2px);
}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--paper);border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s var(--ease);
  max-width:var(--maxw);margin:0 auto;max-height:78vh;overflow:auto;
  box-shadow:0 -8px 40px rgba(26,26,26,.14);
}
.sheet.show{transform:translateY(0);}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-hd h3{margin:0;font-size:17px;font-weight:700;}
.sheet-close{
  appearance:none;border:none;background:var(--paper-2);cursor:pointer;
  width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink-2);line-height:1;
}
.sheet-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:14px;}
.sheet-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.sheet-legend .ic.lg{width:12px;height:12px;color:var(--text-brand);vertical-align:-2px;margin-right:4px;}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;}
.sheet-cell{
  appearance:none;border:1px solid var(--line);background:var(--paper);cursor:pointer;
  font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-2);
  border-radius:var(--r-sm);min-height:42px;font-variant-numeric:tabular-nums;
  transition:all .14s var(--ease);
}
.sheet-cell.done{background:var(--brand-50);border-color:var(--brand-100);color:var(--text-brand);}
.sheet-cell.cur{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ---------- results ---------- */
.score-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:26px 22px;margin-top:20px;text-align:center;
  box-shadow:0 2px 16px rgba(26,26,26,.04);
}
.score-num{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.score-num small{font-size:16px;font-weight:500;color:var(--ink-3);margin-left:4px;}
.score-sub{font-size:13.5px;color:var(--ink-2);margin-top:8px;}
.score-streak{
  display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--text-brand);
  background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-pill);padding:4px 14px;
}
.score-pass{
  margin-top:14px;font-size:14px;font-weight:600;border-radius:var(--r-sm);padding:10px 12px;
}
.score-pass.ok{color:var(--ok);background:var(--ok-soft);border:1px solid rgba(7,157,85,.22);}
.score-pass.no{color:var(--danger);background:#fdf1f1;border:1px solid rgba(240,75,75,.22);}
.score-msg{font-size:14px;line-height:1.75;color:var(--ink-2);margin-top:12px;}
.brk{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  padding:6px 18px;margin-top:14px;
}
.brk-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft);gap:12px;}
.brk-row:last-child{border-bottom:none;}
.bl{font-size:13.5px;color:var(--ink-2);}
.bv{font-size:14.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}

/* ---------- lists ---------- */
.wrong-head{font-size:15px;font-weight:600;margin:26px 0 12px;}
.wrong-list{display:flex;flex-direction:column;gap:10px;}
.wrong-item{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px 16px;transition:all .16s var(--ease);
}
@media(hover:hover) and (pointer:fine){.wrong-item:hover{border-color:var(--brand-450);background:var(--brand-50);}}
.wi-main{flex:1;min-width:0;}
.wi-t{font-size:14.5px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wi-m{font-size:12.5px;color:var(--ink-3);margin-top:4px;}
.wi-go{font-size:13px;font-weight:600;color:var(--text-brand);flex:none;}
.empty{text-align:center;padding:44px 12px;color:var(--ink-3);}
.et{font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.ed{font-size:13.5px;line-height:1.75;}

/* ---------- notes ---------- */
.notes-sec{margin:24px 0;}
.notes-sec h3{font-size:16px;font-weight:700;margin:0 0 14px;}
.num-list{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;}
.num-list li{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.7;color:var(--ink-2);}
.num-list li:last-child{border-bottom:none;}
.nk{flex:none;min-width:104px;font-weight:600;color:var(--ink);}
.tips{list-style:none;margin:0;padding:0;}
.tips li{
  position:relative;padding:12px 14px 12px 38px;margin-bottom:10px;font-size:14px;line-height:1.85;
  color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
}
.tips li::before{
  content:"";position:absolute;left:16px;top:21px;width:6px;height:6px;border-radius:50%;
  background:var(--brand);opacity:.7;
}

/* ---------- toast & dialog ---------- */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,12px);z-index:60;
  background:rgba(26,26,26,.92);color:#fff;font-size:13.5px;border-radius:var(--r-pill);
  padding:10px 20px;opacity:0;pointer-events:none;transition:all .24s var(--ease);
  max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(26,26,26,.45);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease);
}
.overlay.show{opacity:1;pointer-events:auto;}
.dialog{
  background:var(--paper);border-radius:var(--r-panel);padding:24px;width:100%;max-width:360px;
  box-shadow:0 12px 48px rgba(26,26,26,.20);transform:translateY(8px);transition:transform .22s var(--ease);
}
.overlay.show .dialog{transform:translateY(0);}
.dialog h4{margin:0 0 10px;font-size:17px;font-weight:700;}
.dialog p{margin:0 0 20px;font-size:14px;line-height:1.8;color:var(--ink-2);}
.dbtns{display:flex;gap:10px;}

@media (max-width:420px){
  main{padding:0 16px 44px;}
  .qcard{padding:18px 16px;border-radius:var(--r-card);}
  .opt{padding:13px 14px;}
  .opt .lt{font-size:15px;}
  .hud{padding:12px 14px;}
  .action-bar{margin:22px -16px -44px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .seg button{padding:8px 10px;font-size:13.5px;}
  .cfg-block .seg button{padding:8px 6px;font-size:13px;}
}

</style>
