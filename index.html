/* =========================================================
   MEMORIZE (背题)
========================================================= */
let memo={list:[],idx:0,revealed:false,explain:false,filter:"all"};
function memoFiltered(){
  if(memo.filter==="all")return QUESTIONS.slice();
  return QUESTIONS.filter(q=>q.type===memo.filter);
}
function renderMemorize(){
  setBar("背题模式",'<span id="mCount"></span>');
  const list=memoFiltered();
  $view.innerHTML=
    '<div class="filterbar" id="memoFilter">'+
      segBtn("all","全部")+segBtn("single","单选")+segBtn("multiple","多选")+segBtn("bool","判断")+
    '</div>'+
    '<div id="memoBody"></div>';
  document.querySelectorAll("#memoFilter button").forEach(b=>{
    b.onclick=()=>{memo.filter=b.dataset.f;memo.idx=0;memo.revealed=false;memo.explain=false;renderMemorize();};
  });
  document.getElementById("mCount").textContent=list.length+" 题";
  renderMemoBody();
}
function segBtn(f,label){
  return '<button data-f="'+f+'" class="'+(memo.filter===f?"on":"")+'">'+label+'</button>';
}
function renderMemoBody(){
  const list=memoFiltered();
  if(!list.length){document.getElementById("memoBody").innerHTML='<div class="empty"><div class="et">暂无题目</div></div>';return;}
  memo.idx=Math.max(0,Math.min(memo.idx,list.length-1));
  const q=list[memo.idx];
  const total=list.length;
  const saved=isWrong(q.id);
  let h='<div class="qcard">';
  h+='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+' · 第 '+(memo.idx+1)+' / '+total+' 题</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  h+='<div class="opts">'+optsHtml(q,memo.revealed)+'</div>';
  h+='</div>';
  if(!memo.revealed){
    h+='<button class="reveal-btn" id="mReveal">显示答案</button>';
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn primary" id="mNext">下一题</button></div>';
    if(fine)h+='<div class="kbd-hint">先自己判，空格翻面看答案 · ← → 翻页</div>';
  }else if(!memo.explain){
    h+='<div class="answer">'+buildAnswer(q)+'</div>';
    h+='<div class="reveal-hint">先核对一下自己判对没，再点下面看白话讲解。</div>';
    h+='<button class="reveal-btn alt" id="mExplain">看白话讲解 ▸</button>';
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn '+(saved?"on-saved":"")+'" id="mSave">'+(saved?"已入错题本":"加入错题本")+'</button><button class="btn primary" id="mNext">下一题</button></div>';
  }else{
    h+='<div class="answer">'+buildAnswer(q)+'</div>';
    h+=buildPlain(q);
    h+=buildConcepts(q);
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn '+(saved?"on-saved":"")+'" id="mSave">'+(saved?"已入错题本":"加入错题本")+'</button><button class="btn primary" id="mNext">下一题</button></div>';
  }
  const body=document.getElementById("memoBody");
  body.innerHTML=h;
  const prev=document.getElementById("mPrev"),next=document.getElementById("mNext");
  prev.onclick=()=>{memo.idx--;memo.revealed=false;memo.explain=false;renderMemoBody();window.scrollTo(0,0);};
  next.onclick=()=>{memo.idx++;memo.revealed=false;memo.explain=false;renderMemoBody();window.scrollTo(0,0);};
  if(!memo.revealed){
    document.getElementById("mReveal").onclick=()=>{memo.revealed=true;renderMemoBody();window.scrollTo(0,0);};
  }else if(!memo.explain){
    document.getElementById("mExplain").onclick=()=>{memo.explain=true;renderMemoBody();window.scrollTo(0,0);};
    document.getElementById("mSave").onclick=()=>{
      const now=toggleWrong(q.id);
      toast(now?"已加入错题本":"已移出错题本");
      renderMemoBody();
    };
  }else{
    document.getElementById("mSave").onclick=()=>{
      const now=toggleWrong(q.id);
      toast(now?"已加入错题本":"已移出错题本");
      renderMemoBody();
    };
  }
  prev.disabled=memo.idx===0;
  next.disabled=memo.idx===total-1;
}

let examCfg={range:"all",qty:"all",timer:false};
function renderExamConfig(){
  setBar("真实答题","");
  const rangeSeg=segExam("range",[["all","全部"],["single","单选"],["multiple","多选"],["bool","判断"]],examCfg.range);
  const qtySeg=segExam("qty",[["all","全部"],["sim50","模拟50"],["30","30题"],["20","20题"]],examCfg.qty);
  const timerSeg=segExam("timer",[["off","不计时"],["90","90分钟"]],examCfg.timer?"90":"off");

    '<div class="cfg-block"><div class="cfg-title">题目数量</div>'+qtySeg+
      '<div class="cfg-note">「模拟50」= 单选30 + 多选10 + 判断10，结构同真实考试（90分及格）。</div></div>'+
    '<div class="cfg-block"><div class="cfg-title">计时</div>'+timerSeg+
      '<div class="cfg-note">真实考试 50 题 90 分钟；切屏 / 截屏 5 次强制交卷，练习中不做限制。</div></div>'+
    '<button class="start-btn" id="startExam">开始答题</button>'+
    (fine?'<div class="kbd-hint">提示：答题时按 <b>1–4</b> 直接选选项，<b>回车</b> 进入下一题。</div>':'');

  bindSeg("qty",v=>{examCfg.qty=v;renderExamConfig();});
  bindSeg("timer",v=>{examCfg.timer=(v==="90");renderExamConfig();});
  document.getElementById("startExam").onclick=startExam;
}
function segExam(name,pairs,val){
  return '<div class="seg" data-seg="'+name+'">'+pairs.map(p=>'<button data-v="'+p[0]+'" class="'+(p[0]===val?"on":"")+'">'+p[1]+'</button>').join("")+'</div>';
}
function bindSeg(name,cb){
  document.querySelectorAll('[data-seg="'+name+'"] button').forEach(b=>{
    b.onclick=()=>cb(b.dataset.v);
  });
}

/* =========================================================
   EXAM RUN
========================================================= */
let exam=null,timerId=null;
const TIMER_C=150.796; // 环形计时器周长（viewBox 56, r=24）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){
  let list=[];
  const byType=t=>QUESTIONS.filter(q=>q.type===t);
  if(examCfg.qty==="sim50" && examCfg.range==="all"){
    list=shuffle(byType("single")).slice(0,30)
      .concat(shuffle(byType("multiple")).slice(0,10))
      .concat(shuffle(byType("bool")).slice(0,10));
  }else{
    let pool = examCfg.range==="all"?QUESTIONS:byType(examCfg.range);
    pool=shuffle(pool);
    if(examCfg.qty==="all")list=pool;
    else{const n=parseInt(examCfg.qty,10);list=pool.slice(0,Math.min(n,pool.length));}
  }
  exam={list,idx:0,answers:{},timerOn:examCfg.timer,timeLeft:examCfg.timer?90*60:0,timerTotal:examCfg.timer?90*60:0};
  setBar("真实答题",'<button class="hud-btn" id="sheetOpen">答题卡</button>');
  renderExam();
  if(exam.timerOn){startTimer();}
}
function startTimer(){
  stopTimer();
  timerId=setInterval(()=>{
    exam.timeLeft--;
    if(exam.timeLeft<=0){exam.timeLeft=0;updateTimerDisplay();stopTimer();submitExam();return;}
    updateTimerDisplay();
  },1000);
}
/* 计时器就地更新：环形进度条 1s 线性滑动，数字同步走动 */
function updateTimerDisplay(){
  const ring=document.getElementById("timerRing");
  if(!ring||!exam)return;
  const frac=Math.max(0,Math.min(1,exam.timeLeft/exam.timerTotal));
  const fg=ring.querySelector(".tr-fg");
  if(fg)fg.setAttribute("stroke-dashoffset",(TIMER_C*(1-frac)).toFixed(1));
  const t=ring.querySelector(".tr-txt");
  if(t){const m=Math.floor(exam.timeLeft/60),s=exam.timeLeft%60;t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
  ring.classList.toggle("warn",exam.timeLeft<=300&&exam.timeLeft>60);
  ring.classList.toggle("danger",exam.timeLeft<=60);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function timerRingHtml(){
  const frac=Math.max(0,Math.min(1,exam.timeLeft/exam.timerTotal));
  const off=TIMER_C*(1-frac);
  const cls=exam.timeLeft<=60?"danger":(exam.timeLeft<=300?"warn":"");
  const m=Math.floor(exam.timeLeft/60),s=exam.timeLeft%60;
  return '<div class="timer-ring '+cls+'" id="timerRing">'+
    '<svg viewBox="0 0 56 56"><circle class="tr-bg" cx="28" cy="28" r="24"></circle>'+
    '<circle class="tr-fg" cx="28" cy="28" r="24" stroke-dasharray="'+TIMER_C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle></svg>'+
    '<div class="tr-txt">'+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+'</div></div>';
}
function renderExamHUD(){
  const total=exam.list.length;
  const q=exam.list[exam.idx];
  const answered=exam.list.filter(x=>{const a=exam.answers[x.id];return a&&a.length;}).length;
  let h='<div class="hud"><div class="hud-top"><div class="hud-left">';
  h+='<div class="hud-num">第 '+(exam.idx+1)+' <small>/ '+total+' 题</small></div>';
  h+='<div class="hud-sub">已答 '+answered+' 题 · '+TYPE_LABEL[q.type]+'</div>';
  h+='<div class="hud-bar"><i style="width:'+Math.round((exam.idx+1)/total*100)+'%"></i></div>';
  h+='</div>';
  if(exam.timerOn)h+=timerRingHtml();
  h+='</div></div>';
  return h;
}
function renderExam(){
  const total=exam.list.length;
  const q=exam.list[exam.idx];
  const userAns=exam.answers[q.id]||[];
  let h=renderExamHUD();
  h+='<div class="qcard">';
  h+='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+'</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  if(q.type==="multiple")h+='<div class="hint-multi">本题为多选，可多选</div>';
  h+='<div class="opts" id="exOpts">'+q.options.map(o=>{
    const sel=userAns.includes(o.key);
    return '<div class="opt '+(sel?"sel":"")+'" data-k="'+o.key+'"><span class="lk">'+o.key+'</span><span class="lt">'+esc(o.text)+'</span></div>';
  }).join("")+'</div>';
  h+='</div>';
  const last=exam.idx===total-1;
  h+='<div class="action-bar">'+
     '<button class="btn" id="exPrev"'+(exam.idx===0?' disabled':'')+'>上一题</button>'+
     '<button class="btn primary" id="exNext">'+(last?"提交答卷":"下一题")+'</button>'+
   '</div>';
  $view.innerHTML=h;
  document.querySelectorAll("#exOpts .opt").forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k;
      let cur=exam.answers[q.id]||[];
      if(q.type==="multiple"){
        if(cur.includes(k))cur=cur.filter(x=>x!==k);else cur.push(k);
      }else{cur=[k];}
      exam.answers[q.id]=cur;
      renderExam();
    };
  });
  document.getElementById("exPrev").onclick=()=>{if(exam.idx>0){exam.idx--;renderExam();window.scrollTo(0,0);}};
  document.getElementById("exNext").onclick=()=>{
    if(last){submitExam();}else{exam.idx++;renderExam();window.scrollTo(0,0);}
  };
  const so=document.getElementById("sheetOpen");
  if(so)so.onclick=openSheet;
}
/* 答题卡：底部弹层，数字格快速跳题 */
function openSheet(){
  const grid=document.getElementById("sheetGrid");
  let h="";
  exam.list.forEach((q,i)=>{
    const a=exam.answers[q.id];
    const done=a&&a.length;
    const cls=i===exam.idx?"cur":(done?"done":"");
    h+='<button class="sheet-cell '+cls+'" data-i="'+i+'">'+(i+1)+'</button>';
  });
  grid.innerHTML=h;
  grid.querySelectorAll(".sheet-cell").forEach(el=>{
    el.onclick=()=>{exam.idx=+el.dataset.i;closeSheet();renderExam();window.scrollTo(0,0);};
  });
  document.getElementById("sheet").classList.add("show");
  document.getElementById("sheetMask").classList.add("show");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("show");
  document.getElementById("sheetMask").classList.remove("show");
}

function isCorrect(q,userAns){
  if(!userAns||!userAns.length)return false;
  const a=[...q.answer].sort().join(",");
  const u=[...userAns].sort().join(",");
  return a===u;
}
function submitExam(){
  stopTimer();
  const list=exam.list;
  let score=0,total=0;
  const byType={single:[0,0],multiple:[0,0],bool:[0,0]};
  const wrong=[];
  let streak=0,maxStreak=0;
  list.forEach(q=>{
    const w=WEIGHT[q.type];total+=w;
    const ok=isCorrect(q,exam.answers[q.id]);
    byType[q.type][1]++;
    if(ok){score+=w;byType[q.type][0]++;streak++;if(streak>maxStreak)maxStreak=streak;}
    else {wrong.push(q);streak=0;}
  });
  // save wrong to book
  const wb=loadWrong();let added=0;
  wrong.forEach(q=>{if(!wb.includes(q.id)){wb.push(q.id);added++;}});
  if(added)saveWrong(wb);
  renderResults({score,total,byType,wrong,added,maxStreak,correct:list.length-wrong.length,totalQ:list.length});
}
function renderResults(r){
  setBar("答题结果","");
  const pass=r.score>=90;
  let msg;
  if(r.maxStreak>=20)msg="手感发烫，这串连对值得截图。";
  else if(pass)msg="过线了，但连对还能更长，冲 30+。";
  else if(r.wrong.length>0)msg="没过线，先去错题本把 "+r.wrong.length+" 道啃明白。";
  else msg="稳住，按这个节奏去考。";
  let h='<div class="score-card">'+
    '<div class="score-num">'+r.score+'<small>/ '+r.total+' 分</small></div>'+
    '<div class="score-sub">答对 '+r.correct+' / '+r.totalQ+' 题 · 答错 '+r.wrong.length+' 题</div>'+
    (r.maxStreak?('<div class="score-streak">最长连对 '+r.maxStreak+' 题</div>'):'')+
    '<div class="score-pass '+(pass?"ok":"no")+'">'+(pass?"达到 90 分及格线":"未达 90 分及格线")+'</div>'+
    '<div class="score-msg">'+msg+'</div>'+
  '</div>';
  h+='<div class="brk">';
  [["single","单选"],["multiple","多选"],["bool","判断"]].forEach(([t,l])=>{
    const [c,n]=r.byType[t];
    if(n>0)h+='<div class="brk-row"><span class="bl">'+l+'（每题 '+WEIGHT[t]+' 分）</span><span class="bv">'+c+' / '+n+' 对</span></div>';
  });
  h+='</div>';
  if(r.added>0)h+='<div class="guide" style="margin-top:16px">已将 '+r.added+' 道新错题存入错题本。</div>';
  if(r.wrong.length){
    h+='<div class="wrong-head">错题解析</div><div class="wrong-list" id="wlist">';
    r.wrong.forEach((q,i)=>{
      h+='<div class="wrong-item" data-i="'+i+'"><div class="wi-main"><div class="wi-t">'+esc(q.text)+'</div><div class="wi-m">'+TYPE_LABEL[q.type]+' · 你的答案 '+fmtAns(exam.answers[q.id])+' / 正确 '+q.answer.join("、")+'</div></div><span class="wi-go">解析 →</span></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="empty" style="padding:36px 0"><div class="et">全部答对</div><div class="ed">这套题你拿满分，去错题本复习别的。</div></div>';
  }
  h+='<div class="navrow"><button class="btn" id="rRetry">重做本套</button><button class="btn primary" id="rHome">返回首页</button></div>';
  $view.innerHTML=h;
  if(r.wrong.length){
    document.querySelectorAll("#wlist .wrong-item").forEach(el=>{
      el.onclick=()=>{openReview(r.wrong[+el.dataset.i],false);};
    });
  }
  document.getElementById("rRetry").onclick=()=>{startExam();};
  document.getElementById("rHome").onclick=()=>go("home");
}
function fmtAns(a){if(!a||!a.length)return "未答";return a.slice().sort().join("、");}

/* =========================================================
   WRONG BOOK (错题本)
========================================================= */
let wrongView={idx:0,revealed:false,list:[]};
function renderWrong(){
  const ids=loadWrong();
  setBar("错题本",ids.length?'<span style="cursor:pointer" id="wClear">清空</span>':'');
  if(!ids.length){
    $view.innerHTML='<div class="empty"><div class="et">错题本还是空的</div><div class="ed">去「真实答题」做一套，答错的题会自动进到这里。</div><button class="btn primary" id="wGo" style="max-width:200px;margin:0 auto">去答题</button></div>';
    document.getElementById("wGo").onclick=()=>go("exam");
    return;
  }
  const map={};QUESTIONS.forEach(q=>map[q.id]=q);
  const list=ids.map(id=>map[id]).filter(Boolean);
  let h='<div class="qmeta"><span class="t">共 '+list.length+' 道待复习</span></div>';
  h+='<div class="wrong-list" id="wlist">';
  list.forEach((q,i)=>{
    h+='<div class="wrong-item" data-i="'+i+'"><div class="wi-main"><div class="wi-t">'+esc(q.text)+'</div><div class="wi-m">'+TYPE_LABEL[q.type]+' · 正确答案 '+q.answer.join("、")+'</div></div><span class="wi-go">复习 →</span></div>';
  });
  h+='</div>';
  $view.innerHTML=h;
  document.querySelectorAll("#wlist .wrong-item").forEach(el=>{
    el.onclick=()=>openReview(list[+el.dataset.i],true);
  });
  const clr=document.getElementById("wClear");
  if(clr)clr.onclick=()=>confirmDlg("清空错题本","将移除全部 "+ids.length+" 道错题，此操作不可撤销。",()=>{clearWrong();toast("已清空");renderWrong();});
}

/* review flip used by wrong book & results */
function openReview(q,fromWrong){
  state.view="review";state.back=fromWrong?"wrong":"results";
  setBar("复习","");
  wrongView={q,fromWrong,revealed:false,explain:false};
  renderReview();
}
function renderReview(){
  const q=wrongView.q;
  let h='<div class="qcard">';
  h+='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+'</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  h+='<div class="opts">'+optsHtml(q,true)+'</div>';
  h+='</div>';
  if(!wrongView.revealed){
    h+='<button class="reveal-btn" id="rvReveal">显示答案</button>';
    if(fine)h+='<div class="kbd-hint">空格 翻面</div>';
  }else if(!wrongView.explain){
    h+='<div class="answer">'+buildAnswer(q)+'</div>';
    h+='<div class="reveal-hint">先核对一下，再点下面看白话讲解。</div>';
    h+='<button class="reveal-btn alt" id="rvExplain">看白话讲解 ▸</button>';
    h+='<div class="navrow"><button class="btn primary" id="rvBack">返回</button><button class="btn '+(isWrong(q.id)?"":"on-saved")+'" id="rvToggle">'+(isWrong(q.id)?"移出错题本":"加入错题本")+'</button></div>';
  }else{
    h+='<div class="answer">'+buildAnswer(q)+'</div>';
    h+=buildPlain(q);
    h+=buildConcepts(q);
    h+='<div class="navrow"><button class="btn primary" id="rvBack">返回</button><button class="btn '+(isWrong(q.id)?"":"on-saved")+'" id="rvToggle">'+(isWrong(q.id)?"移出错题本":"加入错题本")+'</button></div>';
  }
  $view.innerHTML=h;
  if(!wrongView.revealed){
    document.getElementById("rvReveal").onclick=()=>{wrongView.revealed=true;renderReview();};
  }else if(!wrongView.explain){
    document.getElementById("rvExplain").onclick=()=>{wrongView.explain=true;renderReview();window.scrollTo(0,0);};
    document.getElementById("rvBack").onclick=()=>{ if(wrongView.fromWrong)renderWrong(); else go("home"); };
    document.getElementById("rvToggle").onclick=()=>{toggleWrong(q.id);toast(isWrong(q.id)?"已加入错题本":"已移出错题本");renderReview();};
  }else{
    document.getElementById("rvBack").onclick=()=>{ if(wrongView.fromWrong)renderWrong(); else go("home"); };
    document.getElementById("rvToggle").onclick=()=>{toggleWrong(q.id);toast(isWrong(q.id)?"已加入错题本":"已移出错本");renderReview();};
  }
}

/* =========================================================
   toast & confirm
========================================================= */
let toastId=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastId);toastId=setTimeout(()=>t.classList.remove("show"),1800);
}
const overlay=document.getElementById("overlay");
function confirmDlg(title,text,onOk){
  document.getElementById("dlgTitle").textContent=title;
  document.getElementById("dlgText").textContent=text;
  overlay.classList.add("show");
  const ok=document.getElementById("dlgOk"),cancel=document.getElementById("dlgCancel");
  const close=()=>{overlay.classList.remove("show");ok.onclick=null;cancel.onclick=null;};
  ok.onclick=()=>{close();onOk();};
  cancel.onclick=close;
}

/* =========================================================
   routing & keyboard
========================================================= */
function render(){
  switch(state.view){
    case"home":renderHome();break;
    case"memorize":renderMemorize();break;
    case"exam":renderExamConfig();break;
    case"wrong":renderWrong();break;
    case"concepts":renderConcepts();break;
    case"notes":renderNotes();break;
    default:renderHome();
  }
}
$view.addEventListener("click",e=>{
  const row=e.target.closest("[data-go]");
  if(row){go(row.dataset.go);}
});
/* 答题卡弹层 */
document.getElementById("sheetClose").onclick=closeSheet;
document.getElementById("sheetMask").onclick=closeSheet;
$back.onclick=()=>{
  // stop timer if leaving exam
  if(state.view==="review"){ if(wrongView.fromWrong)renderWrong(); else go("home"); return; }
  stopTimer();
  closeSheet();
  go("home");
};

document.addEventListener("keydown",e=>{
  if(state.view==="memorize"){
    const list=memoFiltered();
    if(e.key===" "){e.preventDefault();
      if(!memo.revealed){memo.revealed=true;}
      else if(!memo.explain){memo.explain=true;}
      else if(memo.idx<list.length-1){memo.idx++;memo.revealed=false;memo.explain=false;}
      renderMemoBody();window.scrollTo(0,0);return;}
    if(e.key==="ArrowRight"){if(memo.idx<list.length-1){memo.idx++;memo.revealed=false;memo.explain=false;renderMemoBody();window.scrollTo(0,0);}}
    if(e.key==="ArrowLeft"){if(memo.idx>0){memo.idx--;memo.revealed=false;memo.explain=false;renderMemoBody();window.scrollTo(0,0);}}
  }else if(state.view==="review"){
    if(e.key===" "){e.preventDefault();
      if(!wrongView.revealed){wrongView.revealed=true;}
      else if(!wrongView.explain){wrongView.explain=true;}
      renderReview();window.scrollTo(0,0);}
  }else if(state.view==="exam" && exam){
    if(["1","2","3","4"].includes(e.key)){
      const q=exam.list[exam.idx];
      const opt=q.options[parseInt(e.key,10)-1];
      if(opt){
        let cur=exam.answers[q.id]||[];
        if(q.type==="multiple"){if(cur.includes(opt.key))cur=cur.filter(x=>x!==opt.key);else cur.push(opt.key);}
        else cur=[opt.key];
        exam.answers[q.id]=cur;renderExam();
      }
    }else if(e.key==="Enter"){
      e.preventDefault();
      const last=exam.idx===exam.list.length-1;
      if(last)submitExam();else{exam.idx++;renderExam();window.scrollTo(0,0);}
    }
  }
});

render();
