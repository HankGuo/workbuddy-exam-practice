<style>
:root{

  --paper-3:#E4DECF;
  --ink:#23211C;
  --ink-2:#4A463E;
  --ink-3:#8A8478;
  --line:#D9D3C5;
  --line-soft:#E3DDD0;
  --seal:#9E3B30;
  --seal-deep:#83302A;
  --seal-soft:rgba(158,59,48,.10);
  --ok:#3F6B4E;
  --ok-soft:rgba(63,107,78,.12);
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  --maxw:760px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  font-size:16px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.grain{

}
.app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;
  background:rgba(244,241,234,.9);
  backdrop-filter:saturate(1.1) blur(6px);
  -webkit-backdrop-filter:saturate(1.1) blur(6px);
  border-bottom:1px solid var(--line-soft);
}
.back{
  appearance:none;border:none;background:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--sans);font-size:15px;color:var(--ink-2);
  padding:6px 2px;min-height:40px;
}
.back svg{width:18px;height:18px;stroke:var(--ink-2);}
.back.hidden{visibility:hidden;}
.topTitle{flex:1;font-size:16px;font-weight:600;letter-spacing:.02em;}
.topRight{font-size:13px;color:var(--ink-3);min-height:24px;display:flex;align-items:center;gap:6px;}

main{flex:1;padding:0 20px 40px;}

/* home */
.hero{padding:46px 0 30px;}
.kicker{
  font-size:12px;letter-spacing:.28em;color:var(--seal);font-weight:600;
  text-transform:uppercase;margin-bottom:14px;
}
.hero-title{
  font-family:var(--serif);font-weight:600;font-size:clamp(34px,9vw,52px);
  line-height:1.1;margin:0 0 14px;letter-spacing:.04em;
}
.hero-sub{margin:0;color:var(--ink-2);font-size:15px;max-width:34ch;}
.rule{height:1px;background:var(--line);margin:26px 0 6px;}

.mode-row{
  appearance:none;width:100%;text-align:left;cursor:pointer;
  background:none;border:none;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:22px 2px;font-family:var(--sans);color:var(--ink);
  transition:padding-left .25s var(--ease);
}
.mode-row:last-child{border-bottom:1px solid var(--line);}
@media(hover:hover) and (pointer:fine){
  .mode-row:hover{padding-left:10px;}
}
.mode-main{flex:1;}
.mode-name{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.03em;}
.mode-desc{margin-top:4px;font-size:13.5px;color:var(--ink-3);line-height:1.55;}
.mode-row .chev{width:20px;height:20px;flex:none;stroke:var(--ink-3);transition:transform .25s var(--ease);}
@media(hover:hover) and (pointer:fine){
  .mode-row:hover .chev{transform:translateX(4px);stroke:var(--seal);}
}
.mode-badge{
  font-size:12px;color:var(--seal);background:var(--seal-soft);
  border-radius:20px;padding:3px 10px;font-variant-numeric:tabular-nums;flex:none;
}

.guide{
  margin-top:30px;padding:16px 18px;border:1px solid var(--line);
  border-radius:4px;background:var(--paper-2);
  font-size:13px;color:var(--ink-2);line-height:1.7;
}
.guide b{color:var(--ink);font-weight:600;}

/* filter bar */
.filterbar{
  display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 6px;
}
.seg{
  display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background:var(--paper);
}
.seg button{
  appearance:none;border:none;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--ink-2);
  padding:9px 16px;min-height:42px;transition:background .15s,color .15s;
}
.seg button + button{border-left:1px solid var(--line);}
.seg button.on{background:var(--ink);color:var(--paper);}

/* question / flip */
.qmeta{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:13px;color:var(--ink-3);margin:22px 0 12px;
}
.qmeta .t{color:var(--ink-2);font-weight:600;}
.tag{
  font-size:11.5px;padding:2px 9px;border-radius:20px;letter-spacing:.04em;
  border:1px solid var(--line);color:var(--ink-3);
}
.tag.hot{color:var(--seal);border-color:rgba(158,59,48,.35);background:var(--seal-soft);}
.tag.rec{color:var(--ok);border-color:rgba(63,107,78,.35);background:var(--ok-soft);}

.qtext{
  font-size:18px;line-height:1.85;color:var(--ink);
  font-weight:500;letter-spacing:.01em;margin:0 0 22px;
}
.opts{display:flex;flex-direction:column;gap:10px;margin:0 0 8px;}
.opt{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-radius:4px;
  padding:14px 16px;background:var(--paper);
  cursor:pointer;min-height:52px;
  transition:border-color .15s var(--ease),background .15s var(--ease);
}
.opt .lk{
  flex:none;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--ink-3);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;margin-top:1px;
}
.opt .lt{flex:1;font-size:15.5px;line-height:1.6;color:var(--ink);}
.opt.multi .lk{border-radius:5px;}
@media(hover:hover) and (pointer:fine){
  .opt:hover{border-color:var(--ink-3);}
}
.opt.sel{border-color:var(--seal);background:var(--seal-soft);}
.opt.sel .lk{background:var(--seal);border-color:var(--seal);color:var(--paper);}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.correct .lk{background:var(--ok);border-color:var(--ok);color:var(--paper);}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft);}
.opt.wrong .lk{background:var(--seal);border-color:var(--seal);color:var(--paper);}
.opt.dim{opacity:.55;}

.reveal-btn{
  appearance:none;cursor:pointer;margin-top:20px;
  background:none;border:1px solid var(--ink);color:var(--ink);
  font-family:var(--sans);font-size:15px;font-weight:600;
  padding:13px 22px;border-radius:3px;min-height:48px;width:100%;
  transition:background .15s,color .15s;
}
@media(hover:hover) and (pointer:fine){
  .reveal-btn:hover{background:var(--ink);color:var(--paper);}
}

.answer{
  margin-top:18px;border-top:1px solid var(--line);padding-top:18px;
  animation:fade .28s var(--ease) both;
}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ex-label{
  display:inline-block;font-size:11.5px;letter-spacing:.12em;color:var(--seal);
  border:1px solid rgba(158,59,48,.35);
  border-radius:3px;padding:2px 8px;margin-right:10px;vertical-align:middle;
}
.ex-ans{font-size:15.5px;line-height:1.8;margin:0 0 14px;color:var(--ink);}
.ans-key{
  display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;
  background:var(--ok);color:var(--paper);border-radius:4px;font-weight:600;
  font-size:13px;margin-right:8px;font-variant-numeric:tabular-nums;
}
.ex-anchor{font-size:14.5px;line-height:1.75;color:var(--ink-2);margin:0 0 12px;
  border-left:3px solid var(--seal);padding-left:12px;}
.ex-notes{margin:0 0 6px;}
.ex-note{font-size:14px;line-height:1.7;color:var(--ink-2);margin:0 0 8px;}
.ex-note .ex-x{color:var(--seal);font-weight:700;margin-right:6px;}
.ex-note b{color:var(--ink);}

/* nav row */
.navrow{display:flex;gap:10px;margin-top:26px;}
.btn{
  flex:1;appearance:none;cursor:pointer;font-family:var(--sans);
  font-size:15px;font-weight:600;padding:14px 16px;border-radius:3px;min-height:50px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
  transition:background .15s,color .15s,border-color .15s;
}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal);}
.btn.on-saved{background:var(--ok-soft);color:var(--ok);border-color:rgba(63,107,78,.35);}
@media(hover:hover) and (pointer:fine){
  .btn:hover{filter:brightness(.97);}
}
.btn:active{transform:scale(.985);}

/* exam config */
.cfg-block{margin:26px 0;}
.cfg-title{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:.03em;}
.cfg-note{font-size:13px;color:var(--ink-3);margin:-6px 0 14px;line-height:1.6;}
.start-btn{
  appearance:none;cursor:pointer;width:100%;margin-top:14px;
  background:var(--seal);color:#fff;border:none;
  font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:.04em;
  padding:17px;border-radius:3px;min-height:56px;
  transition:background .15s;
}
.start-btn:active{transform:scale(.99);}
@media(hover:hover) and (pointer:fine){.start-btn:hover{background:var(--seal-deep);}}

/* exam top status */
.exam-status{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 6px;font-size:13px;color:var(--ink-3);
}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);letter-spacing:.04em;}
.timer.warn{color:var(--seal);}
.hint-multi{font-size:13px;color:var(--seal);margin:0 0 12px;}

/* results */
.score-card{
  border:1px solid var(--line);border-radius:5px;background:var(--paper-2);
  padding:26px 24px;margin:24px 0 8px;text-align:center;
}
.score-num{font-family:var(--serif);font-size:clamp(46px,14vw,68px);font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;}
.score-num small{font-size:.4em;color:var(--ink-3);font-family:var(--sans);font-weight:500;margin-left:6px;}
.score-sub{margin-top:10px;font-size:14px;color:var(--ink-2);}
.score-pass{display:inline-block;margin-top:12px;font-size:13px;padding:4px 14px;border-radius:20px;}
.score-pass.ok{color:var(--ok);background:var(--ok-soft);}
.score-pass.no{color:var(--seal);background:var(--seal-soft);}
.brk{margin:20px 0;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.brk-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;}

.brk-row .bl{font-size:14px;color:var(--ink-2);}

.wrong-list{display:flex;flex-direction:column;}
.wrong-item{

  padding:15px 2px;cursor:pointer;
}
.wrong-item:last-child{border-bottom:1px solid var(--line);}
.wi-main{flex:1;min-width:0;}
.wi-t{font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.wi-m{font-size:12.5px;color:var(--ink-3);margin-top:3px;}
.wi-go{font-size:13px;color:var(--seal);flex:none;}

/* notes page */
.notes-sec{margin:28px 0;}
.notes-sec h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 14px;letter-spacing:.03em;

.num-list{list-style:none;margin:0;padding:0;}
.num-list li{padding:13px 0;border-top:1px solid var(--line-soft);font-size:14.5px;line-height:1.7;color:var(--ink-2);

.num-list li:first-child{border-top:none;}
.num-list .nk{flex:none;font-weight:600;color:var(--seal);font-variant-numeric:tabular-nums;min-width:64px;}
.tips{list-style:none;margin:0;padding:0;counter-reset:t;}
.tips li{padding:13px 0;border-top:1px solid var(--line-soft);font-size:14.5px;line-height:1.7;color:var(--ink-2);
  position:relative;padding-left:30px;}
.tips li:first-child{border-top:none;}
.tips li:before{counter-increment:t;content:counter(t);position:absolute;left:0;top:13px;
  width:20px;height:20px;border-radius:50%;border:1px solid var(--ink-3);color:var(--ink-3);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}

/* empty state */
.empty{padding:60px 10px;text-align:center;color:var(--ink-3);}
.empty .et{font-family:var(--serif);font-size:20px;color:var(--ink-2);margin-bottom:10px;}
.empty .ed{font-size:14px;margin-bottom:20px;line-height:1.6;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);font-size:14px;padding:12px 20px;border-radius:30px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);
  max-width:86%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* confirm overlay */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(35,33,28,.42);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.dialog{
  background:var(--paper);border-radius:6px;max-width:340px;width:100%;
  padding:24px 22px 18px;border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(35,33,28,.22);
}
.dialog h4{margin:0 0 8px;font-family:var(--serif);font-size:19px;font-weight:600;}
.dialog p{margin:0 0 18px;font-size:14.5px;color:var(--ink-2);line-height:1.65;}
.dialog .dbtns{display:flex;gap:10px;}

.kbd-hint{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.7;}
.kbd-hint b{color:var(--ink-2);font-weight:600;}

@media (max-width:480px){
  main{padding:0 16px 36px;}
  .topbar{padding:12px 16px;}
  .qtext{font-size:17px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>

<script>
"use strict";
const TYPE_LABEL={single:"单选",multiple:"多选",bool:"判断"};
const WEIGHT={single:2,multiple:3,bool:1};
const STORE_KEY="wb_exam_wrongbook_v1";

/* ---------- storage ---------- */
function loadWrong(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return[]}}
function saveWrong(a){try{localStorage.setItem(STORE_KEY,JSON.stringify(a))}catch(e){}}
function isWrong(id){return loadWrong().includes(id)}
function toggleWrong(id){let a=loadWrong();if(a.includes(id))a=a.filter(x=>x!==id);else a.push(id);saveWrong(a);return a.includes(id)}
function clearWrong(){saveWrong([])}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cleanNote(s){return String(s||"").replace(/[⭐🔥⚠️✅]/g,"").replace(/^[\s·]+/,"").trim();}
const fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
const $view=document.getElementById("view");
const $back=document.getElementById("backBtn");
const $topTitle=document.getElementById("topTitle");
const $topRight=document.getElementById("topRight");

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';

let state={view:"home",back:"home"};

function setBar(title,right){
  $topTitle.textContent=title||"";
  $topRight.innerHTML=right||"";
  $back.classList.toggle("hidden",state.view==="home");
}
function go(view,back){
  state.view=view;state.back=back||"home";
  window.scrollTo(0,0);
  render();
}

/* ---------- explanation builder ---------- */
function buildExplanation(q){
  let h="";
  const ansHtml=q.answer.map(k=>{
    const o=q.options.find(o=>o.key===k);
    return '<span class="ans-key">'+k+'</span>'+(o?esc(o.text):"");
  }).join(q.type==="multiple"?"　":"");
  h+='<div class="ex-ans"><span class="ex-label">正确答案</span>'+ansHtml+'</div>';
  if(q.anchor){h+='<div class="ex-anchor"><span class="ex-label">锚点</span>'+esc(q.anchor)+'</div>';}
  const notes=q.options.filter(o=>{
    if(!o.note)return false;
    const c=cleanNote(o.note);
    if(["保留","选这个","改选这个",""].includes(c))return false;
    return /至少不是|错|可疑|矛盾|张冠李戴|反话|不选|陷阱|硬顶|错：|错,/.test(c);
  });
  if(notes.length){
    h+='<div class="ex-notes">';
    notes.forEach(o=>{h+='<div class="ex-note"><span class="ex-x">×</span><b>'+o.key+'</b>　'+esc(cleanNote(o.note))+'</div>';});
    h+='</div>';
  }
  return h;
}

/* ---------- flag tags ---------- */
function flagTags(q){
  let h="";
  if(q.flags&&q.flags.hot)h+='<span class="tag hot">高频必背</span>';
  if(q.flags&&q.flags.recommended)h+='<span class="tag rec">推荐答案</span>';
  return h;
}

/* =========================================================
   HOME
========================================================= */
function renderHome(){
  setBar("讲师认证题库自测","");
  const wc=loadWrong().length;
  const guide = fine
    ? '键盘引导：数字 <b>1–4</b> 选择选项，<b>空格</b> 翻面看解析，<b>回车 / →</b> 下一题，<b>←</b> 上一题。'
    : '轻点选项作答，轻点「显示解析」翻面看答案与讲解。上下滑动浏览，底部按钮翻页。';
  $view.innerHTML=
    '<section class="hero">'+
      '<div class="kicker">WorkBuddy 讲师认证</div>'+
      '<h1 class="hero-title">题库自测</h1>'+
      '<p class="hero-sub">两卷去重 93 题 · 单选 56 · 多选 18 · 判断 19。随机抽题，实锤与推荐答案均已标注。</p>'+
    '</section>'+
    '<div class="rule"></div>'+
    modeRow("memorize","背题模式","逐题浏览，轻点翻面看答案与解析，可随手加入错题本")+
    modeRow("exam","真实答题","按真实考试结构抽题、计时、判分，错题自动入库")+
    modeRow("wrong","错题本","集中复习答错的题，可重做、可移除"+(wc?'<span class="mode-badge">'+wc+'</span>':''))+
    modeRow("notes","备考要点","价格数字锚点与临场执行清单，开考前速记")+
    '<div class="guide">'+guide+'<br><br>本页纯本地运行，数据存在浏览器内，清空缓存会丢失错题本。微信内可直接打开使用。</div>';
}
function modeRow(view,name,desc){
  return '<button class="mode-row" data-go="'+view+'"><div class="mode-main"><div class="mode-name">'+name+'</div><div class="mode-desc">'+desc+'</div></div>'+CHEV+'</button>';
}

/* =========================================================
   MEMORIZE (背题)
========================================================= */
let memo={list:[],idx:0,revealed:false,filter:"all"};
function memoFiltered(){
  if(memo.filter==="all")return QUESTIONS.slice();
  return QUESTIONS.filter(q=>q.type===memo.filter);
}
function renderMemorize(){
  setBar("背题模式",'<span id="mCount"></span>');
  const list=memoFiltered();
  $view.innerHTML=
    '<div class="filterbar" id="memoFilter">'+
      segBtn("all","全部")+segBtn("single","单选")+segBtn("multiple","多选")+segBtn("bool","判断")+
    '</div>'+
    '<div id="memoBody"></div>';
  document.querySelectorAll("#memoFilter button").forEach(b=>{
    b.onclick=()=>{memo.filter=b.dataset.f;memo.idx=0;memo.revealed=false;renderMemorize();};
  });
  document.getElementById("mCount").textContent=list.length+" 题";
  renderMemoBody();
}
function segBtn(f,label){
  return '<button data-f="'+f+'" class="'+(memo.filter===f?"on":"")+'">'+label+'</button>';
}
function renderMemoBody(){
  const list=memoFiltered();
  if(!list.length){document.getElementById("memoBody").innerHTML='<div class="empty"><div class="et">暂无题目</div></div>';return;}
  memo.idx=Math.max(0,Math.min(memo.idx,list.length-1));
  const q=list[memo.idx];
  const total=list.length;
  const saved=isWrong(q.id);
  let h='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+' · 第 '+(memo.idx+1)+' / '+total+' 题</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  h+='<div class="opts">'+q.options.map(o=>'<div class="opt"><span class="lk">'+o.key+'</span><span class="lt">'+esc(o.text)+'</span></div>').join("")+'</div>';
  if(memo.revealed){
    h+='<div class="answer">'+buildExplanation(q)+'</div>';
    h+='<div class="navrow">'+
        '<button class="btn" id="mPrev">上一题</button>'+
        '<button class="btn '+(saved?"on-saved":"")+'" id="mSave">'+(saved?"已入错题本":"加入错题本")+'</button>'+
        '<button class="btn primary" id="mNext">下一题</button>'+
      '</div>';
  }else{
    h+='<button class="reveal-btn" id="mReveal">显示解析</button>';
    h+='<div class="navrow"><button class="btn" id="mPrev">上一题</button><button class="btn primary" id="mNext">下一题</button></div>';
    if(fine)h+='<div class="kbd-hint">空格 翻面 · ← → 翻页</div>';
  }
  const body=document.getElementById("memoBody");
  body.innerHTML=h;
  const prev=document.getElementById("mPrev"),next=document.getElementById("mNext");
  prev.onclick=()=>{memo.idx--;memo.revealed=false;renderMemoBody();window.scrollTo(0,0);};
  next.onclick=()=>{memo.idx++;memo.revealed=false;renderMemoBody();window.scrollTo(0,0);};
  if(memo.revealed){
    document.getElementById("mSave").onclick=()=>{
      const now=toggleWrong(q.id);
      toast(now?"已加入错题本":"已移出错题本");
      renderMemorize();
    };
  }else{
    document.getElementById("mReveal").onclick=()=>{memo.revealed=true;renderMemoBody();};
  }
  prev.disabled=memo.idx===0;
  next.disabled=memo.idx===total-1;
}

/* =========================================================
   EXAM CONFIG (真实答题)
========================================================= */
let examCfg={range:"all",qty:"all",timer:false};
function renderExamConfig(){
  setBar("真实答题","");
  const rangeSeg=segExam("range",[["all","全部"],["single","单选"],["multiple","多选"],["bool","判断"]],examCfg.range);
  const qtySeg=segExam("qty",[["all","全部"],["sim50","模拟50"],["30","30题"],["20","20题"]],examCfg.qty);
  const timerSeg=segExam("timer",[["off","不计时"],["90","90分钟"]],examCfg.timer?"90":"off");
  $view.innerHTML=
    '<div class="cfg-block"><div class="cfg-title">练习范围</div>'+rangeSeg+'</div>'+
    '<div class="cfg-block"><div class="cfg-title">题目数量</div>'+qtySeg+
      '<div class="cfg-note">「模拟50」= 单选30 + 多选10 + 判断10，结构同真实考试（90分及格）。</div></div>'+
    '<div class="cfg-block"><div class="cfg-title">计时</div>'+timerSeg+
      '<div class="cfg-note">真实考试 50 题 90 分钟；切屏 / 截屏 5 次强制交卷，练习中不做限制。</div></div>'+
    '<button class="start-btn" id="startExam">开始答题</button>'+
    (fine?'<div class="kbd-hint">提示：答题时按 <b>1–4</b> 直接选选项，<b>回车</b> 进入下一题。</div>':'');
  bindSeg("range",v=>{examCfg.range=v;renderExamConfig();});
  bindSeg("qty",v=>{examCfg.qty=v;renderExamConfig();});
  bindSeg("timer",v=>{examCfg.timer=(v==="90");renderExamConfig();});
  document.getElementById("startExam").onclick=startExam;
}
function segExam(name,pairs,val){
  return '<div class="seg" data-seg="'+name+'">'+pairs.map(p=>'<button data-v="'+p[0]+'" class="'+(p[0]===val?"on":"")+'">'+p[1]+'</button>').join("")+'</div>';
}
function bindSeg(name,cb){
  document.querySelectorAll('[data-seg="'+name+'"] button').forEach(b=>{
    b.onclick=()=>cb(b.dataset.v);
  });
}

/* =========================================================
   EXAM RUN
========================================================= */
let exam=null,timerId=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){
  let list=[];
  const byType=t=>QUESTIONS.filter(q=>q.type===t);
  if(examCfg.qty==="sim50" && examCfg.range==="all"){
    list=shuffle(byType("single")).slice(0,30)
      .concat(shuffle(byType("multiple")).slice(0,10))
      .concat(shuffle(byType("bool")).slice(0,10));
  }else{
    let pool = examCfg.range==="all"?QUESTIONS:byType(examCfg.range);
    pool=shuffle(pool);
    if(examCfg.qty==="all")list=pool;
    else{const n=parseInt(examCfg.qty,10);list=pool.slice(0,Math.min(n,pool.length));}
  }
  exam={list,idx:0,answers:{},timerOn:examCfg.timer,timeLeft:examCfg.timer?90*60:0};
  setBar("真实答题","");
  renderExam();
  if(exam.timerOn){startTimer();}
}
function startTimer(){
  stopTimer();
  timerId=setInterval(()=>{
    exam.timeLeft--;
    if(exam.timeLeft<=0){exam.timeLeft=0;updateTimerDisplay();stopTimer();submitExam();return;}
    updateTimerDisplay();
  },1000);
}
function updateTimerDisplay(){
  const t=document.getElementById("exTimer");
  if(!t)return;
  const m=Math.floor(exam.timeLeft/60),s=exam.timeLeft%60;
  t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn",exam.timeLeft<=60);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function renderExamStatus(){
  const total=exam.list.length;
  let s='<div class="exam-status"><span id="exNum">第 '+(exam.idx+1)+' / '+total+' 题</span>';
  if(exam.timerOn){const m=Math.floor(exam.timeLeft/60),s2=exam.timeLeft%60;
    s+='<span class="timer'+(exam.timeLeft<=60?" warn":"")+'" id="exTimer">'+String(m).padStart(2,"0")+':'+String(s2).padStart(2,"0")+'</span>';}
  s+='</div>';
  return s;
}
function renderExam(){
  const total=exam.list.length;
  const q=exam.list[exam.idx];
  const userAns=exam.answers[q.id]||[];
  let h=renderExamStatus();
  h+='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+'</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  if(q.type==="multiple")h+='<div class="hint-multi">本题为多选，可多选</div>';
  h+='<div class="opts" id="exOpts">'+q.options.map(o=>{
    const sel=userAns.includes(o.key);
    return '<div class="opt '+(q.type==="multiple"?"multi ":"")+(sel?"sel":"")+'" data-k="'+o.key+'"><span class="lk">'+o.key+'</span><span class="lt">'+esc(o.text)+'</span></div>';
  }).join("")+'</div>';
  const last=exam.idx===total-1;
  h+='<div class="navrow"><button class="btn" id="exPrev">上一题</button><button class="btn primary" id="exNext">'+(last?"提交答卷":"下一题")+'</button></div>';
  $view.innerHTML=h;
  document.querySelectorAll("#exOpts .opt").forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k;
      let cur=exam.answers[q.id]||[];
      if(q.type==="multiple"){
        if(cur.includes(k))cur=cur.filter(x=>x!==k);else cur.push(k);
      }else{cur=[k];}
      exam.answers[q.id]=cur;
      renderExam();
    };
  });
  document.getElementById("exPrev").onclick=()=>{if(exam.idx>0){exam.idx--;renderExam();window.scrollTo(0,0);}};
  document.getElementById("exNext").onclick=()=>{
    if(last){submitExam();}else{exam.idx++;renderExam();window.scrollTo(0,0);}
  };
}

function isCorrect(q,userAns){
  if(!userAns||!userAns.length)return false;
  const a=[...q.answer].sort().join(",");
  const u=[...userAns].sort().join(",");
  return a===u;
}
function submitExam(){
  stopTimer();
  const list=exam.list;
  let score=0,total=0;
  const byType={single:[0,0],multiple:[0,0],bool:[0,0]};
  const wrong=[];
  list.forEach(q=>{
    const w=WEIGHT[q.type];total+=w;
    const ok=isCorrect(q,exam.answers[q.id]);
    byType[q.type][1]++;
    if(ok){score+=w;byType[q.type][0]++;}
    else wrong.push(q);
  });
  // save wrong to book
  const wb=loadWrong();let added=0;
  wrong.forEach(q=>{if(!wb.includes(q.id)){wb.push(q.id);added++;}});
  if(added)saveWrong(wb);
  renderResults({score,total,byType,wrong,added});
}
function renderResults(r){
  setBar("答题结果","");
  const pct=Math.round(r.score/r.total*100);
  const pass=r.score>=90;
  let h='<div class="score-card">'+
    '<div class="score-num">'+r.score+'<small>/ '+r.total+' 分</small></div>'+
    '<div class="score-sub">正确率 '+pct+'% · 共 '+r.wrong.length+' 题有误</div>'+
    '<div class="score-pass '+(pass?"ok":"no")+'">'+(pass?"达到 90 分及格线":"未达 90 分及格线")+'</div>'+
  '</div>';
  h+='<div class="brk">';
  [["single","单选"],["multiple","多选"],["bool","判断"]].forEach(([t,l])=>{
    const [c,n]=r.byType[t];
    if(n>0)h+='<div class="brk-row"><span class="bl">'+l+'（每题 '+WEIGHT[t]+' 分）</span><span class="bv">'+c+' / '+n+' 对</span></div>';
  });
  h+='</div>';
  if(r.added>0)h+='<div class="guide" style="margin-top:16px">已将 '+r.added+' 道新错题存入错题本。</div>';
  if(r.wrong.length){
    h+='<div class="wrong-head">错题解析</div><div class="wrong-list" id="wlist">';
    r.wrong.forEach((q,i)=>{
      h+='<div class="wrong-item" data-i="'+i+'"><div class="wi-main"><div class="wi-t">'+esc(q.text)+'</div><div class="wi-m">'+TYPE_LABEL[q.type]+' · 你的答案 '+fmtAns(exam.answers[q.id])+' / 正确 '+q.answer.join("、")+'</div></div><span class="wi-go">解析 →</span></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="empty" style="padding:36px 0"><div class="et">全部答对</div><div class="ed">这套题你拿满分，去错题本复习别的。</div></div>';
  }
  h+='<div class="navrow"><button class="btn" id="rRetry">重做本套</button><button class="btn primary" id="rHome">返回首页</button></div>';
  $view.innerHTML=h;
  if(r.wrong.length){
    document.querySelectorAll("#wlist .wrong-item").forEach(el=>{
      el.onclick=()=>{openReview(r.wrong[+el.dataset.i],false);};
    });
  }
  document.getElementById("rRetry").onclick=()=>{startExam();};
  document.getElementById("rHome").onclick=()=>go("home");
}
function fmtAns(a){if(!a||!a.length)return "未答";return a.slice().sort().join("、");}

/* =========================================================
   WRONG BOOK (错题本)
========================================================= */
let wrongView={idx:0,revealed:false,list:[]};
function renderWrong(){
  const ids=loadWrong();
  setBar("错题本",ids.length?'<span style="cursor:pointer" id="wClear">清空</span>':'');
  if(!ids.length){
    $view.innerHTML='<div class="empty"><div class="et">错题本还是空的</div><div class="ed">去「真实答题」做一套，答错的题会自动进到这里。</div><button class="btn primary" id="wGo" style="max-width:200px;margin:0 auto">去答题</button></div>';
    document.getElementById("wGo").onclick=()=>go("exam");
    return;
  }
  const map={};QUESTIONS.forEach(q=>map[q.id]=q);
  const list=ids.map(id=>map[id]).filter(Boolean);
  let h='<div class="qmeta"><span class="t">共 '+list.length+' 道待复习</span></div>';
  h+='<div class="wrong-list" id="wlist">';
  list.forEach((q,i)=>{
    h+='<div class="wrong-item" data-i="'+i+'"><div class="wi-main"><div class="wi-t">'+esc(q.text)+'</div><div class="wi-m">'+TYPE_LABEL[q.type]+' · 正确答案 '+q.answer.join("、")+'</div></div><span class="wi-go">复习 →</span></div>';
  });
  h+='</div>';
  $view.innerHTML=h;
  document.querySelectorAll("#wlist .wrong-item").forEach(el=>{
    el.onclick=()=>openReview(list[+el.dataset.i],true);
  });
  const clr=document.getElementById("wClear");
  if(clr)clr.onclick=()=>confirmDlg("清空错题本","将移除全部 "+ids.length+" 道错题，此操作不可撤销。",()=>{clearWrong();toast("已清空");renderWrong();});
}

/* review flip used by wrong book & results */
function openReview(q,fromWrong){
  state.view="review";state.back=fromWrong?"wrong":"results";
  setBar("复习","");
  wrongView={q,fromWrong,revealed:false};
  renderReview();
}
function renderReview(){
  const q=wrongView.q;
  let h='<div class="qmeta"><span class="t">'+TYPE_LABEL[q.type]+'</span>'+flagTags(q)+'</div>';
  h+='<div class="qtext">'+esc(q.text)+'</div>';
  h+='<div class="opts">'+q.options.map(o=>{
    const correct=q.answer.includes(o.key);
    return '<div class="opt '+(correct?"correct":"")+'"><span class="lk">'+o.key+'</span><span class="lt">'+esc(o.text)+'</span></div>';
  }).join("")+'</div>';
  if(wrongView.revealed){
    h+='<div class="answer">'+buildExplanation(q)+'</div>';
    h+='<div class="navrow"><button class="btn primary" id="rvBack">返回</button><button class="btn '+(isWrong(q.id)?"":"on-saved")+'" id="rvToggle">'+(isWrong(q.id)?"移出错题本":"加入错题本")+'</button></div>';
  }else{
    h+='<button class="reveal-btn" id="rvReveal">显示解析</button>';
    if(fine)h+='<div class="kbd-hint">空格 翻面</div>';
  }
  $view.innerHTML=h;
  if(wrongView.revealed){
    document.getElementById("rvBack").onclick=()=>{ if(wrongView.fromWrong)renderWrong(); else go("home"); };
    document.getElementById("rvToggle").onclick=()=>{toggleWrong(q.id);toast(isWrong(q.id)?"已加入错题本":"已移出错题本");renderReview();};
  }else{
    document.getElementById("rvReveal").onclick=()=>{wrongView.revealed=true;renderReview();};
  }
}

/* =========================================================
   toast & confirm
========================================================= */
let toastId=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastId);toastId=setTimeout(()=>t.classList.remove("show"),1800);
}
const overlay=document.getElementById("overlay");
function confirmDlg(title,text,onOk){
  document.getElementById("dlgTitle").textContent=title;
  document.getElementById("dlgText").textContent=text;
  overlay.classList.add("show");
  const ok=document.getElementById("dlgOk"),cancel=document.getElementById("dlgCancel");
  const close=()=>{overlay.classList.remove("show");ok.onclick=null;cancel.onclick=null;};
  ok.onclick=()=>{close();onOk();};
  cancel.onclick=close;
}

/* =========================================================
   routing & keyboard
========================================================= */
function render(){
  switch(state.view){
    case"home":renderHome();break;
    case"memorize":renderMemorize();break;
    case"exam":renderExamConfig();break;
    case"wrong":renderWrong();break;
    case"notes":renderNotes();break;
    default:renderHome();
  }
}
$view.addEventListener("click",e=>{
  const row=e.target.closest("[data-go]");
  if(row){go(row.dataset.go);}
});
$back.onclick=()=>{
  // stop timer if leaving exam
  if(state.view==="review"){ if(wrongView.fromWrong)renderWrong(); else go("home"); return; }
  stopTimer();
  go("home");
};

document.addEventListener("keydown",e=>{
  if(state.view==="memorize"){
    const list=memoFiltered();
    if(e.key===" "){e.preventDefault();if(!memo.revealed){memo.revealed=true;renderMemoBody();}else if(memo.idx<list.length-1){memo.idx++;memo.revealed=false;renderMemoBody();window.scrollTo(0,0);}return;}
    if(e.key==="ArrowRight"){if(memo.idx<list.length-1){memo.idx++;memo.revealed=false;renderMemoBody();window.scrollTo(0,0);}}
    if(e.key==="ArrowLeft"){if(memo.idx>0){memo.idx--;memo.revealed=false;renderMemoBody();window.scrollTo(0,0);}}
  }else if(state.view==="review"){
    if(e.key===" "){e.preventDefault();if(!wrongView.revealed){wrongView.revealed=true;renderReview();}}
  }else if(state.view==="exam" && exam){
    if(["1","2","3","4"].includes(e.key)){
      const q=exam.list[exam.idx];
      const opt=q.options[parseInt(e.key,10)-1];
      if(opt){
        let cur=exam.answers[q.id]||[];
        if(q.type==="multiple"){if(cur.includes(opt.key))cur=cur.filter(x=>x!==opt.key);else cur.push(opt.key);}
        else cur=[opt.key];
        exam.answers[q.id]=cur;renderExam();
      }
    }else if(e.key==="Enter"){
      e.preventDefault();
      const last=exam.idx===exam.list.length-1;
      if(last)submitExam();else{exam.idx++;renderExam();window.scrollTo(0,0);}
    }
  }
});

render();
