const QUESTIONS = [{"id":"s1","type":"single","no":1,"text":"客户反馈机器人已完成接入、WorkBuddy 端显示已注册或已配置完成，但发送消息后没有响应。正确的排查思路是？","options":[{"key":"A","text":"先确认当前连接状态是否仍然在线，再优先切换模型后再次测试，部分无响应问题可通过切换模型缓解","note":"选这个"},{"key":"B","text":"直接卸载客户端并重新完成一次接入配置","note":""},{"key":"C","text":"提交退货退款工单，等待腾讯云客服在两个工作日内审核处理","note":""},{"key":"D","text":"将复杂任务拆分为更小步骤后重新接入平台","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"显示已配置却没响应，先做成本最低的排查：确认连接是否还在线、再切模型重试。直接卸载重装、提退货工单都是杀鸡用牛刀。","concepts":[]},{"id":"s2","type":"single","no":2,"text":"客户在签约前问：\"积分会不会过期？\"按照红线第5条，正确的应对是？","options":[{"key":"A","text":"告诉客户积分永久有效，先把单签下来","note":""},{"key":"B","text":"说积分到期会自动结转，让客户放心","note":""},{"key":"C","text":"客户不问就不主动提，等签约后再解释","note":""},{"key":"D","text":"按腾讯云订购协议6.3，企业版套件积分在服务期限届满时失效、不自动结转——要主动说清楚别藏着，同时顺势推长期的好处：\"按年买比按月买，中间不用经历额度清零\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"红线第5条：企业版积分到期失效、不自动结转，签约前必须主动说清，不能藏着。顺势推按年买更划算、中间不必经历清零。","concepts":["redline","credits"]},{"id":"s3","type":"single","no":3,"text":"客户说：\"万一买了大家都不用怎么办。\"这位客户担的其实是什么，销售应如何应对？","options":[{"key":"A","text":"他担的是自己的绩效风险——讲管理后台的用量可视，让他\"看得住\"","note":"选这个"},{"key":"B","text":"他嫌价格贵——立刻申请折扣留住他","note":""},{"key":"C","text":"他不懂技术——安排架构师做一次深度讲解","note":""},{"key":"D","text":"他在拒绝企业版——应转为推个人版先收一单","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"他说“没人用”，真正怕的是自己拍板买了却用不起来、绩效背锅。用管理后台用量可视让他“看得住”，比降价更对症。","concepts":["triage"]},{"id":"s4","type":"single","no":4,"text":"客户合规负责人在安全评审中问：「WorkBuddy 的用户协议与隐私协议是否符合国内相关法规？」正确的回答是？","options":[{"key":"A","text":"符合《网络安全法》《数据安全法》《个人信息保护法》","note":"选这个"},{"key":"B","text":"仅符合 ISO 27001，国内法规暂不适用","note":""},{"key":"C","text":"仅符合欧盟 GDPR","note":""},{"key":"D","text":"尚未通过任何合规认证","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"国内合规底线：《网络安全法》《数据安全法》《个人信息保护法》。只提 ISO/GDPR 或“暂不适用”都是错答。","concepts":["compliance"]},{"id":"s5","type":"single","no":5,"text":"客户使用旗舰版内置的腾讯文档时，提出需要把表格能力从 2000 行提升到 4 万行、表格自动化次数从 100 次提升到 5 万次/人。该能力应如何获得？","options":[{"key":"A","text":"属于腾讯文档的旗舰版内置权益，购买旗舰版后直接获得","note":""},{"key":"B","text":"属于腾讯文档的旗舰版可升级权益，需在购买后升级","note":"选这个"},{"key":"C","text":"需将版本升级为企业专享版后自动获得","note":""},{"key":"D","text":"需采购私有化企业版后自动获得","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"表格 4 万行、自动化 5 万次/人是旗舰版“可升级权益”——买旗舰版后还需升级才拿到，不是开箱即得。","concepts":["version_matrix"]},{"id":"s6","type":"single","no":6,"text":"某客户团队以产品经理、设计师、全栈开发者和编程初学者为主，希望一个工具打通从需求规划到产品发布的全流程。最适合推荐哪款产品？","options":[{"key":"A","text":"CodeBuddy，面向智能编码，是覆盖从需求规划到产品部署全流程闭环的产设研一体工作台","note":"选这个（已实锤）"},{"key":"B","text":"WorkBuddy，面向 AI 办公协同的全场景职场 AI 智能体桌面工作台","note":"⚠️ 高频坑"},{"key":"C","text":"WorkBuddy Managed Agents，提供云端托管的智能体运行服务","note":""},{"key":"D","text":"腾讯混元大模型，直接作为对话底座使用","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"CodeBuddy=产设研一体工作台（需求规划到产品部署闭环）；WorkBuddy=办公协同 AI。题干“从需求到发布全流程”点名 CodeBuddy。","concepts":["version_matrix"]},{"id":"s7","type":"single","no":7,"text":"客户担心「我们同事不会写提示词，也不懂怎么把复杂任务拆成步骤」，此时应重点介绍 WorkBuddy 的哪项核心能力？","options":[{"key":"A","text":"自然语言交互，使用自然语言描述需求，无需预先拆分复杂操作步骤","note":"选这个"},{"key":"B","text":"需要用户先提交一份详细的分步操作清单，系统才能开始执行","note":""},{"key":"C","text":"必须先由 IT 部门编写脚本，再导入系统运行","note":""},{"key":"D","text":"仅支持在固定模板中填写参数后单次执行","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"WorkBuddy 核心卖点之一：用自然语言说需求，不用你先拆成步骤清单、也不用 IT 写脚本。","concepts":[]},{"id":"s8","type":"single","no":8,"text":"客户说：\"我先买个个人版试试好不好用。\"按照转版话术的分诊框架，销售的正确第一反应是什么？","options":[{"key":"A","text":"立刻拦住客户，强调只有企业版才有保障，个人版不值得买","note":""},{"key":"B","text":"不拦，改成给客户一条\"试完不用推倒重来\"的路：建议他挑三四个岗位的同事一起进一个项目，将来直接升级企业坐席","note":"选这个"},{"key":"C","text":"先花半小时讲完企业版管理后台功能，再让客户自己选","note":""},{"key":"D","text":"告诉客户个人版功能阉割严重，试用没有参考价值","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"分诊第一反应不是拦，而是给“试完不用推倒重来”的路：拉几个同事进一个项目，将来直接升企业坐席。","concepts":["triage"]},{"id":"s9","type":"single","no":9,"text":"客户已采购 WorkBuddy 企业版，研发负责人接着问：\"我们研发团队还想用 CodeBuddy，是不是要再单独买一套授权？\"讲师的正确回应是：","options":[{"key":"A","text":"需要单独购买一套 CodeBuddy 授权，两个产品分别计费","note":""},{"key":"B","text":"CodeBuddy 只随个人版赠送，企业版不包含","note":""},{"key":"C","text":"研发团队只能申请 CodeBuddy 的限时试用，无法正式使用","note":""},{"key":"D","text":"一个 License 双产品通用，企业版订阅同时覆盖 WorkBuddy 与 CodeBuddy，这也是企业版的核心卖点之一","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业版订阅同时覆盖 WorkBuddy 与 CodeBuddy，一个 License 通用，这是企业版核心卖点，不用再单买。","concepts":["version_matrix"]},{"id":"s10","type":"single","no":10,"text":"客户希望一个复杂任务可以由多个 Agent 同时协作推进，并在任务列表中持久保存、随时用 IDE 打开查看。讲师应建议对该任务执行哪种操作？","options":[{"key":"A","text":"置顶","note":""},{"key":"B","text":"重命名","note":""},{"key":"C","text":"保存到工作空间","note":"选这个"},{"key":"D","text":"归档","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"多 Agent 协作任务要持久保存、随时 IDE 打开→“保存到工作空间”。置顶/重命名/归档都不是持久化动作。","concepts":["workspace"]},{"id":"s11","type":"single","no":11,"text":"面对企业客户做产品介绍时，三场演练暴露\"无一人主动提及\"安全性要点。按照导师要求，正确做法是？","options":[{"key":"A","text":"等客户问到数据安全再讲，显得不心虚","note":""},{"key":"B","text":"开场就主动说：\"WorkBuddy所有工作内容都在您本地执行，不会造成数据泄露，也不会拿去训练AI\"——企业客户听到这条，信任立建","note":"选这个"},{"key":"C","text":"这个点太技术化，留给架构师在后续环节讲","note":""},{"key":"D","text":"放到演示最后一页一笔带过即可","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"三场演练无人提安全→导师要求开场就主动说“所有内容本地执行、不泄露、不训练”，企业客户信任立建。等客户问才讲显得心虚。","concepts":["compliance","security_3layer"]},{"id":"s12","type":"single","no":12,"text":"客户用 WorkBuddy 完成一份行业分析报告后，希望把成果直接发给部门同事，讲师应演示什么操作？","options":[{"key":"A","text":"在右侧结果区打开产物列表下拉框，右键点击对应产物文件选择分享文件；或在预览产物时选择上传至云端","note":"选这个"},{"key":"B","text":"在任务列表中将该任务置顶后即可分享","note":""},{"key":"C","text":"把任务保存到工作空间即可自动分享给同事","note":""},{"key":"D","text":"在自动化页面开启推送到小程序","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"成果发给同事：右侧结果区产物列表右键分享，或预览时上传云端。置顶/存工作空间都不等于分享。","concepts":["workspace"]},{"id":"s13","type":"single","no":13,"text":"某客户希望 AI 在做任务时能直接访问公司正在使用的外部业务服务，以获取实时数据支撑任务。应引导客户使用哪种扩展方式？","options":[{"key":"A","text":"连接器，通过连接器访问外部服务，为任务提供数据和知识支持","note":"选这个"},{"key":"B","text":"资料库，主要用于沉淀和使用企业内部知识","note":""},{"key":"C","text":"专家，用于复用专业知识与工作方法","note":""},{"key":"D","text":"技能，用于把云端 Agent 一键下发至 WorkBuddy 端的企业智能体列表","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"要 AI 访问公司外部业务服务取实时数据→用连接器。资料库是内部知识、专家是专业方法、技能是云端下发。","concepts":["connector_vs_kb"]},{"id":"s14","type":"single","no":14,"text":"客户使用 VS Code 插件登录时报错，提示 timeout of 30000ms exceeded。正确的处理步骤是？","options":[{"key":"A","text":"顶部搜索框输入 >show out 并选择显示输出通道，将输出通道选择为 CodeBuddy，复制其中对应位置的链接并在浏览器打开，进行扫码登录","note":"⭐ 改选这个"},{"key":"B","text":"在设置中搜索 @id:workbench.externalBrowser，将默认浏览器设置为 Chrome 后重启 IDE","note":"⚠️ 至少不是这个"},{"key":"C","text":"在设置中搜索 shell，将 Terminal > Integrated > Shell Integrated 开启为 Enable","note":""},{"key":"D","text":"在设置中搜索 gallery，将地址配置为 https://marketplace.visualstudio.com 后重启 IDE","note":""}],"answer":["A"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"VS Code 登录 timeout：>show out 打开输出通道选 CodeBuddy，复制链接浏览器扫码","plain":"VS Code 插件登录 timeout：顶部搜索 >show out 打开输出通道选 CodeBuddy，复制链接浏览器扫码。改默认浏览器/开 shell/改 gallery 都不是正解（锚点题）。","concepts":[]},{"id":"s15","type":"single","no":15,"text":"客户希望调用「AI 问答 API、平台管理 API、乐享 Claw MCP」对接自有系统。该能力属于旗舰版内置产品的哪一类权益？","options":[{"key":"A","text":"腾讯乐享知识库的可升级权益（开放平台）","note":"选这个"},{"key":"B","text":"腾讯乐享知识库的旗舰版内置权益","note":""},{"key":"C","text":"腾讯文档的可升级权益（企业个性化与系统集成）","note":""},{"key":"D","text":"安全与效能运营平台的旗舰版内置权益","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"AI 问答 API、平台管理 API、乐享 Claw MCP 这类“开放平台”能力，属腾讯乐享知识库的“可升级权益”，不是腾讯文档内置。","concepts":["connector_vs_kb","mcp"]},{"id":"s16","type":"single","no":16,"text":"客户希望把企业内部系统和外部服务接入 WorkBuddy，以扩展 AI 能力。讲师应介绍哪项能力？","options":[{"key":"A","text":"只能通过自动化定时触发外部服务，无法直接连接","note":""},{"key":"B","text":"在任务栏快捷管理连接器，连接外部服务，扩展 AI 能力","note":"选这个"},{"key":"C","text":"必须使用完全访问权限才能连接外部服务","note":""},{"key":"D","text":"在资料库中添加外部服务账号即可完成接入","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"扩展 AI 能力接外部服务：在任务栏快捷管理连接器。不是只能定时触发、也不是资料库加账号。","concepts":["connector_vs_kb"]},{"id":"s17","type":"single","no":17,"text":"客户老板问：\"这钱花出去，到底谁在用、用在哪了？你用什么回答我？\"按照支点4，正确的回应是？","options":[{"key":"A","text":"个人版也有企业级用量看板，一样能查","note":""},{"key":"B","text":"企业版管理后台，管理员一张表就能看到这个月总共用了多少额度、还剩多少、分布在哪些产品上、哪些人用得多，该视图仅向管理员开放","note":"选这个"},{"key":"C","text":"让行政每月向员工收集使用截图汇总上报","note":""},{"key":"D","text":"管理员逐个登录员工的个人账号查看用量","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"老板问“谁在用、用在哪”→企业版管理后台一张表看总额度、剩余、分布、谁用得多，仅管理员可见。个人版没有企业级看板。","concepts":["version_matrix"]},{"id":"s18","type":"single","no":18,"text":"某客户的市场专员需要为周末的线下促销活动快速产出一张活动海报，没有设计基础，希望直接用 WorkBuddy 生成。讲师应介绍哪项内置技能？","options":[{"key":"A","text":"PPT 制作，根据数据生成汇报演示文稿","note":""},{"key":"B","text":"自动化报表，合并多份 Excel 并输出图表报告","note":""},{"key":"C","text":"海报生成，根据需求生成活动海报","note":"选这个"},{"key":"D","text":"文件整理，整理 Downloads 文件夹里的图片按日期分类","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"无设计基础快速出活动海报→“海报生成”技能。PPT 制作/报表/文件整理都不是出海报。","concepts":["plugin_skill"]},{"id":"s19","type":"single","no":19,"text":"员工对未信任的工作区选择「以受限模式打开」后，下列说法正确的是？","options":[{"key":"A","text":"仍可浏览、搜索和编辑文件，但 WorkBuddy 不扫描或运行工作区配置目录下的文件，不自动加载其中的设置、规则、命令或脚本","note":"选这个"},{"key":"B","text":"工作区立即被只读锁定，任何文件都无法编辑","note":""},{"key":"C","text":"工作区会被整体隔离 24 小时，之后自动转为信任","note":""},{"key":"D","text":"受限模式下无法使用对话功能","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"以受限模式打开未信任工作区：仍能浏览/搜索/编辑文件，但 WorkBuddy 不扫描或运行配置目录下的设置/规则/脚本。不是只读锁定、也不是隔离 24h。","concepts":["permission"]},{"id":"s20","type":"single","no":20,"text":"销售问客户：\"咱们这个项目大概要拉几个人一起用？\"客户答：\"十四五个人吧。\"按照支点1\"10人硬顶\"，销售的正确说法是？","options":[{"key":"A","text":"\"个人版最多的一个档，单个项目协作人数上限是10人，第11个人就进不去了——这不是钱的问题，这是走不通\"","note":"⭐ 改选这个"},{"key":"B","text":"\"企业版AI更聪明，所以能支持更多人\"","note":"⚠️ 至少不是这个（典型错误话术陷阱）"},{"key":"C","text":"\"把项目拆成两个，分别用两个个人旗舰版账号\"","note":""},{"key":"D","text":"\"先让10个人用，其余的人排队等名额\"","note":""}],"answer":["A"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"十四五人：支点1=10人硬顶，「第11人进不去——不是钱的问题，是走不通」","plain":"14-15 人→支点1“10 人硬顶”：单项目协作上限 10 人，第 11 人进不去，这是结构性走不通，不是钱的问题。别用“AI 更聪明”糊弄（那是红线）。","concepts":["redline","triage"]},{"id":"s21","type":"single","no":21,"text":"客户 IT 负责人问：「AI 与我们内部系统对接时，怎么保证连接身份不被伪造？」关于 WorkBuddy 安全通信网关的正确回答是？","options":[{"key":"A","text":"安全通信网关支持 Gateway Token 认证与连接鉴权，配合 SSO/企业认证及 Role 权限控制，确保每一次连接都经过严格验证","note":"选这个"},{"key":"B","text":"连接不做鉴权，完全靠内网物理隔离保证安全","note":""},{"key":"C","text":"仅靠账号密码登录，无其他验证机制","note":""},{"key":"D","text":"每次连接都需要人工电话确认后才放行","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"防连接身份伪造→安全通信网关：Gateway Token 认证+连接鉴权+SSO/企业认证+Role 权限，每次连接严验证。不是靠内网隔离、也不是只靠账号密码。","concepts":["gateway"]},{"id":"s22","type":"single","no":22,"text":"客户说：\"我们先买 10 个坐席试试水，反正账号随便注册，我们 30 个同事都能登录用，对吧？\"下列讲师的纠正与促单讲法正确的是？","options":[{"key":"A","text":"告诉客户 10 个许可证可供 30 人轮流使用，只要不是同时在线就没有任何限制","note":""},{"key":"B","text":"告诉客户企业拥有的许可证数量决定了当前企业有多少用户可以同时使用 WorkBuddy 产品——10 个坐席只支持 10 人同时使用；30 位同事都要用，建议按实际使用人数配置席位，后续也可以根据实际情况扩容","note":"选这个"},{"key":"C","text":"告诉客户 10 个坐席每月共有 20,000 Credits 团队共享，30 人分着用完全够了，不需要加购席位","note":""},{"key":"D","text":"告诉客户 30 人同时使用必须购买企业专享版，100 个坐席起购，316 元/人/月","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"10 坐席只支持 10 人同时使用，不是 30 人轮流用。按实际人数配席位，后续可扩容。把坐席当“20,000 Credits 分给 30 人”是错算。","concepts":["credits","version_matrix"]},{"id":"s23","type":"single","no":23,"text":"客户说「我们已经有 AI 对话工具了，不就是聊聊天、给点建议吗」。针对这一认知，讲师最恰当的回应是？","options":[{"key":"A","text":"传统 AI 对话只能对话、提供建议，WorkBuddy 能够实际执行任务，并交付可验收的结果","note":"选这个"},{"key":"B","text":"WorkBuddy 与传统 AI 对话一样，主要价值是把文字回复写得更长","note":""},{"key":"C","text":"WorkBuddy 同样需要用户手动操作文件，只是界面更好看","note":""},{"key":"D","text":"WorkBuddy 与传统 AI 对话一样，只擅长单步骤简单任务","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"客户以为 AI 只是聊天给建议→WorkBuddy 实际能执行任务、交付可验收成果（文档/表/PPT）。这是和传统对话工具的根本区别。","concepts":[]},{"id":"s24","type":"single","no":24,"text":"客户认可自动化的价值，但表示不会写提示词，不想从零开始配置定时任务。讲师应展示什么？","options":[{"key":"A","text":"只能自己从零编写提示词，系统不提供任何模板","note":""},{"key":"B","text":"让 WorkBuddy 先创建一个专家团代写提示词","note":""},{"key":"C","text":"直接使用任务模板，覆盖新闻推送、周报生成、体检预约、学习计划等常见场景，选择后按需修改即可","note":"选这个"},{"key":"D","text":"从灵感中收藏案例后，系统会自动生成定时规则","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"不会写提示词/不想从零配定时任务→直接用任务模板（新闻推送/周报/体检预约…），选后改改即可。","concepts":["automation"]},{"id":"s25","type":"single","no":25,"text":"某客户希望部署一个需要 7×24 小时在线值守的智能客服，并要求在无任务时自动休眠以节省成本，同时希望这些 Agent 能下发到员工的 WorkBuddy 端直接使用。最适合推荐哪款产品？","options":[{"key":"A","text":"CodeBuddy","note":""},{"key":"B","text":"WorkBuddy","note":""},{"key":"C","text":"WorkBuddy Managed Agents，Agent 在云端沙箱运行，适合长程任务、在线客服、自动触发任务，并可一键下发至 WorkBuddy 端","note":"选这个"},{"key":"D","text":"腾讯混元大模型的在线接口","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"要 7×24 在线值守、无任务自动休眠、还能下发到员工端→Managed Agents（云端沙箱跑长程/在线客服/自动触发）。CodeBuddy/WorkBuddy 本体都不是为驻云设计的。","concepts":["managed_agents"]},{"id":"s26","type":"single","no":26,"text":"向研发客户介绍 CodeBuddy 时，关于其产品形态，正确的说法是？","options":[{"key":"A","text":"仅提供网页版一种形态","note":""},{"key":"B","text":"支持 IDE、插件、CLI 三种形态","note":"选这个"},{"key":"C","text":"只能以 VS Code 插件形式使用","note":""},{"key":"D","text":"必须安装独立虚拟机运行","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"CodeBuddy 产品形态：IDE、插件、CLI 三种。不是只网页版、也不是只 VS Code 插件。","concepts":["version_matrix"]},{"id":"s27","type":"single","no":27,"text":"客户反馈 WorkBuddy 启动后被拦截、登录窗口拉不起来，怀疑是安全软件导致。正确的处理建议是？","options":[{"key":"A","text":"临时退出火绒、360 安全卫士、电脑管家、Windows 安全中心后重试，WorkBuddy 常被误拦截，关闭后重试即可","note":"选这个"},{"key":"B","text":"卸载 WorkBuddy 客户端并重新下载安装最新版本","note":""},{"key":"C","text":"将网络切换为家庭网络，按官网网络排查流程逐项处理","note":""},{"key":"D","text":"登录官网从头像处进入个人主页 > 账号管理注销账号后重新注册","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"启动被拦、登录窗拉不起→多被火绒/360/电脑管家/Win 安全中心误拦，临时退出重试。直接卸载重装是大动作。","concepts":[]},{"id":"s28","type":"single","no":28,"text":"客户说：\"我自己在用挺好，公司那边以后再说。\"这是分诊表里最危险的一种\"伪装的好评\"，正确的识别与应对方法是？","options":[{"key":"A","text":"听到好评就满足，回CRM记一笔\"客户认可\"即可","note":""},{"key":"B","text":"识别方法是问满意度，满意度高就不用再跟了","note":""},{"key":"C","text":"立刻纠正客户\"个人版不适合公司场景\"，要求马上转企业版","note":""},{"key":"D","text":"识别方法是问人数而不是问满意度——用10人天花板测试他到底几个人在用，并制造时间压力：\"趁大家都说好用的时候提，最容易批\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"“我自己用挺好”是分诊里最危险的伪装好评。别问满意度，问人数（10 人天花板测试他到底几人用），再制造时间压力促单。","concepts":["triage"]},{"id":"s29","type":"single","no":29,"text":"某客户希望快速完成课题研究、竞品分析和结论整理，覆盖从资料检索、信息交叉验证到报告生成的全过程。这属于 WorkBuddy 的哪类适用场景？","options":[{"key":"A","text":"深度调研","note":"选这个"},{"key":"B","text":"日常办公","note":""},{"key":"C","text":"代码与应用开发","note":""},{"key":"D","text":"服务与知识","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"资料检索→交叉验证→报告生成全过程=深度调研场景。日常办公/代码开发/服务知识都不是。","concepts":[]},{"id":"s30","type":"single","no":30,"text":"客户在试用阶段关心账号接入方式，WorkBuddy 个人版支持哪些登录方式？","options":[{"key":"A","text":"仅支持微信登录","note":""},{"key":"B","text":"支持微信、手机号、邮箱、SSO 等多种登录方式","note":"选这个"},{"key":"C","text":"仅支持手机号与邮箱登录","note":""},{"key":"D","text":"仅支持 SSO 单点登录","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"个人版支持微信/手机号/邮箱/SSO 等多种登录，不是只微信、也不是只手机号邮箱。","concepts":[]},{"id":"s31","type":"single","no":31,"text":"算完账后客户说：\"那我买标准版¥99就行了。\"按照场景B的标准应对，销售应该讲什么？","options":[{"key":"A","text":"标准版单项目也能加到10个人，够用了","note":""},{"key":"B","text":"标准版积分可以共享给同事，不吃亏","note":""},{"key":"C","text":"标准版也有管理后台，公司看得见用量","note":""},{"key":"D","text":"企业版多付的这99块，买的是\"管理层能看见、资产能留下、权限能收回\"这三件事——要不要买，取决于您觉得这工具是\"大家私下用用\"还是\"公司正式投产\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"客户想买标准版 ¥99→场景B话术：企业版多 99 块买的是“管理层看得见、资产留得下、权限收得回”三件事。取决于他当“私下用”还是“公司投产”。","concepts":["redline","version_matrix"]},{"id":"s32","type":"single","no":32,"text":"客户第一次接触 WorkBuddy，在交流中问「这个东西到底能帮我干什么」，下列介绍最准确的是？","options":[{"key":"A","text":"腾讯出品的全场景 AI 工作台，用自然语言描述需求，由它自主规划和执行任务，交付文档、表格、PPT 等可直接使用的完整成果，并可连接腾讯办公生态","note":"选这个"},{"key":"B","text":"一款安装在编辑器里、专门帮程序员补全代码的 AI 编程插件","note":""},{"key":"C","text":"腾讯云提供的一站式云服务器与数据库托管服务","note":""},{"key":"D","text":"一款只能在线聊天、回答问题的通用问答机器人","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"WorkBuddy 定位：腾讯全场景 AI 工作台，自然语言描述需求→自主规划执行→交付可直接用的成果，连腾讯办公生态。不是编程插件、也不是云服务器。","concepts":[]},{"id":"s33","type":"single","no":33,"text":"客户反馈 WorkBuddy 无法读取图片、PDF、Excel、Word 等文件，最可能的原因是？","options":[{"key":"A","text":"当前模型不支持对应文件类型，或未安装相关插件与 Skill","note":"选这个"},{"key":"B","text":"请求频率受限，需要等待一段时间后再重试","note":""},{"key":"C","text":"工作空间目录未被授权，AI 无法访问任何本地文件","note":""},{"key":"D","text":"安装目录下存在用户项目目录，文件在更新时被覆盖删除","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"读不了图片/PDF/Excel/Word→多半当前模型不支持该类型，或没装对应插件/Skill。像播放器缺解码器。","concepts":["multimodal"]},{"id":"s34","type":"single","no":34,"text":"客户使用鸿蒙 6 系统的微信扫码连接机器人时一直扫码失败，正确的答复是？","options":[{"key":"A","text":"鸿蒙 6 的微信扫码当前存在不兼容情况，鸿蒙 4 可以正常连接；临时方案是先使用安卓手机完成首次扫码连接，再切换回鸿蒙微信继续使用","note":"选这个"},{"key":"B","text":"鸿蒙 4 存在不兼容，需将系统升级到鸿蒙 6 后重新扫码连接","note":""},{"key":"C","text":"需重新创建或重新填写一次 Webhook 配置，避免重复输入同一地址","note":""},{"key":"D","text":"需清除编辑器缓存，并清空 CachedExtensionVSIXs 缓存文件夹后重试","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"鸿蒙 6 微信扫码连机器人失败→鸿蒙 6 当前不兼容，鸿蒙 4 可连；临时用安卓手机首次扫码，再切回鸿蒙继续用。","concepts":[]},{"id":"s35","type":"single","no":35,"text":"讲师在给客户演示技能能力时提到\"自动化报表\"技能，它的效果是？","options":[{"key":"A","text":"根据数据生成汇报演示文稿","note":""},{"key":"B","text":"根据需求生成活动海报","note":""},{"key":"C","text":"合并多份 Excel 并输出图表报告","note":"选这个"},{"key":"D","text":"整理 Downloads 文件夹里的图片，按日期分类","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"“自动化报表”技能：合并多份 Excel 并输出图表报告。PPT/海报/文件整理是别的技能。","concepts":["plugin_skill","automation"]},{"id":"s36","type":"single","no":36,"text":"客户咨询私有化企业版的价格，希望直接拿到标准报价单。作为讲师，正确的回应是？","options":[{"key":"A","text":"按 198 元/人/月、2,376 元/人/年报价","note":""},{"key":"B","text":"按 316 元/人/月、3,792 元/人/年报价","note":""},{"key":"C","text":"私有化版价格详情请咨询私有化企业版售前咨询","note":"选这个"},{"key":"D","text":"私有化版与专享版同价，可直接按专享版报价","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"私有化企业版无标准报价单，价格请咨询私有化售前。别按 198 或 316 报，也别和专享版同价。","concepts":["private_deploy","version_matrix"]},{"id":"s37","type":"single","no":37,"text":"客户问：「AI 执行命令时万一把系统搞坏了怎么办？」关于「Bash 命令沙箱」的作用，正确的说法是？","options":[{"key":"A","text":"给每条命令加时间戳，方便事后追责","note":""},{"key":"B","text":"AI 操作与真实系统严格隔离，防止对系统造成破坏","note":"选这个"},{"key":"C","text":"完全禁止 AI 执行任何 Bash 命令","note":""},{"key":"D","text":"把所有命令转发给企业管理员审批后执行","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"客户怕 AI 执行命令搞坏系统→Bash 命令沙箱把 AI 操作与真实系统严格隔离，防破坏。不是加时间戳追责、也不是禁止执行或每条审批。","concepts":["sandbox"]},{"id":"s38","type":"single","no":38,"text":"客户反馈 WorkBuddy 升级或隔天重启后，找不到原来的工作空间文件夹和历史记录了。正确的答复是？","options":[{"key":"A","text":"打开文件管理器（Windows）或 Finder（Mac），进入 WorkBuddy 大文件夹（Windows：C:/Users/用户名/WorkBuddy，Mac：/Users/用户名/WorkBuddy），通过 WorkBuddy 打开以日期或用户自定义名字命名的文件夹即可找回原有历史记录","note":"选这个"},{"key":"B","text":"打开安装目录（Windows：C:\\Users\\用户名\\AppData\\Local\\Programs\\WorkBuddy，MacOS：/Applications/WorkBuddy.app），在 tools 文件夹中查找历史记录","note":""},{"key":"C","text":"进入 %APPDATA%\\CodeBuddyExtension\\Data\\Public\\auth 目录，将 auth 文件拷贝回新工作空间即可恢复","note":""},{"key":"D","text":"原文件夹已被系统清理无法找回，只能新建工作空间重新执行任务","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"升级/重启找不到工作空间历史→去 WorkBuddy 主文件夹（Win C:/Users/用户名/WorkBuddy，Mac 同路径）按日期/自定义名打开。安装目录、auth 目录都找错地方。","concepts":["workspace"]},{"id":"s39","type":"single","no":39,"text":"客户在任务列表中看到某个任务的状态显示为\"规划中\"，这表示什么？","options":[{"key":"A","text":"WorkBuddy 正在执行任务","note":""},{"key":"B","text":"WorkBuddy 正在分析需求并整理执行思路","note":"选这个"},{"key":"C","text":"任务等待进一步处理或输入","note":""},{"key":"D","text":"执行过程中出现问题，任务未能完成","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"任务状态“规划中”=WorkBuddy 正在分析需求、整理执行思路，不是正在执行、也不是卡住。","concepts":[]},{"id":"s40","type":"single","no":40,"text":"竞品对标课程将 WorkBuddy 的差异化优势拆解为若干「核心区隔位」。下列哪一项属于官方拆解的核心区隔位？","options":[{"key":"A","text":"价格全行业最低","note":""},{"key":"B","text":"企业安全管控","note":"选这个"},{"key":"C","text":"硬件终端赠送","note":""},{"key":"D","text":"无限量免费使用","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方核心区隔位之一是“企业安全管控”。价格最低/送硬件/无限免费都不是官方拆解的区隔位。","concepts":["security_3layer"]},{"id":"s41","type":"single","no":41,"text":"客户询问 WorkBuddy 的技能是否只能用官方内置的几种，能否把公司自己的作业流程沉淀进去。正确的介绍是？","options":[{"key":"A","text":"只能使用官方内置技能，不支持任何扩展","note":""},{"key":"B","text":"WorkBuddy 内置多技能包，覆盖文档处理、数据报表、海报设计、文件整理等场景，同时兼容 OpenClaw 社区技能导入，也支持通过自然语言创建自定义技能","note":"选这个"},{"key":"C","text":"需要通过修改客户端配置文件才能新增技能","note":""},{"key":"D","text":"技能安装后无法关闭，只能卸载","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"技能不只能用官方几个：内置多包+兼容 OpenClaw 社区导入+自然语言创建自定义技能。不用改配置、装了也能关。","concepts":["plugin_skill"]},{"id":"s42","type":"single","no":42,"text":"客户研发团队 150 人，要求部署在腾讯云专享 VPC，并需要使用专属企业插件，计划按年订阅。应推荐哪个版本、对应什么价格？","options":[{"key":"A","text":"企业旗舰版，2,376 元/人/年","note":""},{"key":"B","text":"企业专享版，3,792 元/人/年","note":"⭐ 改选这个（专享VPC+专属插件=专享版特征；316元/月×12）"},{"key":"C","text":"企业专享版，2,376 元/人/年","note":""},{"key":"D","text":"私有化企业版，3,792 元/人/年","note":"⚠️ 至少不是这个（私有化价格要咨询，不给标准价）"}],"answer":["B"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"150人专享VPC+专属插件=企业专享版，316元/月×12=3,792元/人/年","plain":"150 人、要专享 VPC、专属插件、按年→企业专享版，316 元/月×12=3,792 元/人/年。私有化无标准价（D 错），旗舰版是 2,376。","concepts":["version_matrix","private_deploy"]},{"id":"s43","type":"single","no":43,"text":"客户数据安全负责人问：「我们的数据传到服务端后会不会留存、拿去训练模型？」关于服务端数据处理原则，正确的回答是？","options":[{"key":"A","text":"数据在服务端保存 180 天供审计，到期自动删除","note":""},{"key":"B","text":"服务端仅处理数据片段，用后即弃，不保存，也不用于模型训练","note":"选这个"},{"key":"C","text":"会匿名化后用于模型训练，签协议可豁免","note":""},{"key":"D","text":"数据永久保留在专属 VPC 内供随时调取","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"数据传到服务端→仅处理片段、用后即弃、不保存、不训练。不是存 180 天审计、也不是匿名化训练。","concepts":["compliance","security_3layer"]},{"id":"s44","type":"single","no":44,"text":"客户问：\"我们现在用钉钉悟空（悟空+钉钉），凭什么换WorkBuddy？\"按照官方39项实测的分竞品打击话术，针对悟空+钉钉的正确表述是？","options":[{"key":"A","text":"「企业管控和团队协作几乎是空白」","note":"⚠️ 至少不是这个（钉钉恰恰强在协作）"},{"key":"B","text":"「研发味太重，职能岗用不起来」（更像打代码类竞品）","note":""},{"key":"C","text":"「只活在钉钉里，技能生态单薄」","note":"⭐ 改选这个"},{"key":"D","text":"「模型多不等于能落地」（更像打模型聚合类竞品）","note":""}],"answer":["C"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"凭什么换掉悟空+钉钉：「只活在钉钉里，技能生态单薄」（A 错：钉钉恰恰强在协作）","plain":"打悟空+钉钉：痛点是“只活在钉钉里，技能生态单薄”。别打“协作差”——钉钉恰恰强协作（A 错）。","concepts":["competitor"]},{"id":"s45","type":"single","no":45,"text":"客户在采购交流中说：\"我们团队二十来人，用 AI 的程度肯定不一样——做设计的同事用得多，做行政的可能一个月都点不了几次，每人 2,000 积分，用不完的不是浪费了吗？\"下列讲师的回应最符合官方计费规则、又最有利于促成订单的是？","options":[{"key":"A","text":"建议只给用量大的员工开通坐席，用得少的同事先不开通，避免积分浪费","note":""},{"key":"B","text":"告诉客户积分消耗量由模型类型、Token 用量及任务复杂度共同决定，让行政同事少用高级模型就能省下积分","note":""},{"key":"C","text":"告诉客户企业版的积分是团队内共享的：每个坐席每月 2,000 Credits 汇入共享池，轻度使用的成员用不完的积分，可以被重度使用的同事用起来，且对话问答不限频——席位越多共享池越大，同样的钱利用率更高","note":"选这个"},{"key":"D","text":"建议客户先给每人买个人版，个人版积分记在各自名下互不影响，等团队扩大后再考虑企业版","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"20 来人用量不均→企业版积分团队内共享：每席 2,000 Credits 汇入共享池，轻度用不完的被重度用的薅走，席位越多池越大。不是只给重度用的开席。","concepts":["credits"]},{"id":"s46","type":"single","no":46,"text":"关于 WorkBuddy 的数据传输安全保障，正确的说法是？","options":[{"key":"A","text":"所有数据传输采用 HTTPS 全链路加密，支持 TLS 1.2/1.3 加密协议，防窃听、篡改和中间人攻击","note":"选这个"},{"key":"B","text":"数据只在企业内网传输，不经公网","note":""},{"key":"C","text":"采用自研二进制协议，不兼容 TLS","note":""},{"key":"D","text":"仅登录环节加密，任务数据明文传输","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"传输安全：HTTPS 全链路加密，TLS 1.2/1.3，防窃听/篡改/中间人。不是只内网传、也不是只登录时加密。","concepts":["https_tls"]},{"id":"s47","type":"single","no":47,"text":"客户关注每位员工的文件存储空间，询问旗舰版内置腾讯网盘的容量。正确的是？","options":[{"key":"A","text":"企业文件存储与共享，每席 50G","note":"选这个"},{"key":"B","text":"企业文件存储与共享，每席 500G","note":""},{"key":"C","text":"Ardot 草稿文件无限量","note":""},{"key":"D","text":"无存储容量限制","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"旗舰版内置腾讯网盘：每席 50G 企业文件存储与共享。不是 500G、也不是无限。","concepts":["version_matrix"]},{"id":"s48","type":"single","no":48,"text":"客户问：\"我们团队用得比较狠，每个月赠送的积分如果不够用了怎么办？是不是只能升级更贵的版本？\"下列讲师的回应正确的是？","options":[{"key":"A","text":"告诉客户积分不够只能整体升级为企业专享版，316 元/人/月，100 个坐席起购","note":""},{"key":"B","text":"告诉客户企业旗舰版、企业专享版可以根据需求购买加量包补充用量（如 245 元购 5,000 Credits，有效期 6 个月），不需要升级版本；且系统会优先使用最先到期的积分","note":"选这个"},{"key":"C","text":"告诉客户加量包长期有效，买回来可以慢慢用，不用担心过期","note":""},{"key":"D","text":"告诉客户 2026 年 3 月 11 日前购买的加量包有效期同样是 6 个月，早买更划算","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"积分不够→买加量包补（如 245 元/5,000 Credits，6 个月有效），不用升版本；系统优先消耗最先到期的。“加量包长期有效”是错（C 错）。","concepts":["credits"]},{"id":"s49","type":"single","no":49,"text":"新销售小李打算跟客户说：\"企业版功能更强大、AI更聪明，所以更贵。\"按照红线清单，这一说法错在哪？","options":[{"key":"A","text":"没错，这是官网标准口径","note":""},{"key":"B","text":"错在价格说反了，企业版其实更便宜","note":""},{"key":"C","text":"错在可以这么说，但必须加一句\"个人版也够用\"","note":""},{"key":"D","text":"官网口径里全模型可选、无限代码补全、跨文件理解、自动任务这些核心AI能力个人版旗舰版全都有，客户去官网一比就穿帮；正确说法是企业版多的是治理能力，不是\"更聪明的模型\"","note":"选这个"}],"answer":["D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"红线：不能说“企业版 AI 更聪明所以更贵”——核心 AI 能力个人旗舰版全有，客户一比就穿帮。企业版卖的是治理能力，不是更聪明模型。","concepts":["redline","version_matrix"]},{"id":"s50","type":"single","no":50,"text":"临门一脚时客户说\"我再想想\"。按照场景F，销售的收尾方式应该是什么？","options":[{"key":"A","text":"问\"您觉得我们产品怎么样？\"引导客户表态","note":""},{"key":"B","text":"发一份报价单，然后等客户主动联系","note":""},{"key":"C","text":"永远不要在\"买不买\"上收尾——问两个问题：\"先给谁开通？什么时候给他们开通？\"这两个问题一旦被回答，单子就已经在流程里了","note":"选这个"},{"key":"D","text":"直接问\"您是微信支付还是对公转账？\"","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"客户说“再想想”→场景F：永远不在“买不买”上收尾，改问“先给谁开通、什么时候开通”——这两个问题一被回答，单子已在流程里。","concepts":["triage"]},{"id":"s51","type":"single","no":51,"text":"一位 Mac 用户反馈单击 WorkBuddy 后无反应，无法拉起登录验证窗口。应指导其如何处理？","options":[{"key":"A","text":"删除应用后重新下载安装包","note":""},{"key":"B","text":"单击系统偏好设置 > 通用，将默认浏览器设为 Chrome 或 Safari，重启应用后重新登录","note":"选这个"},{"key":"C","text":"切换到完全访问权限模式后重新登录","note":""},{"key":"D","text":"在自动化页面新建任务即可触发登录","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"Mac 单击无反应拉不起登录窗→系统偏好设置设默认浏览器为 Chrome/Safari，重启重登。删应用/切完全访问都不是首选。","concepts":[]},{"id":"s52","type":"single","no":52,"text":"客户向 WorkBuddy 下发整理桌面指令后，桌面完成整理但部分文件疑似丢失。应建议客户优先检查哪里？","options":[{"key":"A","text":"目标整理目录与回收站","note":"选这个"},{"key":"B","text":"安装目录下的 tools 文件夹","note":""},{"key":"C","text":"帮助 > 打开日志文件夹中的日志 zip 包","note":""},{"key":"D","text":"%APPDATA%\\CodeBuddyExtension\\Data\\Public\\auth 目录","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"整理桌面后文件疑似丢失→先查目标整理目录与回收站。安装目录 tools、日志 zip、auth 目录都查错地方。","concepts":["workspace"]},{"id":"s53","type":"single","no":53,"text":"Mac 客户登录 WorkBuddy 一直失败，怀疑是账号文件夹权限问题。下列排查与授权操作中，符合官方建议的是？","options":[{"key":"A","text":"在终端执行 ls -la ~/Library/Application\\ Support/CodeBuddyExtension/ 等命令确认目录 owner，若不是当前用户（可用 whoami 确认），则执行 sudo chown -R $(whoami) ~/Library/Application\\ Support/CodeBuddyExtension 授权，退出并重新打开完成登录","note":"选这个"},{"key":"B","text":"在终端执行 takeown /F \"$env:APPDATA\\CodeBuddyExtension\" /R /D Y，再用 icacls 为当前用户授予完全控制权限（这是 Windows 命令）","note":""},{"key":"C","text":"在 IDE 设置中搜索 gallery，将地址配置为 https://marketplace.visualstudio.com 后重启","note":""},{"key":"D","text":"将 Editor › General › Console 路径下的 Default Encoding 设置为 GBK 后重新登录","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"Mac 登录失败疑权限→终端 ls -la 查 CodeBuddyExtension 目录 owner，不对就 sudo chown -R 改回当前用户，重开登录。B 是 Windows 命令、C/D 无关。","concepts":[]},{"id":"s54","type":"single","no":54,"text":"某客户是一家 15 人的初创研发团队，希望先小范围试用、按人数订阅、控制初期投入，且希望 1 人即可起购。作为讲师，应优先推荐哪个版本？","options":[{"key":"A","text":"企业旗舰版","note":"选这个（1 人起购、按人数订阅）"},{"key":"B","text":"企业专享版","note":""},{"key":"C","text":"私有化企业版","note":""},{"key":"D","text":"三个版本均需 100 人起购，该客户无法采购","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"15 人初创、想小范围试、按人数订阅、1 人起购→企业旗舰版（1 人起购、按人数）。专享/私有化都不止 1 人起，D 说“都 100 人起”是错。","concepts":["version_matrix"]},{"id":"s55","type":"single","no":55,"text":"某金融行业客户提出数据不出企业、系统需完全落在企业自有环境中，由企业自主运维。应推荐哪个版本？","options":[{"key":"A","text":"企业旗舰版，部署方式为腾讯云共享 VPC","note":""},{"key":"B","text":"企业专享版，部署方式为腾讯云专享 VPC","note":""},{"key":"C","text":"私有化企业版，部署方式为企业私有化","note":"选这个"},{"key":"D","text":"企业旗舰版，部署方式为企业私有化","note":""}],"answer":["C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"金融/政企“数据不出企业、自主运维”→私有化企业版（企业私有化部署）。旗舰/专享都是云上 VPC，不是完全自有环境。","concepts":["private_deploy","version_matrix"]},{"id":"s56","type":"single","no":56,"text":"客户已将腾讯文档连接到 WorkBuddy，记得里面存过一份\"渠道返利政策\"相关文档，但想不起确切文件名。讲师应告知其最快的查找方式是？","options":[{"key":"A","text":"只能在资料库右上方的搜索框输入完整文件名关键词查找","note":""},{"key":"B","text":"新建任务，用自然语言描述需要的文档即可找到","note":"选这个"},{"key":"C","text":"必须先手动把文档整理到同一文件夹，再用全部文件视图逐个查看","note":""},{"key":"D","text":"使用\"添加到任务\"把所有文档逐个加入任务，让 WorkBuddy 逐一确认","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"连了腾讯文档但想不起文件名→新建任务用自然语言描述就能找到，不用输完整文件名、也不用先手动归类。","concepts":["connector_vs_kb"]},{"id":"m1","type":"multiple","no":1,"text":"WorkBuddy 安全体系「合规审计层」包含以下哪些措施？","options":[{"key":"A","text":"Skill 安全审计（与安全团队联动，分级风险判别）","note":"保留"},{"key":"B","text":"skill-scanner 本地安全检查","note":"保留"},{"key":"C","text":"数据本地执行不上传","note":"⭐ 补上这个"},{"key":"D","text":"将用户数据用于模型训练以持续优化效果","note":"明显错误项，永远不选"}],"answer":["A","B","C"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"合规审计层：补上「数据本地执行不上传」；「数据用于训练」永远不选","plain":"合规审计层：Skill 安全审计、skill-scanner 本地检查、数据本地执行不上传。“数据用于训练”是明显错误项，永远不选。","concepts":["security_3layer","compliance"]},{"id":"m2","type":"multiple","no":2,"text":"客户希望 WorkBuddy 更懂自家业务、能力可持续扩展。关于 WorkBuddy 的扩展机制，下列说法正确的有？","options":[{"key":"A","text":"通过专家复用专业知识与工作方法，完成分析、创作和专业处理任务","note":"保留"},{"key":"B","text":"通过连接器使用企业内部沉淀的知识为任务提供支撑","note":"⚠️ 连接器≠内部知识"},{"key":"C","text":"通过连接器访问外部服务，为任务提供数据和知识支持","note":"⭐ 补上这个"},{"key":"D","text":"通过资料库使用内部知识，为任务提供数据和知识支持","note":"保留"}],"answer":["A","C","D"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"扩展机制：连接器=外部服务、资料库=内部知识；B 张冠李戴","plain":"扩展三件套：专家=复用专业方法；连接器=连外部服务取数据；资料库=用内部知识。B 把“连接器用内部知识”张冠李戴了。","concepts":["connector_vs_kb"]},{"id":"m3","type":"multiple","no":3,"text":"右侧边栏是 WorkBuddy 的产物查看与文件管理面板，它包含以下哪些标签？","options":[{"key":"A","text":"产物 ✓","note":""},{"key":"B","text":"工作空间文件 ✓","note":""},{"key":"C","text":"变更 ✓","note":""},{"key":"D","text":"专家 ✗（不选）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"右侧边栏（产物查看与文件管理）标签：产物、工作空间文件、变更。专家不在侧边栏标签里。","concepts":["workspace"]},{"id":"m4","type":"multiple","no":4,"text":"客户采购企业旗舰版后，其企业管理能力包含以下哪些项？","options":[{"key":"A","text":"授权管理 ✓","note":""},{"key":"B","text":"单点登录 ✓","note":""},{"key":"C","text":"研效看板 ✓","note":""},{"key":"D","text":"专属企业插件 ✗（不选——版本权益，非治理能力，对应判断题「旗舰版含专属插件=错」）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业旗舰版管理能力：授权管理、单点登录(SSO)、研效看板。专属企业插件是“版本权益”不是“治理能力”（判断题也考这条）。","concepts":["version_matrix","security_3layer"]},{"id":"m5","type":"multiple","no":5,"text":"WorkBuddy 安全体系「技术防御层」包含以下哪些机制？","options":[{"key":"A","text":"Bash 命令沙箱 ✓","note":""},{"key":"B","text":"文件系统隔离 ✓","note":""},{"key":"C","text":"每月强制更换用户密码 ✗（不选）","note":""},{"key":"D","text":"防沙箱逃逸 ✓","note":""}],"answer":["A","B","D"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"技术防御层：Bash 命令沙箱、文件系统隔离、防沙箱逃逸。“每月强制换密码”不是技术防御层机制。","concepts":["security_3layer","sandbox"]},{"id":"m6","type":"multiple","no":6,"text":"关于默认权限与完全访问权限，下列说法正确的有？","options":[{"key":"A","text":"在新建任务输入框下方，单击默认权限下拉菜单，可以开启或关闭允许完全访问权限 ✓","note":""},{"key":"B","text":"默认权限下，写入或修改工作空间外的文件、删除文件或目录、执行脚本命令或外部程序时，会先弹出二次确认 ✓","note":""},{"key":"C","text":"在隔离目录里反复运行可信脚本时，可以短时间开启完全放开 ✓","note":""},{"key":"D","text":"完全访问权限会自动判断所有风险，比默认权限更安全，适合日常长期使用 ✗（反话陷阱）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"默认权限下敏感操作弹二次确认；可在输入框下拉开关完全访问；隔离目录可短时放开。但“完全访问自动判断风险、日常更安全”是反话陷阱。","concepts":["permission"]},{"id":"m7","type":"multiple","no":7,"text":"按照打单课程挖需求阶段的\"前期三板斧\"（Gap Selling），销售开场应挖出的内容包括哪些？","options":[{"key":"A","text":"最耗时最痛的重复场景（现状）——无具体场景等于伪需求 ✓","note":""},{"key":"B","text":"谁拍板、谁参与（权力）——错认决策人就永远卡在\"帮您问问\" ✓","note":""},{"key":"C","text":"为什么是现在+预算信号（紧迫感）——预算异议90%不是\"没钱\"是\"值不值\" ✓","note":""},{"key":"D","text":"客户公司的实缴资本与招投标情况 ✗（不选）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"挖需求三板斧：最痛重复场景(现状)、谁拍板(权力)、为什么现在+预算信号(紧迫感)。客户实缴资本/招投标不是要挖的。","concepts":["triage"]},{"id":"m8","type":"multiple","no":8,"text":"客户在安全评审中提出四项顾虑：①数据被用于模型训练；②员工私自安装带风险的 Skill；③外部网络随意登录；④传输过程被窃听。下列「顾虑 → WorkBuddy 对应能力」的匹配，正确的有？","options":[{"key":"A","text":"① → 服务端仅处理数据片段，用后即弃，不保存，不用于模型训练 ✓","note":""},{"key":"B","text":"② → skill-scanner 安装前本地安全检查，企业可建立获准 Skills 清单 ✓","note":""},{"key":"C","text":"③ → IP 白名单，限制特定 IP 段设备登录 ✓","note":""},{"key":"D","text":"④ → HTTPS 全链路加密，支持 TLS 1.2/1.3 ✓","note":""}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"安全四顾虑对应：①不训练→服务端用后即弃；②带风险 Skill→skill-scanner+获准清单；③外部随意登录→IP 白名单；④传输窃听→HTTPS/TLS。","concepts":["security_3layer","compliance","https_tls"]},{"id":"m9","type":"multiple","no":9,"text":"客户在默认权限下工作时弹出二次确认弹窗，担心看不懂弹窗、误放行高风险操作。讲师应提醒客户重点核对哪些内容？","options":[{"key":"A","text":"操作内容：是写文件、删文件，还是执行脚本","note":"保留"},{"key":"B","text":"影响范围：目标路径是否在本次任务的工作空间内，是否会影响桌面、下载目录、项目源码或其它重要目录","note":"保留"},{"key":"C","text":"弹窗频率：确认次数越少说明任务越安全","note":"反话陷阱，不选"},{"key":"D","text":"执行理由：这一步是否确实是完成任务所必需的","note":"⭐ 补上这个"}],"answer":["A","B","D"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"二次确认弹窗核对：补「执行理由」；「确认次数越少越安全」是反话","plain":"弹二次确认别慌：核对操作内容(写/删/执行)、影响范围(是否在工作空间内)、执行理由(是否任务必需)。“确认次数越少越安全”是反话陷阱。","concepts":["permission"]},{"id":"m10","type":"multiple","no":10,"text":"客户希望给 WorkBuddy 添加新技能，讲师可以演示哪些添加技能的方式？","options":[{"key":"A","text":"技能只能使用官方内置的，无法自行添加 ✗（不选）","note":""},{"key":"B","text":"上传技能：导入本地技能包，导入后系统自动完成配置，无需额外操作 ✓","note":""},{"key":"C","text":"查找技能：输入任务描述，WorkBuddy 自动查找相关技能 ✓","note":""},{"key":"D","text":"创建技能：输入任务描述，WorkBuddy 自动创建相关技能 ✓","note":""}],"answer":["B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"加技能三种：上传本地包、查找(描述自动找)、创建(描述自动建)。“只能官方内置”是错项。","concepts":["plugin_skill"]},{"id":"m11","type":"multiple","no":11,"text":"旗舰版内置的腾讯文档，其可升级权益包含以下哪些内容？","options":[{"key":"A","text":"安全管控增强（支持水印、文档审计、回收站时长 7 → 180 天）","note":"保留"},{"key":"B","text":"表格 2000 行 → 4 万行，表格自动化次数 100 → 5 万次/人","note":"保留"},{"key":"C","text":"企业个性化与系统集成","note":"⭐ 补上这个"},{"key":"D","text":"知识治理（有效期、知识反馈、评审、巡检、事实核验、重复检测）","note":"⚠️ 这是乐享知识库的功能，不属于腾讯文档"}],"answer":["A","B","C"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"腾讯文档可升级权益：补「企业个性化与系统集成」；D 知识治理属于乐享知识库","plain":"腾讯文档可升级权益：安全管控增强、表格 4 万行/5 万次、企业个性化与系统集成。D“知识治理”是乐享知识库功能，不属于腾讯文档。","concepts":["version_matrix","connector_vs_kb"]},{"id":"m12","type":"multiple","no":12,"text":"讲师给客户做上手培训时，以下哪些做法符合官方推荐的上手技巧？","options":[{"key":"A","text":"用\"做什么 + 有什么 + 怎么样\"把任务目标说清楚，别让 AI 猜意图 ✓","note":""},{"key":"B","text":"把大任务拆成独立的小目标，一次只推进一步 ✓","note":""},{"key":"C","text":"让 WorkBuddy 修改重要文档、方案、表格前，先复制一份备份 ✓","note":""},{"key":"D","text":"把所有工作都塞进同一个会话，避免开新任务造成上下文丢失 ✗","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方上手技巧：用“做什么+有什么+怎么样”说清目标、大任务拆小步、改重要文件前先备份。“所有工作塞同一会话”是错做法。","concepts":["automation"]},{"id":"m13","type":"multiple","no":13,"text":"插件登录时网络通信异常，显示设备连不上代码助手域名。下列排查手段中符合官方建议的是？","options":[{"key":"A","text":"重启 IDE 重新登录，并检查网络连接是否正常 ✓","note":""},{"key":"B","text":"SaaS 环境可打开腾讯云-华佗诊断，输入域名 copilot.tencent.com 后进行检测 ✓","note":""},{"key":"C","text":"检查是否有系统代理干扰、防火墙连接是否正常，以及 host 配置是否存在异常干扰 ✓","note":""},{"key":"D","text":"卸载插件并更换为其他 IDE，重新购买企业版套餐后使用 ✗","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"插件登录连不上域名：重启 IDE 查网络、SaaS 用华佗诊断 copilot.tencent.com、排查代理/防火墙/host。“卸载换 IDE 重买企业版”是错项。","concepts":[]},{"id":"m14","type":"multiple","no":14,"text":"客户问：\"你们企业版号称治理能力强，具体能管什么？\"按照企业版7大治理能力清单，下列哪些属于其中？","options":[{"key":"A","text":"SSO（单点登录） ✓","note":""},{"key":"B","text":"审计日志 ✓","note":""},{"key":"C","text":"IP白名单 ✓","note":""},{"key":"D","text":"专属企业插件 ✗（选项自己都注明了：版本权益，非治理能力）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业版治理能力：SSO、审计日志、IP 白名单等。专属企业插件是版本权益不是治理能力。","concepts":["version_matrix","security_3layer"]},{"id":"m15","type":"multiple","no":15,"text":"客户计划为研发、办公、IT 部门统一采购 AI 能力。关于 WorkBuddy Enterprise 三款产品的组合价值，下列说法正确的有？","options":[{"key":"A","text":"三款产品既可独立使用，也可在企业内统一管理与协同 ✓","note":""},{"key":"B","text":"三款产品覆盖从编码、办公到智能体运营的一体化闭环 ✓","note":""},{"key":"C","text":"Managed Agents 的云端 Agent 可下发至员工 WorkBuddy 端直接使用 ✓","note":""},{"key":"D","text":"三款产品必须整体捆绑采购，无法按需单独购买 ✗","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"三款产品(WorkBuddy/CodeBuddy/Managed Agents)可独立也可企业内统一管理协同，覆盖编码-办公-智能体闭环。“必须捆绑采购”是错项。","concepts":["version_matrix","managed_agents"]},{"id":"m16","type":"multiple","no":16,"text":"WorkBuddy Managed Agents 的全流程 Agent 生命周期治理包含以下哪些内容？","options":[{"key":"A","text":"统一身份 ✓","note":""},{"key":"B","text":"独立运行环境 ✓","note":""},{"key":"C","text":"全链路 Trace ✓","note":""},{"key":"D","text":"效果评测与持续优化 ✓","note":""}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"Managed Agents 全生命周期治理：统一身份、独立运行环境、全链路 Trace、效果评测与持续优化。四项全选。","concepts":["managed_agents"]},{"id":"m17","type":"multiple","no":17,"text":"客户已连接腾讯文档，讲师在演示时可以展示哪些能力？","options":[{"key":"A","text":"在资料库中通过关键词搜索文件，资料库支持按文档标题和按文档所有者两种检索方式 ✓","note":""},{"key":"B","text":"在资料库中选中对应文件后单击\"添加到任务\"，让 WorkBuddy 处理该文件 ✓","note":""},{"key":"C","text":"把本地 Word、Excel、PPT、PDF 等文件在资料库中勾选并添加到任务 ✓","note":""},{"key":"D","text":"在左侧边栏单击自动化图标进入并授权腾讯文档 ✗（授权不在自动化入口）","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"连腾讯文档演示：资料库按标题/所有者检索、选中添加到任务、本地 Word/Excel/PPT/PDF 勾选加任务。“左侧自动化图标授权”是错(授权不在自动化入口)。","concepts":["connector_vs_kb"]},{"id":"m18","type":"multiple","no":18,"text":"企业旗舰版 10 坐席扩容到 20 坐席促单，下列说法符合官方计费规则、又有利于促成扩容的有？","options":[{"key":"A","text":"扩到 20 坐席后，企业每月的月固定用量将增加到 20 × 2,000 合计 40,000 Credits，全部汇入团队内共享使用的积分池","note":"保留"},{"key":"B","text":"扩容后每个坐席仍是 2,000 Credits/月、每月刷新、团队内共享、对话问答不限频——轻度使用的同事用不完的积分，可以被重度使用的同事用起来","note":"保留"},{"key":"C","text":"2026 年 5 月 15 日至 8 月 14 日期间办理扩容，同样可以享受首月每个坐席额外赠送 2,000 Credits 的权益","note":"⭐可疑（活动期可能已过，临场看题面）"},{"key":"D","text":"扩容后即使企业版到期，已购加量包的剩余用量仍可继续独立使用，团队不会断粮","note":"⚠️ 与加量包 6 个月有效期规则矛盾，大概率错"}],"answer":["A","B"],"flags":{"confirmed":false,"recommended":true,"hot":false},"anchor":"扩容促单：D「到期后加量包继续独立用」与 6 个月有效期矛盾；C 活动期已过","plain":"扩到 20 坐席→月固定 40,000 Credits 汇入共享池、每席仍 2,000/月团队共享。C 活动期(5.15-8.14)可能已过；D“到期后加量包继续独立用”与 6 个月有效期矛盾，大概率错。","concepts":["credits"]},{"id":"b1","type":"bool","no":1,"text":"按照官方39项实测，WorkBuddy 30项领先六家竞品，整体身位领先2-3个月。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方 39 项实测：WorkBuddy 30 项领先六家竞品，整体身位领先 2-3 个月。对。","concepts":["competitor"]},{"id":"b2","type":"bool","no":2,"text":"企业旗舰版、企业专享版、私有化企业版的部署方式不同，分别为腾讯云共享 VPC、腾讯云专享 VPC、企业私有化。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"旗舰版=共享 VPC，专享版=专享 VPC，私有化=企业私有化。三种部署方式不同。对。","concepts":["version_matrix","private_deploy"]},{"id":"b3","type":"bool","no":3,"text":"专家本身不主动获取系统权限，仅处理用户主动提供的对话与上传文件；当配备 Skill / MCP 时才会在用户授权下间接访问文件或外部服务。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"专家本身不主动获取系统权限，只处理你主动提供的对话/文件；配了 Skill/MCP 才在授权下间接访问。对。","concepts":["mcp","permission"]},{"id":"b4","type":"bool","no":4,"text":"「WorkBuddy 的分层权限系统仅支持 allow（允许）和 deny（拒绝）两种规则，不提供中间确认机制」——错，有二次确认机制。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"分层权限系统不只是 allow/deny，还有二次确认中间机制。题干说“不提供中间确认”→错。","concepts":["permission"]},{"id":"b5","type":"bool","no":5,"text":"WorkBuddy 构建了完善的企业级安全体系，采用三层纵深防御安全架构：技术防御层、管理管控层、合规审计层。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业级安全=三层纵深防御：技术防御层、管理管控层、合规审计层。对。","concepts":["security_3layer"]},{"id":"b6","type":"bool","no":6,"text":"「CodeBuddy 只支持 Python、Java 等少数编程语言，其他技术栈无法使用」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"CodeBuddy 支持多语言，不只 Python/Java 少数几种。题干说“只支持少数”→错。","concepts":["version_matrix"]},{"id":"b7","type":"bool","no":7,"text":"「建议一次性启用所有可用技能，启用的技能越多，WorkBuddy 的能力就越强」——不符合官方推荐做法。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"不是启用越多越强——一次性全开技能不符合官方推荐（易乱、易冲突）。题干说“启越多越强”→错。","concepts":["plugin_skill"]},{"id":"b8","type":"bool","no":8,"text":"WorkBuddy Managed Agents 提供云端托管的智能体运行服务，Agent 在云端沙箱运行，可 7×24 小时不间断服务，特别适合长程任务、在线客服、自动触发任务等场景。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"Managed Agents 云端托管、沙箱运行、7×24 不间断，适合长程/在线客服/自动触发。对。","concepts":["managed_agents","sandbox"]},{"id":"b9","type":"bool","no":9,"text":"「企业旗舰版的企业管理能力已包含专属网络访问与专属企业插件」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"企业旗舰版管理能力不含专属网络访问与专属企业插件（那是专享版/版本权益）。题干说“已包含”→错。","concepts":["version_matrix"]},{"id":"b10","type":"bool","no":10,"text":"客户反馈 WorkBuddy 出现 14003、11133、1001 报错时，应告知客户这些错误码多与模型侧状态有关，建议优先切换模型重试，但该方法可能仅能临时缓解。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"这些报错多和模型侧状态有关，优先切模型重试，但可能只临时缓解。对。","concepts":[]},{"id":"b11","type":"bool","no":11,"text":"面对金融、政企等对数据隔离要求极高的客户，销售可推荐专有云VPC版（¥316/人/月），其核心差异化价值是物理隔离。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"金融/政企高隔离→专有云 VPC 版 ¥316/人/月，核心差异化是物理隔离。对。","concepts":["version_matrix","private_deploy"]},{"id":"b12","type":"bool","no":12,"text":"「新建自动化任务无需试运行，直接以高频率正式执行即可，出错再改也来得及」——不符合官方推荐（应先试运行）。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"自动化任务应先试运行，再正式高频率执行。题干说“无需试运行直接高频”→错。","concepts":["automation"]},{"id":"b13","type":"bool","no":13,"text":"助理支持通过微信、企业微信、QQ、钉钉、飞书等即时通讯平台，远程控制电脑上的 WorkBuddy 执行任务。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"助理可通过微信、企业微信、QQ、钉钉、飞书等 IM 远程控制电脑上的 WorkBuddy。对。","concepts":["agent_assistant"]},{"id":"b14","type":"bool","no":14,"text":"专家团会并行调用多位专家、涉及多轮模型交互，积分消耗通常为单专家的 3–5 倍。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"专家团并行调多位专家、多轮模型交互，积分消耗通常单专家的 3-5 倍。对。","concepts":["credits"]},{"id":"b15","type":"bool","no":15,"text":"「助理和连接器是一回事，都是企业自建的agent」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"助理是远程控制入口（IM 指挥本地 WorkBuddy），连接器是外部服务对接，不是“都是企业自建 agent”。题干说“是一回事”→错。","concepts":["agent_assistant","connector_vs_kb"]},{"id":"b16","type":"bool","no":16,"text":"「CodeBuddy 可提供实时的团队开发提效效果数据和全面的研发投入数据依据，帮助管理者进行人效管理」——正确。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"CodeBuddy 可提供实时团队开发提效数据、研发投入数据依据，助管理者人效管理。对。","concepts":["version_matrix"]},{"id":"b17","type":"bool","no":17,"text":"「企业版包含个人版全部能力，这是官网明写的」——不符合官方口径。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方口径：企业版不含个人版全部能力（核心 AI 能力个人旗舰版也有，但权益结构不同）。题干说“明写包含”→错。","concepts":["version_matrix"]},{"id":"b18","type":"bool","no":18,"text":"「我下班关机后，通过助理下发的远程任务还能继续在云端执行吗？」——不能。使用助理时，为保证任务顺利执行，电脑需要保持开机并运行 WorkBuddy。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"用助理下发的远程任务，电脑需保持开机并运行 WorkBuddy；关机后云端也接不住。题干说“关机还能在云端执行”→错（那是 Managed Agents，不是助理）。","concepts":["agent_assistant","managed_agents"]},{"id":"b19","type":"bool","no":19,"text":"「私有化企业版与企业专享版一样，均为赠送 2000 Credits/人、每月刷新的用量限制规则」——错误。","options":[{"key":"对","text":""},{"key":"错","text":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"私有化企业版与企业专享版用量规则不同，私有化不是“赠送 2,000 Credits/人每月刷新”。题干说“一样”→错。","concepts":["private_deploy","credits"]},{"id":"p1","type":"single","no":94,"text":"客户问「WorkBuddy 个人版一共有哪几档、月付多少钱？」，正确的报价是？","options":[{"key":"A","text":"体验版 ¥0、标准版 ¥99、高级版 ¥199、旗舰版 ¥999","note":"选这个"},{"key":"B","text":"体验版 ¥0、标准版 ¥99、高级版 ¥199、旗舰版 ¥1,999","note":""},{"key":"C","text":"体验版 ¥99、标准版 ¥199、高级版 ¥999、旗舰版 ¥1,999","note":""},{"key":"D","text":"只有标准版 ¥99 与旗舰版 ¥999 两档，没有体验版与高级版","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"个人版月付：¥0 / ¥99 / ¥199 / ¥999","plain":"四档记住四个数就行：0、99、199、999。旗舰版最容易报错成 ¥999 之外或漏掉体验版。","concepts":["personal_tiers","version_matrix"]},{"id":"p2","type":"single","no":95,"text":"客户想按「连续包月（7 折）」付个人版费用，各档折后价是多少？","options":[{"key":"A","text":"标准版 ¥70、高级版 ¥140、旗舰版 ¥700","note":"选这个"},{"key":"B","text":"标准版 ¥99、高级版 ¥199、旗舰版 ¥999","note":""},{"key":"C","text":"标准版 ¥70、高级版 ¥199、旗舰版 ¥700","note":""},{"key":"D","text":"标准版 ¥64、高级版 ¥130、旗舰版 ¥640","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"个人版连续包月（7折）：¥70 / ¥140 / ¥700","plain":"7 折只落在「连续包月」这一档上：99×0.7≈70、199×0.7≈140、999×0.7≈700。年付与连续包年是另一套数，别混。","concepts":["personal_tiers","discount_scope"]},{"id":"p3","type":"multiple","no":96,"text":"关于个人版的「年付（7 折）」与「连续包年（季享 8 折）」价格，正确的有？","options":[{"key":"A","text":"标准版年付 ¥840","note":""},{"key":"B","text":"高级版年付 ¥1,680","note":""},{"key":"C","text":"旗舰版连续包年（季享 8 折）¥6,720","note":"选这个"},{"key":"D","text":"旗舰版年付 ¥6,720","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"个人版年付（7折）¥840/¥1,680/¥8,400；连续包年（季享8折）¥672/¥1,344/¥6,720","plain":"两套价：年付按 7 折是 ¥840/¥1,680/¥8,400；连续包年再打 8 折是 ¥672/¥1,344/¥6,720。旗舰版的 ¥6,720 属于连续包年，年付是 ¥8,400——D 就是故意把两个数对调。","concepts":["personal_tiers","discount_scope"]},{"id":"p4","type":"single","no":97,"text":"客户是个人版高级版用户，他每月实际能拿到多少积分？","options":[{"key":"A","text":"4,000（只有基础积分）","note":""},{"key":"B","text":"9,000（基础 4,000 + 加固 5,000）","note":"选这个"},{"key":"C","text":"6,000（基础 4,000 + 加固 2,000）","note":""},{"key":"D","text":"50,000","note":""}],"answer":["B"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"个人版每月实际积分：500 / 4,000 / 9,000 / 50,000","plain":"「基础积分」是每档固定的那份，「加固积分（限时）」是额外送的，加起来才是实际到手。高级版 4,000 + 5,000 = 9,000；50,000 是旗舰版的数，别串档。","concepts":["credits","personal_tiers"]},{"id":"p5","type":"multiple","no":98,"text":"关于个人版各档的自动化任务数与限免说明，正确的有？","options":[{"key":"A","text":"体验版 3 个（限免 9 个月）","note":""},{"key":"B","text":"标准版 15 个（限免 9 个月）","note":""},{"key":"C","text":"高级版 30 个（限免 9 个月）","note":""},{"key":"D","text":"旗舰版 99 个","note":"选这个"}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"个人版自动化任务：3(限免9月) / 15(限免9月) / 30(限免9月) / 99","plain":"前三档带「限免 9 个月」是限时赠送的额度，旗舰版的 99 个是固定权益。跟客户承诺时要讲清哪个是限免、哪个是永久。","concepts":["automation","personal_tiers"]},{"id":"p6","type":"multiple","no":99,"text":"关于个人版各档的创建项目数、项目完成人数与个人席数，正确的有？","options":[{"key":"A","text":"体验版 5 个项目/人、3 人/项目（限免 9 个月）、3 个席位/人","note":""},{"key":"B","text":"标准版 10 个项目/人、5 人/项目、5 个席位/人","note":""},{"key":"C","text":"高级版 15 个项目/人、8 人/项目、8 个席位/人","note":""},{"key":"D","text":"旗舰版 20 个项目/人、10 人/项目、10 个席位/人","note":"选这个"}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"三组数都是 5/10/15/20 这一套递进：项目数 5→10→15→20，项目人数 3→5→8→10，席位 3→5→8→10。个人版席位到 10 为止，这就是「10 人硬顶」的由来。","concepts":["personal_tiers","version_matrix"]},{"id":"p7","type":"single","no":100,"text":"客户问「代码实现补全有多少次额度？」，正确的说法是？","options":[{"key":"A","text":"标准版、高级版、旗舰版三档均为无限次；体验版为 5,000 次/月","note":"选这个"},{"key":"B","text":"只有旗舰版是无限次，标准版与高级版按月计次","note":""},{"key":"C","text":"四档全部都是无限次","note":""},{"key":"D","text":"四档都是 5,000 次/月，没有无限次这一说","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"个人版就有无限次代码补全，别把它说成企业版专属——那是常见话术错误。只有体验版卡 5,000 次/月。","concepts":["version_matrix","personal_tiers"]},{"id":"p8","type":"bool","no":101,"text":"个人版体验版的模型调度是 Auto 模型（限免·模型可调），标准版、高级版、旗舰版均为全模型可选。","options":[{"key":"对","text":"","note":""},{"key":"错","text":"","note":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"体验版给的是 Auto 自动选模型（限时且可调），另外三档才解锁全模型可选。","concepts":["personal_tiers"]},{"id":"p9","type":"single","no":102,"text":"客户要「复杂项目高强度」使用，个人版哪一档对应该定位？","options":[{"key":"A","text":"旗舰版","note":"选这个"},{"key":"B","text":"高级版","note":""},{"key":"C","text":"标准版","note":""},{"key":"D","text":"体验版","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"个人版定位：体验=入门尝鲜 / 标准=日常轻量 / 高级=高效多项目 / 旗舰=复杂项目高强度","plain":"通用场景一句话记：体验=入门尝鲜、标准=日常轻量辅助、高级=高效多项目办公、旗舰=复杂项目高强度。客户描述的复杂度直接对号入座。","concepts":["personal_tiers"]},{"id":"p10","type":"single","no":103,"text":"客户要额外加 5,000 Credits，销售报价应该是？","options":[{"key":"A","text":"企业加量包 5,000 Credits，¥245，有效期 6 个月，单价 ¥0.049/C","note":"选这个"},{"key":"B","text":"企业加量包 5,000 Credits，¥245，有效期 1 个月","note":""},{"key":"C","text":"个人加量包 1,000 Credits，¥50，有效期 1 个月","note":""},{"key":"D","text":"企业加量包 10,000 Credits，¥480，有效期 6 个月","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"企业加量包 2,000/¥100 · 5,000/¥245 · 10,000/¥480 · 50,000/¥2,375 · 200,000/¥9,200，均 6 个月","plain":"5,000 Credits 的企业加量包是 ¥245、6 个月。有效期只有 1 个月的是个人加量包（1,000C/¥50），别把两者混着报。","concepts":["addon_pack","credits"]},{"id":"p11","type":"single","no":104,"text":"下列企业加量包中，单价最低（最划算）的是哪一档？","options":[{"key":"A","text":"200,000 Credits，¥9,200，¥0.046/C","note":"选这个"},{"key":"B","text":"50,000 Credits，¥2,375，¥0.0475/C","note":""},{"key":"C","text":"10,000 Credits，¥480，¥0.048/C","note":""},{"key":"D","text":"5,000 Credits，¥245，¥0.049/C","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"加量包单价：¥0.05 → ¥0.049 → ¥0.048 → ¥0.0475 → ¥0.046/C","plain":"买得越多单价越低，这是典型的阶梯定价。客户用量大就直接按 200,000C 那档报，总价比拆着买便宜。","concepts":["addon_pack"]},{"id":"p12","type":"multiple","no":105,"text":"关于个人加量包与企业加量包的差异，正确的有？","options":[{"key":"A","text":"企业加量包有效期 6 个月，个人加量包仅 1 个月","note":"选这个"},{"key":"B","text":"企业加量包单价 ¥0.046–0.05/C，个人加量包 ¥0.05/C，企业更便宜 2%–8%","note":"选这个"},{"key":"C","text":"个人加量包可选档位更多，比企业更灵活","note":""},{"key":"D","text":"企业加量包有 5 档可选，个人加量包仅 1 档","note":"选这个"}],"answer":["A","B","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"企业加量包在三个维度全面占优：有效期长（6 个月 vs 1 个月）、单价低（便宜 2%–8%）、可选档位多（5 档 vs 1 档）。个人加量包只有 1 档、只保一个月。","concepts":["addon_pack","credits"]},{"id":"p13","type":"single","no":106,"text":"WorkBuddy 两档企业版（SaaS 旗舰版 / 专有云版 VPC）的起购坐席数分别是？","options":[{"key":"A","text":"SaaS 旗舰版 1 坐席起，专有云版 100 坐席起","note":"选这个"},{"key":"B","text":"两档都是 1 坐席起","note":""},{"key":"C","text":"SaaS 旗舰版 100 坐席起，专有云版 1 坐席起","note":""},{"key":"D","text":"两档都是 100 坐席起","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"SaaS 旗舰 ¥198/人/月 起购 1 坐席；专有云（VPC）¥316/人/月 起购 100 坐席","plain":"旗舰版 1 坐席就能起，专有云版 100 坐席起。这是「15 人初创该选哪个」的答案依据——起购门槛低不代表没门槛。","concepts":["version_matrix","vpc_isolation"]},{"id":"p14","type":"single","no":107,"text":"关于两档企业版的数据隔离方式，正确的说法是？","options":[{"key":"A","text":"SaaS 旗舰版是公有云逻辑隔离，专有云版是腾讯云 VPC 独立部署","note":"选这个"},{"key":"B","text":"两档都是公有云逻辑隔离","note":""},{"key":"C","text":"SaaS 旗舰版是 VPC 独立部署，专有云版是公有云多租户","note":""},{"key":"D","text":"两档都是 VPC 独立部署","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"SaaS 旗舰版是「商场里的铺位」，靠逻辑隔开；专有云版是「腾讯云里给你单独隔出来的一层」，真隔离。客户问数据安全时先分清这两层。","concepts":["vpc_isolation","compliance"]},{"id":"p15","type":"single","no":108,"text":"客户要求「数据不出企业内网」，两档企业版中哪一档能做到？","options":[{"key":"A","text":"专有云版——数据不出企业内网（仅 VPC 内）；SaaS 旗舰版不满足","note":"选这个"},{"key":"B","text":"两档都满足","note":""},{"key":"C","text":"SaaS 旗舰版满足，专有云版不满足","note":""},{"key":"D","text":"两档都不满足，必须再采购私有化企业版","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"「数据不出企业内网」是专有云版的硬指标——只在 VPC 内流转。SaaS 旗舰版是公有云，做不到这一条。","concepts":["vpc_isolation","compliance"]},{"id":"p16","type":"multiple","no":109,"text":"下列能力中，SaaS 旗舰版与专有云版（VPC）都具备的有？","options":[{"key":"A","text":"SSO 单点登录 / 审计 / IP 白名单","note":"选这个"},{"key":"B","text":"Teams 团队协作","note":"选这个"},{"key":"C","text":"OpenAPI 开放","note":"选这个"},{"key":"D","text":"VPC 物理隔离","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"两档的差别集中在「隔离与部署」这一层——VPC 物理隔离、数据不出内网只有专有云有。治理能力、协作、开放能力两档是对齐的。","concepts":["vpc_isolation","governance7"]},{"id":"p17","type":"single","no":110,"text":"「专有云版（VPC）」的典型客户画像是？","options":[{"key":"A","text":"100+ 的金融 / 政企 / 医疗客户","note":"选这个"},{"key":"B","text":"10-100 人中小企业","note":""},{"key":"C","text":"个人开发者与自由职业者","note":""},{"key":"D","text":"1 人体验用户","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"专有云对标的是 100+ 的金融/政企/医疗——它们要物理隔离与行业合规；SaaS 旗舰版对标 10-100 人中小企业。100 坐席起购就是这个定位的体现。","concepts":["vpc_isolation","version_matrix"]},{"id":"p18","type":"multiple","no":111,"text":"WorkBuddy 企业版管理后台的「七大治理能力」包括哪些？","options":[{"key":"A","text":"账号与身份（SSO / 统一身份）","note":"选这个"},{"key":"B","text":"IP 白名单","note":"选这个"},{"key":"C","text":"操作日志与审计","note":"选这个"},{"key":"D","text":"沙箱逃逸防护","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"7大治理能力：账号与身份/成员管理/IP白名单/操作日志与审计/模型策略/品牌定制/企业智能体","plain":"治理能力 = 管理人、管权限、管边界、管留痕。D 那个是「技术防御层」的机制，属于安全体系那一层，不是治理后台的七项。","concepts":["governance7","security_3layer"]},{"id":"p19","type":"single","no":112,"text":"客户 IT 问「怎么防止员工在外部乱用 AI」，七大治理能力中最直接对应的是哪一项？","options":[{"key":"A","text":"IP 白名单——限制只能在公司内网 / 指定 IP 访问，防止数据外泄","note":"选这个"},{"key":"B","text":"品牌定制——把产品图标和名称改成公司自己的","note":""},{"key":"C","text":"模型策略——自定义部署 DeepSeek / 混元等模型","note":""},{"key":"D","text":"企业智能体——定制内部业务场景的智能体","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"防外带、防外泄靠的是 IP 白名单——只认公司内网或指定 IP。其他三项管的是品牌、模型和智能体，不是边界控制。","concepts":["governance7"]},{"id":"p20","type":"single","no":113,"text":"关于「模型策略」这项治理能力，正确的说法是？","options":[{"key":"A","text":"管理员可自定义部署 DeepSeek / 混元等模型，并在 VS Code / JetBrains / WorkBuddy 多端同步生效","note":"选这个"},{"key":"B","text":"只能使用官方预置模型，不允许管理员自定义","note":""},{"key":"C","text":"自定义模型仅专有云版可用，SaaS 旗舰版不支持","note":""},{"key":"D","text":"模型策略指的是给不同岗位分配不同的模型使用额度","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"模型策略给的是「用哪些模型、怎么同步」的自由度——私有化模型能多端一致。D 说的是额度分配，那是成员管理的事。","concepts":["governance7"]},{"id":"p21","type":"single","no":114,"text":"「品牌定制」这项治理能力指的是什么？","options":[{"key":"A","text":"可定制产品名称和图标，做成公司专属 AI 助手（VPC 独享）","note":"选这个"},{"key":"B","text":"可调整 WorkBuddy 客户端的界面主题配色","note":""},{"key":"C","text":"可自定义 Credits 的结算单价","note":""},{"key":"D","text":"可自定义模型的推理温度","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"品牌定制是把「腾讯的 AI 工具」变成「你们公司的 AI 工具」——名字、图标都换掉，客户内部推起来阻力小很多。注意它标注了 VPC 独享。","concepts":["governance7"]},{"id":"p22","type":"multiple","no":115,"text":"在「9 维度决策矩阵」中，属于企业版独占、个人版不具备的治理能力有？","options":[{"key":"A","text":"SSO 单点登录","note":"选这个"},{"key":"B","text":"IP 白名单","note":"选这个"},{"key":"C","text":"操作日志 / 审计","note":"选这个"},{"key":"D","text":"团队共享 Credits","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"个人付费档做团队用最大的短板就是这三样全没有：没有 SSO、没有成员授权、没有审计日志、没有 IP 白名单。D 是计费权益不是治理能力，别混进治理这一栏。","concepts":["governance7","credits"]},{"id":"p23","type":"single","no":116,"text":"在 9 维度决策矩阵中，「企业微信 Skill / 插件市场」两档企业版的标注差异是？","options":[{"key":"A","text":"SaaS 旗舰版为 ✓（v5.1.0），专有云版为 ✓✓","note":"选这个"},{"key":"B","text":"两档都是 ✓✓","note":""},{"key":"C","text":"SaaS 旗舰版为 ✓✓，专有云版为 ✓（v5.1.0）","note":""},{"key":"D","text":"两档均不支持","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"矩阵里 ✓✓ 代表专有云独享的更强权益，✓（v5.1.0）代表 SaaS 旗舰版自该版本起也支持。方向别搞反——专有云是双勾那一边。","concepts":["version_matrix","plugin_skill"]},{"id":"p24","type":"single","no":117,"text":"关于「企业自建专区」在两档企业版中的状态，正确的说法是？","options":[{"key":"A","text":"两档均为「逐步同步到端侧」","note":"选这个"},{"key":"B","text":"SaaS 旗舰版为 ✓✓，专有云版不支持","note":""},{"key":"C","text":"两档均不支持","note":""},{"key":"D","text":"仅专有云版支持，且需额外采购","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"「逐步同步到端侧」是官方给的状态标注，意思是这个能力在推进中、还没有完全铺开。两档都标这个，别说成某一档独享。","concepts":["version_matrix"]},{"id":"p25","type":"single","no":118,"text":"某客户的核心诉求是「企业数据安全、合规、等保」，但团队只有 50 人。按销售一页纸应该推荐？","options":[{"key":"A","text":"SaaS 旗舰版 + 后台治理（公有云 + SSO / 审计 / IP 白名单）","note":"选这个"},{"key":"B","text":"WorkBuddy 专有云版（VPC）","note":""},{"key":"C","text":"个人版旗舰版","note":""},{"key":"D","text":"私有化企业版（价格咨询售前）","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"按官方矩阵：企业数据安全 / 合规等保 → SaaS 旗舰版 + 后台治理；只有「100+ / 行业合规 / 物理隔离」才推专有云版。50 人不满足后者。","concepts":["version_matrix","compliance"]},{"id":"p26","type":"single","no":119,"text":"「企业专属活动（2026.7.1–9.30）」的适用版本与赠送标准是？","options":[{"key":"A","text":"企业旗舰版或企业专享版，按 2,000 Credits / 账号 / 月 标准赠送","note":"选这个"},{"key":"B","text":"个人版任意档位，按 2,000 Credits / 人 / 月 赠送","note":""},{"key":"C","text":"所有企业版，按 5,000 Credits / 账号 / 月 赠送","note":""},{"key":"D","text":"仅专有云版，按 2,000 Credits / 账号 / 月 赠送","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"企业专属活动：企业旗舰版/企业专享版，2,000 Credits/账号/月","plain":"三个关键限定：版本是企业旗舰版或企业专享版、基准是 2,000 Credits 每账号每月、只覆盖新购/续费/扩容。个人版不参与。","concepts":["enterprise_activity","credits"]},{"id":"p27","type":"single","no":120,"text":"按「企业专属活动」规则，10 人的企业旗舰版团队参与 6 个月，每月可获多少 Credits、累计多少？","options":[{"key":"A","text":"每月 40,000C（含基础 20,000C + 加赠 20,000C），累计 240,000C","note":"选这个"},{"key":"B","text":"每月 20,000C，累计 120,000C","note":""},{"key":"C","text":"每月 40,000C，累计 2,400,000C","note":""},{"key":"D","text":"每月 2,000C，累计 12,000C","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"活动计算：赠送量 = 2,000 × 账号数 × 月数；10 人 × 6 月 = 每月 40,000C，累计 240,000C","plain":"官方示例：10 人 × 6 个月 = 每月 40,000C（基础 20,000C + 加赠 20,000C），累计 240,000C。赠送部分单独算是 2,000 × 10 × 6 = 120,000C。","concepts":["enterprise_activity","credits"]},{"id":"p28","type":"multiple","no":121,"text":"关于「企业专属活动」的限制条件，正确的有？","options":[{"key":"A","text":"仅限标准价格体系客户，不与其他优惠叠加","note":"选这个"},{"key":"B","text":"退费则赠送 Credits 销账，已使用不退","note":"选这个"},{"key":"C","text":"按历史价格签约的客户不参与","note":"选这个"},{"key":"D","text":"赠送 Credits 可与加量包同时叠加使用","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"官方四条限制里三条是收紧的：标准价格体系客户、不与其他优惠叠加、退费销账已使用不退、历史价格客户不参与。第四条「能与加量包叠加」原文没写，别自己加。","concepts":["enterprise_activity","credits"]},{"id":"p29","type":"bool","no":122,"text":"「企业专属活动（2026.7.1–9.30）」至今仍然有效，客户现在下单仍可按 2,000 Credits / 账号 / 月 获赠。","options":[{"key":"对","text":"","note":""},{"key":"错","text":"","note":""}],"answer":["错"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"企业专属活动期间 2026.7.1–9.30，已结束","plain":"活动窗口是 2026.7.1–9.30，已经过了。现在口头承诺「照样送」是拿不出依据的，真出问题就是纠纷。","concepts":["enterprise_activity"]},{"id":"p30","type":"single","no":123,"text":"客户要求「SaaS 企业版也给我 7 折」。按折扣红线，正确的答复是？","options":[{"key":"A","text":"7 折仅适用于个人版连续包月；SaaS 企业版（¥198/人/月）与专有云版（¥316/人/月）的连续包月不享 7 折，按标准月付价计算","note":"选这个"},{"key":"B","text":"所有版本都能 7 折，报价时自行掌握","note":""},{"key":"C","text":"只有加量包可以打折，主产品一律不打折","note":""},{"key":"D","text":"企业版可以给 7 折，但报价单仍按标准月付价写","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"折扣红线：7 折仅适用个人版连续包月 ¥70/¥140/¥700；企业版 ¥198 与 ¥316 不享 7 折","plain":"折扣红线最容易说错的一句话：「7 折只适用于个人版连续包月」。企业版两档都按标准月付价算，想给折扣得走审批流程，不能自己拍。","concepts":["discount_scope","redline"]},{"id":"p31","type":"bool","no":124,"text":"SaaS 企业版（¥198/人/月）与 WorkBuddy 专有云版（¥316/人/月）的连续包月不享 7 折，报价按标准月付价计算。","options":[{"key":"对","text":"","note":""},{"key":"错","text":"","note":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":true},"anchor":"","plain":"记住一句就够：企业版两档不打折，按标准月付价报。这题就是考「个人版优惠能不能套到企业版」。","concepts":["discount_scope","redline"]},{"id":"p32","type":"single","no":125,"text":"客户问「我先买个人付费档给团队用，行不行？」按官方 FAQ 的正确答复是？","options":[{"key":"A","text":"能用到团队上限，但没有团队管理后台——没有 SSO、成员授权、审计日志、IP 白名单；10 人以下可短期试用，10 人以上强烈建议上 SaaS 旗舰版（团队共享 Credits 池）","note":"选这个"},{"key":"B","text":"不行，个人版严禁任何团队使用","note":""},{"key":"C","text":"可以，个人版天然支持团队共享与审计","note":""},{"key":"D","text":"买 3 个个人版账号即可拼成团队","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"别一口回绝「不行」，那会直接丢单。正确姿势是：能用、但没有治理能力，10 人以下先试用，10 人以上往 SaaS 旗舰版引。加量包有效期也是 6 个月 vs 个人 1 个月。","concepts":["triage","governance7"]},{"id":"p33","type":"single","no":126,"text":"客户问「个人版加量包和企业版加量包，有效期差多少？」正确答复是？","options":[{"key":"A","text":"企业加量包 6 个月，个人加量包仅 1 个月","note":"选这个"},{"key":"B","text":"两档都是 6 个月","note":""},{"key":"C","text":"两档都是 1 个月","note":""},{"key":"D","text":"企业加量包 1 个月，个人加量包 6 个月","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"个人加量包 1 个月 vs 企业加量包 6 个月","plain":"这是 FAQ 里明确给的对比：加量包有效期 6 个月（个人仅 1 个月）。个人加量包只有 1,000C/¥50 一档。","concepts":["addon_pack","credits"]},{"id":"p34","type":"bool","no":127,"text":"企业版一个 License 同时覆盖 CodeBuddy 与 WorkBuddy，全员共享一个 Credits 池；而个人版是单一产品单一用户。","options":[{"key":"对","text":"","note":""},{"key":"错","text":"","note":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"官方原话：企业版=全员 AI 通用，个人版=单一产品单一用户。这两句能直接回答「为什么要上企业版」。","concepts":["version_matrix"]},{"id":"p35","type":"single","no":128,"text":"客户研发负责人问「是不是要再买一套 CodeBuddy？」按 FAQ 的正确回答是？","options":[{"key":"A","text":"不是，一个 License 双产品通用；研发用 CodeBuddy 写代码，运营/HR 用 WorkBuddy 办公，全员共享一个 Credits 池","note":"选这个"},{"key":"B","text":"是的，CodeBuddy 需要单独购买一套授权","note":""},{"key":"C","text":"只有专有云版才包含双产品","note":""},{"key":"D","text":"双产品需要在企业自建专区单独开通","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"这是 FAQ 原话：一个 License 双产品通用、全员共享一个 Credits 池。这题考的是别把「双产品」误答成「两个 License」。","concepts":["version_matrix","credits"]},{"id":"p36","type":"single","no":129,"text":"客户问「WorkBuddy 也有专有云（VPC）版本吗？」正确回答是？","options":[{"key":"A","text":"有。专有云版（VPC 独立部署）面向 100+ 客户的金融 / 政企 / 医疗行业，满足物理隔离与行业合规要求","note":"选这个"},{"key":"B","text":"没有，WorkBuddy 企业版只有 SaaS 一个形态","note":""},{"key":"C","text":"有，但价格需另行咨询私有化售前","note":""},{"key":"D","text":"有，个人版也可以直接开通","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"注意区分：专有云版（VPC）是有标准报价 ¥316/人/月、100 坐席起的产品；需要询价的「私有化」是另一回事。别把这两个混了。","concepts":["vpc_isolation","version_matrix"]},{"id":"p37","type":"bool","no":130,"text":"企业版用户数据隔离，不会用于模型训练；SaaS 旗舰版走腾讯云公有云标准安全，专有云版走腾讯云 VPC 物理隔离，操作全留痕、可审计。","options":[{"key":"对","text":"","note":""},{"key":"错","text":"","note":""}],"answer":["对"],"flags":{"confirmed":true,"recommended":false,"hot":false},"anchor":"","plain":"两句话回答客户最敏感的问题：不训练 + 隔离方式。两档企业版都不用于模型训练，差别在隔离层级。","concepts":["compliance","vpc_isolation"]},{"id":"p38","type":"multiple","no":131,"text":"「一个 License 双产品通用」覆盖了哪些岗位场景？","options":[{"key":"A","text":"研发：代码补全 / 单测 / Bug 定位 / 架构评审","note":"选这个"},{"key":"B","text":"产品设计：PRD 草拟 / Figma 还原 / 演示文稿","note":"选这个"},{"key":"C","text":"运营 / HR / 招聘：海报 / 视频 / 招聘 JD / 合同","note":"选这个"},{"key":"D","text":"销售：远程客户 / 资料 / 生成方案 / 跟进邮件","note":"选这个"}],"answer":["A","B","C","D"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"这是官方给「全员 AI 通用」的举证清单，四类岗位全都能用。客户是混合岗位团队时，用这张清单比讲参数有说服力。","concepts":["version_matrix"]},{"id":"p39","type":"single","no":132,"text":"「企业版 vs 个人版 · 4 大核心差异」中，「双产品 License 一份付费」意味着？","options":[{"key":"A","text":"企业版 = 全员 AI 通用（一个 License 打通 CodeBuddy + WorkBuddy），个人版 = 单一产品单一用户","note":"选这个"},{"key":"B","text":"企业版只是多送一个 CodeBuddy，其余能力与个人版完全一样","note":""},{"key":"C","text":"个人版也能双产品通用，只是要买两份授权","note":""},{"key":"D","text":"企业版 = 全员 AI 通用，个人版 = 多产品多用户","note":""}],"answer":["A"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"记住官方那组对照：企业版=全员 AI 通用，个人版=单一产品单一用户。D 错在给个人版也安上了「多用户」。","concepts":["version_matrix"]},{"id":"p40","type":"multiple","no":133,"text":"「企业专属活动」赠送的 Credits，其标准、去向与有效期，正确的有？","options":[{"key":"A","text":"按 2,000 Credits / 账号 / 月 的标准赠送","note":"选这个"},{"key":"B","text":"Credits 进入团队共享池","note":"选这个"},{"key":"C","text":"有效期 6 个月","note":"选这个"},{"key":"D","text":"只能用于加量包对应的产品，不进共享池","note":""}],"answer":["A","B","C"],"flags":{"confirmed":true,"recommended":false,"hot":false},"plain":"三个要点：2,000/账号/月、进团队共享池、有效期 6 个月。共享池这一条特别重要——它正是「企业版积分团队共享」这个机制的官方活动版本。","concepts":["enterprise_activity","credits"]}];
const CONCEPTS = {"sandbox":{"t":"沙箱（Bash 命令沙箱）","life":"像给 AI 发了一套“一次性塑料手套 + 隔离操作台”。它能在台子上切菜做饭（执行命令），但碰不到你家真实厨房的刀架和燃气（真实操作系统）。就算它手滑把台子搞砸了，你家厨房毫发无损。","body":"Bash 命令沙箱把 AI 执行的命令关在隔离环境里，和你的真实系统严格分开，防止 AI 误操作搞坏系统。它不是“禁止执行”，也不是“每条命令审批”，而是“隔离跑、跑坏了不连累真机”。"},"gateway":{"t":"安全通信网关","life":"像公司前台 + 门禁卡。外部系统要连进来，不能谁敲门都进，得亮出 Gateway Token（门禁卡），再配合 SSO/企业认证和 Role 权限（前台核对身份+权限），确认是本人才放行。没卡或卡不对，一律拒之门外——连接身份就不会被伪造。","body":"安全通信网关用 Gateway Token 认证 + 连接鉴权 + SSO/企业认证 + Role 权限控制，确保每一次连接都经过严格验证。不是“内网物理隔离就完事”，也不是“只靠账号密码”。"},"private_deploy":{"t":"私有化部署","life":"别人家（SaaS/公有云）是把你数据放公共仓库，私有化是你自己盖个带锁的库房，钥匙和运行环境都在你家。金融、政企这种“数据不出门”的客户，就要这个。","body":"私有化企业版部署在企业自有环境，数据不出企业、自主运维；价格需咨询售前，没有标准报价单。区别于旗舰版（共享 VPC）/专享版（专享 VPC，云上专属、物理隔离级别）。"},"connector_vs_kb":{"t":"连接器 vs 资料库","life":"资料库是公司内部书架（沉淀内部知识，给 AI 读）；连接器是公司大门外的快递柜/API（连外部服务，给 AI 取实时数据）。别把“内部书架”和“外部快递”搞混——说“连接器用内部知识”就是张冠李戴。","body":"资料库=内部知识沉淀与检索；连接器=连接外部业务服务/API 取实时数据。两者都是扩展机制，但一个对内一个对外。"},"plugin_skill":{"t":"插件 / 技能","life":"技能像手机 App。官方内置一批（文档处理、报表、海报…），也能从社区（OpenClaw）装别人的，还能用自然语言让 AI 现做一个你公司的专属流程。不是“只能用官方几个”，也不是“装越多越牛”（开一堆反而乱）。","body":"WorkBuddy 内置多技能包，兼容 OpenClaw 社区技能导入，支持自然语言创建自定义技能。不建议一次性全开。"},"mcp":{"t":"MCP（模型连接协议）","life":"MCP 是 AI 和外部工具之间的“通用插头标准”。就像 USB-C，不管什么设备，插上就能通。专家/Skill 配了 MCP，就能在授权下访问文件或外部服务。","body":"MCP 是模型连接外部工具/数据的开放协议标准。专家本身不主动拿权限，配了 Skill/MCP 后才在用户授权下间接访问。"},"managed_agents":{"t":"托管 Agent（Managed Agents）","life":"普通 Agent 像你本人坐在电脑前干活（人走茶凉，关机就停）。Managed Agents 像雇了个 7×24 驻场外包，住在云端沙箱里，半夜也能跑长任务、自动触发、还能把成果一键下发到你同事的 WorkBuddy 端。","body":"WorkBuddy Managed Agents 提供云端托管的智能体运行服务，Agent 在云端沙箱运行，适合长程任务、在线客服、自动触发；可一键下发至 WorkBuddy 端。注意：用本地“助理”远程下发任务时，你电脑得保持开机。"},"credits":{"t":"积分 / 计费（Credits）","life":"积分像公司话费池。每席每月 2,000 Credits 汇入共享池，用得少的同事结余，能被用得狠的同事“薅”走——所以席位越多，池子越大、利用率越高。不够了买加量包（如 245 元/5,000 Credits，6 个月有效），不用升版本。加量包会“先用先到期”。","body":"企业版积分团队内共享、每月刷新、对话不限频。加量包补充用量、有效期 6 个月、系统优先消耗最先到期的。"},"redline":{"t":"红线（禁说错话）","life":"红线是公司定的“绝对不能说的错话”。比如不能说“企业版 AI 更聪明所以更贵”——因为核心 AI 能力个人旗舰版全有，客户一比就穿帮。企业版卖的是“治理能力”（看得见、留得下、收得回），不是更聪明的模型。","body":"红线清单是官方禁止的话术/说法。常见坑：把价格差异说成“模型更聪明”、签约前藏着不说积分过期（红线第5条：要主动说清）、用“10 人硬顶”逼单而非糊弄。"},"security_3layer":{"t":"安全三层纵深防御","life":"三层纵深防御像小区安保：技术防御层（沙箱、文件隔离、防逃逸——物理隔断坏人）、管理管控层（权限、二次确认——进门要登记）、合规审计层（安全审计、skill-scanner、数据本地不上传——事后追责+源头不传）。","body":"技术防御层（Bash 沙箱/文件隔离/防逃逸）+ 管理管控层（权限/二次确认）+ 合规审计层（合规审计/skill-scanner/数据本地执行不上传）。“数据用于训练”永远不选。"},"permission":{"t":"权限与二次确认","life":"默认权限像“访客模式”——AI 要删文件、改工作区外文件、跑脚本，会弹窗让你确认（二次确认）。完全访问权限像“给了万能钥匙”，日常用反而更危险。弹窗别看次数少就觉得安全，要看“它要干嘛、动到哪、是不是任务必需”。","body":"默认权限下敏感操作弹二次确认；完全访问权限不适合日常长期用（反话陷阱）。二次确认核对：操作内容、影响范围、执行理由。"},"workspace":{"t":"工作空间","life":"工作空间像你这个项目专属的文件夹。任务存进去就能持久保存、随时用 IDE 打开、和同事协作。升级/重启后找不到历史？去 WorkBuddy 大文件夹里按日期/自定义名找，别去安装目录翻。","body":"工作空间是任务与文件的持久容器。保存到工作空间 = 持久化+可协作。历史丢失时从 WorkBuddy 主文件夹（非安装目录）按日期找回。"},"compliance":{"t":"合规（数据不出事）","life":"合规就是“凭什么证明你不作恶”。WorkBuddy 符合《网络安全法》《数据安全法》《个人信息保护法》，数据服务端用后即弃、不留存、不训练。","body":"合规审计层 + 符合国内三法。服务端仅处理数据片段、用后即弃、不用于训练。"},"https_tls":{"t":"传输加密（HTTPS / TLS）","life":"HTTPS/TLS 像给数据装了防窃听信封。全程加密，中间人拆不开、改不了。不是“只在登录时加密”，也不是“明文传任务数据”。","body":"全链路 HTTPS，支持 TLS 1.2/1.3，防窃听/篡改/中间人。"},"version_matrix":{"t":"版本矩阵（买哪个）","life":"旗舰版=共享 VPC 的精装公寓；专享版=专享 VPC 带独立门禁（316 元/人/月，专有云物理隔离，100 人起）；私有化=整栋楼买断自己管（价格问售前）。旗舰版不含专属插件（那是版本权益不是治理能力）。","body":"旗舰版(共享 VPC) / 专享版(专享 VPC, 316 元/月, 100 起) / 私有化(企业自有, 询价)。专属插件是版本权益不是治理能力。"},"competitor":{"t":"竞品打击（怎么打）","life":"打竞品要打在痛处。悟空+钉钉：痛点是“只活在钉钉里、技能生态单薄”（别打“协作差”——钉钉恰恰强协作）。打代码类竞品：“研发味重、职能岗用不起来”。打模型聚合类：“模型多不等于能落地”。","body":"39 项实测分竞品话术。悟空+钉钉→“只活在钉钉里，技能生态单薄”。"},"triage":{"t":"分诊 / 转版话术","life":"分诊是“听客户一句话，判断他卡在哪”。伪装的好评（“我自己用挺好”）最危险——别问满意度，问人数（10 人天花板测试）。个人版想试？给他一条“试完不用推倒重来”的路：拉几个同事进一个项目，将来直接升企业坐席。","body":"分诊框架识别真实意图。“我先买个人版试试”→不拦，引导未来可平滑升级企业。“10 人硬顶”→第 11 人进不去，不是钱的问题。"},"automation":{"t":"自动化任务","life":"自动化像定好的闹钟任务。不会写提示词？直接用任务模板（新闻推送、周报、体检预约…）。别一上来就高频正式跑——先试运行。","body":"自动化支持任务模板、定时触发。应先试运行再高频率正式执行。"},"multimodal":{"t":"文件读取 / 多模态","life":"AI 读不了图片/PDF/Excel？多半是模型不支持该类型，或没装对应插件/Skill。就像播放器没装解码器放不了某格式。","body":"读文件失败→模型不支持或缺少插件/Skill。"},"agent_assistant":{"t":"助理（远程控制）","life":"助理像你手机上的遥控器，能微信/企微/飞书远程指挥电脑上的 WorkBuddy。但遥控器的前提是“电视开着”——电脑得保持开机运行 WorkBuddy，否则云端任务也接不住。助理≠连接器（一个是远程控制入口，一个是外部服务对接）。","body":"助理支持多 IM 远程控制；需电脑开机。助理和连接器不是一回事。"},"personal_tiers":{"t":"个人版四档（体验/标准/高级/旗舰）","life":"像健身房会员卡分档：体验版是免费试穿一次的标准 ¥0、标准版是够用的月卡 ¥99、高级版是多项目次卡 ¥199、旗舰版是复杂项目的私教卡 ¥999。关键在于——这四档全是「给你一个人用的」，一旦要组队、切权限、留审计，就得换企业版。","body":"个人版四档月付 ¥0/¥99/¥199/¥999；连续包月 7 折 ¥70/¥140/¥700；年付 7 折 ¥840/¥1,680/¥8,400；连续包年（季享 8 折）¥672/¥1,344/¥6,720。每月实际积分 500/4,000/9,000/50,000。"},"addon_pack":{"t":"加量包（个人 vs 企业）","life":"像手机套餐加油包：企业加量包量大、单价更低、有效期更长，像公司集采的批量加油卡；个人加量包只有一档、只保一个月，像临时应急的便利店充值。","body":"个人加量包 1,000C/¥50/1 个月/¥0.05-C。企业加量包 5 档：2,000C/¥100、5,000C/¥245、10,000C/¥480、50,000C/¥2,375、200,000C/¥9,200，均 6 个月，单价 ¥0.05→¥0.046/C。企业比个人便宜 2%–8%。"},"vpc_isolation":{"t":"专有云（VPC）隔离","life":"像合租公寓和独栋楼：SaaS 旗舰版是商场里的一个铺位，隔音靠物业（逻辑隔离）；专有云版是在腾讯云里给你单独隔出来的一整层，有独立门禁（物理隔离），数据只在这一层里跑。","body":"SaaS 旗舰版 ¥198/人/月、1 坐席起、腾讯云公有云逻辑隔离；专有云版 ¥316/人/月、100 坐席起、腾讯云 VPC 独立部署，可满足 VPC 物理隔离与「数据不出企业内网（仅 VPC 内）」。"},"governance7":{"t":"七大治理能力","life":"像公司装修的七道门禁：账号身份是工牌、成员管理是门禁权限表、IP 白名单是只认公司 WiFi、操作日志是监控录像、模型策略是统一发的工具箱、品牌定制是贴自己牌匾、企业智能体是自己搭的工作台。","body":"账号与身份（SSO/统一身份）、成员管理（批量导入/邀请/授权）、IP 白名单、操作日志与审计、模型策略（自定义部署 DeepSeek/混元，多端同步）、品牌定制（图标/名称自定义，VPC 独享）、企业智能体（自定义大模型编排，VPC 上网）。"},"enterprise_activity":{"t":"企业专属活动（2026.7.1–9.30）","life":"像限时促销：只有在这个窗口期内、按规定的版本和价格买，才能拿到赠品。活动一结束就没了——不能靠嘴承诺「我们照样送」。","body":"适用企业旗舰版或企业专享版，新购/续费/扩容按 2,000 Credits/账号/月 赠送，进团队共享池，有效期 6 个月。示例：10 人 × 6 个月 = 每月 40,000C（基础 20,000C + 加赠 20,000C），累计 240,000C。仅限标准价格体系客户，不与其他优惠叠加，退费则赠送 Credits 销账、已使用不退，按历史价格签约客户不参与。"},"discount_scope":{"t":"折扣红线（7 折适用范围）","life":"像公司授权的优惠权限清单：清单上有的才能打折，清单上没有的一律按标准价。销售最容易在这里说错，把「能打折」说成「都能打折」。","body":"「7 折」仅适用于个人版连续包月（标准 ¥70 / 高级 ¥140 / 旗舰 ¥700；体验版免费不涉及付费档）。SaaS 企业版（¥198/人/月）与 WorkBuddy 专有云版（¥316/人/月）的连续包月不享 7 折，按标准月付价计算，报价时按此口径。"}};

pacity:1;"/></clipPath></defs></svg>`;
const TYPE_LABEL={single:"单选",multiple:"多选",bool:"判断"};
const WEIGHT={single:2,multiple:3,bool:1};
const STORE_KEY="wb_exam_wrongbook_v1";

/* ---------- storage ---------- */
function loadWrong(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return[]}}
function saveWrong(a){try{localStorage.setItem(STORE_KEY,JSON.stringify(a))}catch(e){}}
function isWrong(id){return loadWrong().includes(id)}
function toggleWrong(id){let a=loadWrong();if(a.includes(id))a=a.filter(x=>x!==id);else a.push(id);saveWrong(a);return a.includes(id)}
function clearWrong(){saveWrong([])}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cleanNote(s){return String(s||"").replace(/[⭐🔥⚠️✅]/g,"").replace(/^[\s·]+/,"").trim();}
const fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
const $view=document.getElementById("view");
const $back=document.getElementById("backBtn");
const $topTitle=document.getElementById("topTitle");
const $topRight=document.getElementById("topRight");

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';

let state={view:"home",back:"home"};

function setBar(title,right){
  $topTitle.textContent=title||"";
  $topRight.innerHTML=right||"";
  const home=state.view==="home";
  $back.classList.toggle("hidden",home);
  document.getElementById("brandMark").style.display=home?"":"none";
}
function go(view,back){
  state.view=view;state.back=back||"home";
  window.scrollTo(0,0);
  render();
}

/* ---------- explanation builder ---------- */
/* 三段式解析：正确答案 -> 白话讲解 -> 相关知识卡。
   不再渲染“× A 至少不是这个”这类直接点破对错的批注，避免一翻面就剧透。 */
function buildAnswer(q){
  let h='<div class="ex-ans"><span class="ex-label">正确答案</span>';
  h+=q.answer.map(k=>'<span class="ans-key">'+k+'</span>').join(q.type==="multiple"?"　":"");
  h+='</div>';
  if(q.anchor)h+='<div class="ex-anchor"><span class="ex-label">锚点</span>'+esc(q.anchor)+'</div>';
  return h;
}
function buildPlain(q){
  if(!q.plain)return "";
  return '<div class="ex-plain"><span class="ex-label">白话讲解</span><p>'+esc(q.plain)+'</p></div>';
}
function buildConcepts(q){
  if(!q.concepts||!q.concepts.length)return "";
  let h='<div class="ex-concepts"><span class="ex-label">相关知识卡</span><div class="cc-list">';
  q.concepts.forEach(cid=>{
    const c=CONCEPTS[cid];if(!c)return;
    h+='<div class="cc-card">'+
        '<div class="cc-t">'+esc(c.t)+'</div>'+
        '<div class="cc-life">'+esc(c.life)+'</div>'+
        '<div class="cc-body">'+esc(c.body)+'</div>'+
      '</div>';
  });
  h+='</div></div>';
  return h;
}
/* 选项行：可标记正确项（翻面后高亮答案） */
function optsHtml(q,markCorrect){
  return q.options.map(o=>{
    const corr=markCorrect&&q.answer.includes(o.key);
    return '<div class="opt'+(corr?" correct":"")+'"><span class="lk">'+o.key+'</span><span class="lt">'+esc(o.text)+'</span></div>';
  }).join("");
}

/* ---------- flag tags ---------- */
function flagTags(q){
  let h="";
  if(q.flags&&q.flags.hot)h+='<span class="tag hot">高频必背</span>';
  if(q.flags&&q.flags.recommended)h+='<span class="tag rec">推荐答案</span>';
  return h;
}
